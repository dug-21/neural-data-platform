# Docker Compose Override Example for External Drive Mounting
# Copy this file to docker-compose.override.yml and customize as needed
# Docker Compose automatically reads override files

version: '3.8'

services:
  # Override data-ingestion service to add custom volume mounts
  data-ingestion:
    volumes:
      # Add additional volume mounts here
      # Example: Multiple external drives
      # - /mnt/drive1:/mnt/historical-data:ro
      # - /mnt/drive2:/mnt/backup-data:ro
      # - /media/usb/trading:/mnt/usb-data:ro
      
      # Example: Network share
      # - /mnt/nas/trading-data:/mnt/network-data:ro
      
      # Example: Local development data with write access
      # - ./local-data:/mnt/dev-data:rw
      
      # Example: Bind mount with specific user/group (Linux)
      # - type: bind
      #   source: /external/trading-data
      #   target: /mnt/external-data
      #   read_only: true
      #   bind:
      #     propagation: rslave

    # Override environment variables for external data
    environment:
      # Custom paths for different data sources
      # - HISTORICAL_DATA_PATH=/mnt/historical-data
      # - BACKUP_DATA_PATH=/mnt/backup-data
      # - ARCHIVE_DATA_PATH=/mnt/network-data
      
      # Enable debug logging for data loading
      # - DATA_LOADER_DEBUG=true
      
      # Custom data source priorities
      # - DATA_SOURCE_PRIORITY=external,database,api

  # Override neural-trader service for additional mounts
  neural-trader:
    volumes:
      # Same external drives as data-ingestion
      # - /mnt/drive1:/mnt/historical-data:ro
      # - /mnt/drive2:/mnt/backup-data:ro
      
      # Model storage on external drive
      # - /mnt/models:/app/models:ro
      
      # Configuration overrides from external source
      # - /mnt/configs/prod:/app/config/external:ro

    environment:
      # Path configurations
      # - MODEL_PATH=/app/models
      # - EXTERNAL_CONFIG_PATH=/app/config/external

  # Example: Add a data preprocessing service with external mount
  # data-preprocessor:
  #   image: neural-trader-preprocessor:latest
  #   volumes:
  #     - ${EXTERNAL_MOUNT_PATH}:/data/input:ro
  #     - ./processed-data:/data/output:rw
  #   environment:
  #     - INPUT_PATH=/data/input
  #     - OUTPUT_PATH=/data/output
  #   profiles:
  #     - preprocessing

# Example: Define named volumes for external mounts
# volumes:
#   external_historical:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /mnt/historical-drive
#   
#   external_models:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /mnt/model-storage

# Example: Custom networks for data isolation
# networks:
#   data_network:
#     driver: bridge
#     internal: true  # No external access for security