# Production Docker Compose Configuration with Security Hardening
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.secure.yml up

version: '3.8'

# Define networks with proper isolation
networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  backend:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.22.0.0/24
  monitoring:
    driver: bridge
    internal: true  # No external access
    ipam:
      config:
        - subnet: 172.23.0.0/24

# Define secrets for secure credential management
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  api_keys:
    file: ./secrets/api_keys.json
  ssl_cert:
    file: ./secrets/ssl_cert.pem
  ssl_key:
    file: ./secrets/ssl_key.pem

services:
  # =============================================================================
  # DATABASE SERVICES
  # =============================================================================
  timescaledb:
    restart: always
    networks:
      - backend
    ports: []  # Remove external port exposure
    secrets:
      - postgres_password
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_SHARED_BUFFERS=8GB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=24GB
      - POSTGRES_MAINTENANCE_WORK_MEM=2GB
      - POSTGRES_WORK_MEM=512MB
      - POSTGRES_MAX_CONNECTIONS=500
      - POSTGRES_LOG_STATEMENT=all
      - POSTGRES_LOG_DURATION=on
      - POSTGRES_SSL=on
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/run/postgresql:noexec,nosuid,nodev
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=timescaledb"
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 16G
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neural_trader -d neural_trader_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    restart: always
    networks:
      - backend
    ports: []  # Remove external port exposure
    secrets:
      - redis_password
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/run/redis:noexec,nosuid,nodev
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        labels: "service=redis"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # =============================================================================
  # APPLICATION SERVICES
  # =============================================================================
  data-ingestion:
    restart: always
    networks:
      - backend
      - monitoring
    ports: []  # Remove external port exposure
    secrets:
      - api_keys
    environment:
      - LOG_LEVEL=WARNING
      - PYTHONOPTIMIZE=1
      - PYTHONPATH=/app
      - API_KEYS_FILE=/run/secrets/api_keys
      - DATABASE_URL=postgresql://neural_trader@timescaledb:5432/neural_trader_db
      - REDIS_URL=redis://redis:6379/0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /app/logs:noexec,nosuid,nodev
      - /app/cache:noexec,nosuid,nodev
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        labels: "service=data-ingestion"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
      replicas: 3
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
        monitor: 60s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  neural-trader:
    restart: always
    networks:
      - frontend
      - backend
      - monitoring
    ports: []  # Remove external port exposure (nginx will handle)
    secrets:
      - jwt_secret
      - encryption_key
      - api_keys
    environment:
      - RUST_LOG=warn
      - RUST_BACKTRACE=0
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - API_KEYS_FILE=/run/secrets/api_keys
      - DATABASE_URL=postgresql://neural_trader@timescaledb:5432/neural_trader_db
      - REDIS_URL=redis://redis:6379/0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /app/logs:noexec,nosuid,nodev
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=neural-trader"
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
        reservations:
          cpus: '4'
          memory: 4G
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
        monitor: 60s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # =============================================================================
  # MONITORING SERVICES
  # =============================================================================
  prometheus:
    restart: always
    networks:
      - monitoring
    ports: []  # Remove external port exposure
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.external-url=https://monitoring.yourdomain.com/prometheus'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=prometheus"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    restart: always
    networks:
      - monitoring
      - frontend
    ports: []  # Remove external port exposure
    secrets:
      - grafana_admin_password
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_SERVER_ROOT_URL=https://monitoring.yourdomain.com
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=grafana@yourdomain.com
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/lib/grafana/plugins:noexec,nosuid,nodev
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=grafana"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # REVERSE PROXY AND LOAD BALANCER
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: neural_trader_nginx
    restart: always
    networks:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    secrets:
      - ssl_cert
      - ssl_key
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/security.conf:/etc/nginx/conf.d/security.conf:ro
      - ./docker/nginx/rate-limiting.conf:/etc/nginx/conf.d/rate-limiting.conf:ro
      - /run/secrets/ssl_cert:/etc/nginx/ssl/cert.pem:ro
      - /run/secrets/ssl_key:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - neural-trader
      - grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /var/cache/nginx:noexec,nosuid,nodev
      - /var/run:noexec,nosuid,nodev
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        labels: "service=nginx"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # SECURITY MONITORING
  # =============================================================================
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: neural_trader_fail2ban
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./docker/fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      - ./docker/fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      - /var/log:/var/log:ro
      - fail2ban_data:/data
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=fail2ban"

  # =============================================================================
  # BACKUP SERVICE
  # =============================================================================
  backup:
    image: postgres:16-alpine
    container_name: neural_trader_backup
    restart: always
    networks:
      - backend
    secrets:
      - postgres_password
    environment:
      - PGPASSWORD_FILE=/run/secrets/postgres_password
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
    volumes:
      - ./backups:/backups
      - ./docker/scripts/secure-backup.sh:/secure-backup.sh:ro
    command: /bin/sh -c "while true; do /secure-backup.sh; sleep 21600; done"  # Every 6 hours
    depends_on:
      - timescaledb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=backup"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # =============================================================================
  # LOG AGGREGATION
  # =============================================================================
  loki:
    image: grafana/loki:latest
    container_name: neural_trader_loki
    restart: always
    networks:
      - monitoring
    ports: []
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=loki"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  promtail:
    image: grafana/promtail:latest
    container_name: neural_trader_promtail
    restart: always
    networks:
      - monitoring
    volumes:
      - ./docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=promtail"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  timescale_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/neural-trader/timescale
  timescale_logs:
    driver: local
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/neural-trader/redis
  ingestion_logs:
    driver: local
  ingestion_cache:
    driver: local
  trader_logs:
    driver: local
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/neural-trader/prometheus
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/neural-trader/grafana
  loki_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/neural-trader/loki
  fail2ban_data:
    driver: local