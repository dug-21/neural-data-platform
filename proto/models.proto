syntax = "proto3";
package neural_trader.models.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common.proto";

service ModelManagementService {
  // Model training
  rpc TrainModel(TrainingRequest) returns (stream TrainingStatus);
  rpc GetTrainingJob(TrainingJobRequest) returns (TrainingJob);
  rpc CancelTrainingJob(CancelTrainingRequest) returns (CancelTrainingResponse);
  
  // Model deployment
  rpc DeployModel(DeploymentRequest) returns (DeploymentResponse);
  rpc UndeployModel(UndeploymentRequest) returns (UndeploymentResponse);
  rpc GetModelStatus(ModelStatusRequest) returns (ModelStatus);
  
  // Model inference
  rpc Predict(PredictionRequest) returns (PredictionResponse);
  rpc BatchPredict(BatchPredictionRequest) returns (BatchPredictionResponse);
  
  // Model management
  rpc ListModels(ListModelsRequest) returns (ModelList);
  rpc GetModelMetadata(ModelMetadataRequest) returns (ModelMetadata);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
  
  // A/B Testing
  rpc CreateExperiment(ExperimentRequest) returns (ExperimentResponse);
  rpc GetExperimentResults(ExperimentResultsRequest) returns (ExperimentResults);
  
  // Health and metrics
  rpc GetServiceHealth(google.protobuf.Empty) returns (neural_trader.common.v1.ServiceHealth);
  rpc GetServiceMetrics(google.protobuf.Empty) returns (neural_trader.common.v1.ServiceMetrics);
}

message TrainingRequest {
  string model_name = 1;
  ModelType model_type = 2;
  TrainingConfig config = 3;
  DataConfig data_config = 4;
  HyperParameters hyperparameters = 5;
}

message TrainingConfig {
  int32 epochs = 1;
  double learning_rate = 2;
  int32 batch_size = 3;
  double validation_split = 4;
  bool early_stopping = 5;
  int32 patience = 6;
  string optimizer = 7;
  string loss_function = 8;
}

message DataConfig {
  repeated string feature_columns = 1;
  string target_column = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
  repeated string symbols = 5;
  DataSplitConfig split_config = 6;
}

message DataSplitConfig {
  double train_ratio = 1;
  double validation_ratio = 2;
  double test_ratio = 3;
  bool shuffle = 4;
  int32 random_seed = 5;
}

message HyperParameters {
  map<string, double> numeric_params = 1;
  map<string, string> string_params = 2;
  map<string, bool> boolean_params = 3;
  map<string, int32> integer_params = 4;
}

message TrainingStatus {
  string job_id = 1;
  TrainingStage stage = 2;
  int32 current_epoch = 3;
  double progress_percentage = 4;
  TrainingMetrics metrics = 5;
  string message = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message TrainingMetrics {
  double loss = 1;
  double accuracy = 2;
  double val_loss = 3;
  double val_accuracy = 4;
  map<string, double> custom_metrics = 5;
}

message TrainingJob {
  string job_id = 1;
  string model_name = 2;
  TrainingRequest request = 3;
  TrainingStage current_stage = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  string error_message = 7;
  TrainingMetrics final_metrics = 8;
}

message TrainingJobRequest {
  string job_id = 1;
}

message CancelTrainingRequest {
  string job_id = 1;
  string reason = 2;
}

message CancelTrainingResponse {
  bool success = 1;
  string message = 2;
}

message DeploymentRequest {
  string model_id = 1;
  string model_version = 2;
  DeploymentConfig config = 3;
}

message DeploymentConfig {
  string environment = 1;
  int32 replicas = 2;
  ResourceRequirements resources = 3;
  ScalingConfig scaling = 4;
  HealthCheckConfig health_check = 5;
}

message ResourceRequirements {
  double cpu_cores = 1;
  int64 memory_mb = 2;
  int64 disk_mb = 3;
  bool gpu_required = 4;
}

message ScalingConfig {
  int32 min_replicas = 1;
  int32 max_replicas = 2;
  double target_cpu_utilization = 3;
  int32 target_requests_per_second = 4;
}

message HealthCheckConfig {
  string endpoint = 1;
  int32 initial_delay_seconds = 2;
  int32 period_seconds = 3;
  int32 timeout_seconds = 4;
  int32 failure_threshold = 5;
}

message DeploymentResponse {
  string deployment_id = 1;
  string endpoint_url = 2;
  DeploymentStatus status = 3;
  google.protobuf.Timestamp deployed_at = 4;
}

message UndeploymentRequest {
  string deployment_id = 1;
}

message UndeploymentResponse {
  bool success = 1;
  google.protobuf.Timestamp undeployed_at = 2;
}

message ModelStatusRequest {
  string model_id = 1;
  string deployment_id = 2;
}

message ModelStatus {
  string model_id = 1;
  string deployment_id = 2;
  DeploymentStatus status = 3;
  int32 replicas_available = 4;
  int32 replicas_desired = 5;
  PerformanceMetrics performance = 6;
  google.protobuf.Timestamp last_updated = 7;
}

message PerformanceMetrics {
  double average_latency_ms = 1;
  double p95_latency_ms = 2;
  double p99_latency_ms = 3;
  int32 requests_per_second = 4;
  double cpu_utilization = 5;
  double memory_utilization = 6;
  double accuracy = 7;
}

message PredictionRequest {
  string model_id = 1;
  string model_version = 2;
  repeated double features = 3;
  map<string, string> metadata = 4;
  PredictionConfig config = 5;
}

message PredictionConfig {
  bool return_probabilities = 1;
  bool return_feature_importance = 2;
  bool return_confidence_intervals = 3;
  double confidence_level = 4;
}

message PredictionResponse {
  string prediction_id = 1;
  repeated Prediction predictions = 2;
  double confidence = 3;
  int64 inference_time_us = 4;
  ModelInfo model_info = 5;
}

message Prediction {
  double value = 1;
  double confidence = 2;
  double lower_bound = 3;
  double upper_bound = 4;
  int32 horizon_steps = 5;
  map<string, double> feature_importance = 6;
  repeated double probabilities = 7;
}

message BatchPredictionRequest {
  string model_id = 1;
  string model_version = 2;
  repeated PredictionRequest batch_requests = 3;
}

message BatchPredictionResponse {
  repeated PredictionResponse responses = 1;
  int32 successful_predictions = 2;
  int32 failed_predictions = 3;
  int64 total_inference_time_us = 4;
}

message ListModelsRequest {
  ModelFilter filter = 1;
  neural_trader.common.v1.PaginationRequest pagination = 2;
}

message ModelFilter {
  string name_pattern = 1;
  ModelType model_type = 2;
  google.protobuf.Timestamp created_after = 3;
  google.protobuf.Timestamp created_before = 4;
  map<string, string> tags = 5;
  DeploymentStatus deployment_status = 6;
}

message ModelList {
  repeated ModelSummary models = 1;
  neural_trader.common.v1.PaginationResponse pagination = 2;
}

message ModelSummary {
  string model_id = 1;
  string name = 2;
  string version = 3;
  ModelType model_type = 4;
  google.protobuf.Timestamp created_at = 5;
  DeploymentStatus status = 6;
  map<string, string> tags = 7;
}

message ModelMetadataRequest {
  string model_id = 1;
}

message ModelMetadata {
  string model_id = 1;
  string name = 2;
  string version = 3;
  ModelType model_type = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp trained_at = 6;
  int64 file_size_bytes = 7;
  string training_data_hash = 8;
  TrainingMetrics performance_metrics = 9;
  map<string, string> tags = 10;
  repeated string feature_names = 11;
  ModelInfo model_info = 12;
}

message ModelInfo {
  string model_id = 1;
  string version = 2;
  ModelType model_type = 3;
  google.protobuf.Timestamp trained_at = 4;
  string framework = 5;
  string framework_version = 6;
}

message DeleteModelRequest {
  string model_id = 1;
  bool force = 2;
}

message DeleteModelResponse {
  bool success = 1;
  string message = 2;
}

message ExperimentRequest {
  string name = 1;
  string description = 2;
  repeated string model_ids = 3;
  ExperimentConfig config = 4;
}

message ExperimentConfig {
  TrafficSplitConfig traffic_split = 1;
  map<string, string> success_metrics = 2;
  int32 duration_days = 3;
  double confidence_level = 4;
}

message TrafficSplitConfig {
  map<string, double> model_weights = 1;
}

message ExperimentResponse {
  string experiment_id = 1;
  ExperimentStatus status = 2;
  google.protobuf.Timestamp started_at = 3;
}

message ExperimentResultsRequest {
  string experiment_id = 1;
}

message ExperimentResults {
  string experiment_id = 1;
  ExperimentStatus status = 2;
  map<string, ModelPerformance> model_performance = 3;
  string winner_model_id = 4;
  double confidence_score = 5;
  google.protobuf.Timestamp completed_at = 6;
}

message ModelPerformance {
  string model_id = 1;
  int32 total_requests = 2;
  double success_rate = 3;
  double average_latency_ms = 4;
  map<string, double> custom_metrics = 5;
}

enum TrainingStage {
  TRAINING_STAGE_UNSPECIFIED = 0;
  TRAINING_DATA_PREPARATION = 1;
  TRAINING_MODEL_INITIALIZATION = 2;
  TRAINING_IN_PROGRESS = 3;
  TRAINING_VALIDATION = 4;
  TRAINING_MODEL_SAVING = 5;
  TRAINING_COMPLETED = 6;
  TRAINING_FAILED = 7;
}

enum ModelType {
  MODEL_TYPE_UNSPECIFIED = 0;
  LSTM = 1;
  GRU = 2;
  TRANSFORMER = 3;
  MLP = 4;
  CNN_LSTM = 5;
  XG_BOOST = 6;
  RANDOM_FOREST = 7;
  FANN = 8;
}

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_PENDING = 1;
  DEPLOYMENT_DEPLOYING = 2;
  DEPLOYMENT_RUNNING = 3;
  DEPLOYMENT_UPDATING = 4;
  DEPLOYMENT_FAILED = 5;
  DEPLOYMENT_TERMINATED = 6;
}

enum ExperimentStatus {
  EXPERIMENT_STATUS_UNSPECIFIED = 0;
  EXPERIMENT_PLANNING = 1;
  EXPERIMENT_RUNNING = 2;
  EXPERIMENT_COMPLETED = 3;
  EXPERIMENT_CANCELLED = 4;
  EXPERIMENT_FAILED = 5;
}

// Error Codes
enum ModelErrorCode {
  MODEL_ERROR_UNSPECIFIED = 0;
  MODEL_NOT_FOUND = 1;
  MODEL_TRAINING_ERROR = 2;
  MODEL_DEPLOYMENT_ERROR = 3;
  MODEL_INFERENCE_ERROR = 4;
  INVALID_MODEL_TYPE = 5;
  INSUFFICIENT_RESOURCES = 6;
}

message ModelError {
  ModelErrorCode code = 1;
  string message = 2;
  map<string, string> details = 3;
  bool retryable = 4;
}