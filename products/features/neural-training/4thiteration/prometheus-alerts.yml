groups:
  - name: data_ingestion_critical
    interval: 30s
    rules:
      - alert: WebSocketConnectionDown
        expr: data_ingestion_websocket_connection_state != 3
        for: 5m
        labels:
          severity: critical
          component: websocket
          team: data-platform
        annotations:
          summary: "WebSocket connection down for {{ $labels.provider }}"
          description: "WebSocket connection to {{ $labels.provider }} endpoint {{ $labels.endpoint }} has been down for more than 5 minutes. Current state: {{ $value }}"
          runbook_url: "https://wiki.internal/runbooks/data-ingestion/websocket-down"
          
      - alert: DataStaleness
        expr: data_ingestion_symbol_data_freshness_seconds > 300
        for: 10m
        labels:
          severity: critical
          component: data-flow
          team: data-platform
        annotations:
          summary: "Stale data for {{ $labels.symbol }} from {{ $labels.provider }}"
          description: "No data updates received for {{ $labels.symbol }} ({{ $labels.data_type }}) from {{ $labels.provider }} for more than 5 minutes. Last update was {{ $value }} seconds ago."
          dashboard_url: "https://grafana.internal/d/data-flow/freshness"
          
      - alert: DatabaseWriteBacklog
        expr: data_ingestion_db_write_queue_depth > 10000
        for: 5m
        labels:
          severity: critical
          component: storage
          team: data-platform
        annotations:
          summary: "Critical database write backlog"
          description: "Database write queue for {{ $labels.table }} (priority: {{ $labels.priority }}) has {{ $value }} pending items, exceeding critical threshold of 10,000"
          action: "Check database performance and consider scaling write capacity"
          
      - alert: AllProvidersDown
        expr: sum(data_ingestion_websocket_connection_state == 3) == 0
        for: 2m
        labels:
          severity: critical
          component: websocket
          team: data-platform
          page: true
        annotations:
          summary: "All data providers disconnected"
          description: "No active WebSocket connections to any data provider. Complete data ingestion failure."
          action: "IMMEDIATE ACTION REQUIRED: Check network connectivity and provider API status"
          
  - name: data_ingestion_warnings
    interval: 1m
    rules:
      - alert: HighErrorRate
        expr: rate(data_ingestion_processing_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: processing
          team: data-platform
        annotations:
          summary: "High error rate for {{ $labels.provider }}"
          description: "Processing error rate for {{ $labels.provider }} is {{ $value | humanize }} errors/sec (threshold: 10/sec)"
          
      - alert: MemoryUsageHigh
        expr: data_ingestion_process_memory_usage_bytes{memory_type="rss"} / 1e9 > 4
        for: 10m
        labels:
          severity: warning
          component: system
          team: data-platform
        annotations:
          summary: "High memory usage"
          description: "Data ingestion process is using {{ $value | humanize }}GB of memory (threshold: 4GB)"
          action: "Monitor for memory leaks and consider restarting if usage continues to grow"
          
      - alert: EventLoopLag
        expr: histogram_quantile(0.99, rate(data_ingestion_event_loop_lag_milliseconds_bucket[5m])) > 100
        for: 5m
        labels:
          severity: warning
          component: system
          team: data-platform
        annotations:
          summary: "Event loop lagging"
          description: "Event loop {{ $labels.loop_name }} p99 lag is {{ $value | humanize }}ms (threshold: 100ms)"
          action: "Check for blocking operations or high CPU usage"
          
      - alert: WebSocketBufferNearFull
        expr: data_ingestion_websocket_buffer_size / 10000 > 0.8
        for: 5m
        labels:
          severity: warning
          component: websocket
          team: data-platform
        annotations:
          summary: "WebSocket buffer near capacity"
          description: "Buffer for {{ $labels.provider }} ({{ $labels.buffer_type }}) is {{ $value | humanizePercentage }} full"
          action: "Increase processing capacity or buffer size"
          
      - alert: FrequentReconnections
        expr: rate(data_ingestion_websocket_reconnection_attempts_total[1h]) > 10
        for: 15m
        labels:
          severity: warning
          component: websocket
          team: data-platform
        annotations:
          summary: "Frequent reconnections for {{ $labels.provider }}"
          description: "{{ $labels.provider }} has reconnected {{ $value | humanize }} times in the last hour"
          action: "Check network stability and provider service status"
          
      - alert: HighMessageLatency
        expr: histogram_quantile(0.95, rate(data_ingestion_websocket_message_latency_milliseconds_bucket[5m])) > 1000
        for: 10m
        labels:
          severity: warning
          component: processing
          team: data-platform
        annotations:
          summary: "High message processing latency"
          description: "P95 latency for {{ $labels.provider }} {{ $labels.message_type }} messages is {{ $value | humanize }}ms"
          
      - alert: DatabaseConnectionPoolExhausted
        expr: data_ingestion_db_connection_pool_size{state="idle"} == 0
        for: 5m
        labels:
          severity: warning
          component: storage
          team: data-platform
        annotations:
          summary: "Database connection pool exhausted"
          description: "No idle connections in {{ $labels.pool_name }} pool. All {{ $value }} connections are active."
          action: "Consider increasing pool size or optimizing query performance"
          
      - alert: APIQuotaNearLimit
        expr: data_ingestion_api_quota_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          component: provider
          team: data-platform
        annotations:
          summary: "API quota near limit for {{ $labels.provider }}"
          description: "{{ $labels.provider }} {{ $labels.quota_type }} quota is at {{ $value | humanize }}% (threshold: 80%)"
          action: "Reduce request rate or upgrade API plan"
          
      - alert: DataValidationFailures
        expr: rate(data_ingestion_validation_errors_total[5m]) > 1
        for: 10m
        labels:
          severity: warning
          component: data-quality
          team: data-platform
        annotations:
          summary: "Data validation failures from {{ $labels.provider }}"
          description: "Validation error rate: {{ $value | humanize }}/sec for {{ $labels.error_type }} errors"
          
      - alert: LowDataCompleteness
        expr: data_ingestion_data_completeness_ratio < 0.95
        for: 15m
        labels:
          severity: warning
          component: data-quality
          team: data-platform
        annotations:
          summary: "Low data completeness for {{ $labels.provider }}"
          description: "Data completeness for {{ $labels.data_type }} in {{ $labels.time_window }} window is {{ $value | humanizePercentage }}"
          
  - name: data_ingestion_performance
    interval: 2m
    rules:
      - alert: TimescaleCompressionLagging
        expr: data_ingestion_timescale_chunk_count{compression_status="uncompressed"} > 100
        for: 30m
        labels:
          severity: warning
          component: storage
          team: data-platform
        annotations:
          summary: "TimescaleDB compression lagging"
          description: "{{ $value }} uncompressed chunks in {{ $labels.hypertable }}. Compression may be falling behind."
          
      - alert: HighDuplicateRate
        expr: rate(data_ingestion_duplicate_messages_total[5m]) / rate(data_ingestion_websocket_messages_received_total[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
          component: data-quality
          team: data-platform
        annotations:
          summary: "High duplicate message rate"
          description: "{{ $value | humanizePercentage }} of messages from {{ $labels.provider }} are duplicates"
          
      - alert: ProviderHealthDegraded
        expr: data_ingestion_provider_availability < 0.95
        for: 15m
        labels:
          severity: warning
          component: provider
          team: data-platform
        annotations:
          summary: "{{ $labels.provider }} health degraded"
          description: "Provider availability score is {{ $value | humanizePercentage }} (threshold: 95%)"
          
  - name: data_ingestion_slo
    interval: 5m
    rules:
      - alert: SLODataFreshnessViolation
        expr: |
          (
            count(data_ingestion_symbol_data_freshness_seconds < 60) 
            / 
            count(data_ingestion_symbol_data_freshness_seconds)
          ) < 0.99
        for: 15m
        labels:
          severity: warning
          component: slo
          team: data-platform
          slo: data-freshness
        annotations:
          summary: "Data freshness SLO violation"
          description: "Only {{ $value | humanizePercentage }} of symbols have fresh data (SLO: 99% < 60s)"
          dashboard_url: "https://grafana.internal/d/slo/data-freshness"
          
      - alert: SLOProcessingLatencyViolation
        expr: |
          histogram_quantile(0.99, rate(data_ingestion_websocket_message_latency_milliseconds_bucket[5m])) > 500
        for: 15m
        labels:
          severity: warning
          component: slo
          team: data-platform
          slo: processing-latency
        annotations:
          summary: "Processing latency SLO violation"
          description: "P99 message processing latency is {{ $value }}ms (SLO: < 500ms)"
          
      - alert: SLOAvailabilityViolation
        expr: |
          avg_over_time(
            (sum(data_ingestion_websocket_connection_state == 3) / count(data_ingestion_websocket_connection_state))
            [1h]
          ) < 0.995
        for: 5m
        labels:
          severity: warning
          component: slo
          team: data-platform
          slo: availability
        annotations:
          summary: "Service availability SLO violation"
          description: "Average availability over last hour is {{ $value | humanizePercentage }} (SLO: 99.5%)"