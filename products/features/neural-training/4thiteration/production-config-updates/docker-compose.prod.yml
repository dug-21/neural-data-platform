version: '3.8'

services:
  neural-trader:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - RUST_LOG=info
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - neural_trader_backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3030/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=neural_trader
      - TIMESCALEDB_TELEMETRY=off
    secrets:
      - postgres_password
    volumes:
      - timescaledb_prod_data:/var/lib/postgresql/data
      - ./docker/timescaledb/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - neural_trader_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf
    secrets:
      - redis_password
    volumes:
      - redis_prod_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - neural_trader_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  data-ingestion:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      # Add new health check and metrics configuration
      - HEALTH_CHECK_ENABLED=true
      - HEALTH_CHECK_PORT=8001
      - METRICS_ENABLED=true
      - METRICS_PORT=9091
      - WEBSOCKET_HEALTH_CHECK_ENABLED=true
      - WEBSOCKET_HEALTH_CHECK_INTERVAL=30
    secrets:
      - postgres_password
      - redis_password
      - alpha_vantage_api_key
      - polygon_api_key
      - finnhub_api_key
      - iex_cloud_api_key
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neural_trader_backend
    # Expose metrics port for Prometheus scraping
    ports:
      - "9091:9091"  # Metrics port exposed for monitoring
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # Enhanced health check with proper endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health", "-o", "/dev/null", "-w", "%{http_code}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - neural-trader
    networks:
      - neural_trader_frontend
      - neural_trader_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus-updated.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_prod_data:/prometheus
    networks:
      - neural_trader_monitoring
      - neural_trader_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
    secrets:
      - grafana_password
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./docker/grafana/dashboards-updated:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - neural_trader_monitoring
      - neural_trader_frontend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader
      - REDIS_URL=redis://redis:6379
      - BACKUP_SCHEDULE=0 2 * * *
    secrets:
      - postgres_password
      - redis_password
    volumes:
      - backup_prod_data:/backups
    depends_on:
      - timescaledb
      - redis
    networks:
      - neural_trader_backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
  alpha_vantage_api_key:
    file: ./secrets/alpha_vantage_api_key.txt
  polygon_api_key:
    file: ./secrets/polygon_api_key.txt
  finnhub_api_key:
    file: ./secrets/finnhub_api_key.txt
  iex_cloud_api_key:
    file: ./secrets/iex_cloud_api_key.txt

volumes:
  timescaledb_prod_data:
  redis_prod_data:
  prometheus_prod_data:
  grafana_prod_data:
  backup_prod_data:

networks:
  neural_trader_frontend:
    driver: overlay
    attachable: true
  neural_trader_backend:
    driver: overlay
    internal: true
  neural_trader_monitoring:
    driver: overlay
    internal: true