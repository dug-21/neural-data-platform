groups:
  - name: health_check_metrics
    interval: 30s
    rules:
      # Service health status
      - record: service:health_status
        expr: |
          label_replace(
            up{job=~"data-ingestion.*|neural-trader|timescaledb|redis"},
            "service", "$1", "job", "(.*)"
          )
      
      # Health check success rate
      - record: health:check_success_rate_5m
        expr: |
          (
            sum by (job) (rate(health_check_success_total[5m])) /
            sum by (job) (rate(health_check_attempts_total[5m]))
          ) * 100
      
      # Service uptime percentage
      - record: service:uptime_percentage_1h
        expr: |
          (
            avg_over_time(up{job=~"data-ingestion.*|neural-trader|timescaledb|redis"}[1h])
          ) * 100
      
      # Component health score (0-100)
      - record: service:health_score
        expr: |
          (
            (up{job=~"data-ingestion.*|neural-trader|timescaledb|redis"} * 50) +
            (health:check_success_rate_5m * 0.5)
          )

  - name: health_check_alerts
    rules:
      # Alert on service health check failures
      - alert: ServiceHealthCheckFailing
        expr: health:check_success_rate_5m < 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service health checks failing ({{ $labels.job }})"
          description: "Health check success rate is {{ $value }}% for {{ $labels.job }}"
      
      # Alert on service down
      - alert: ServiceDown
        expr: service:health_status == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service is down ({{ $labels.service }})"
          description: "Service {{ $labels.service }} has been down for more than 2 minutes"
      
      # Alert on low uptime
      - alert: ServiceLowUptime
        expr: service:uptime_percentage_1h < 95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Service has low uptime ({{ $labels.job }})"
          description: "Service {{ $labels.job }} uptime is {{ $value }}% over the last hour"
      
      # Alert on degraded health score
      - alert: ServiceDegraded
        expr: service:health_score < 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Service health degraded ({{ $labels.job }})"
          description: "Service {{ $labels.job }} health score is {{ $value }}/100"