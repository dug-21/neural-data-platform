# Application Pod Configuration
# This pod contains the main Neural Trader application and data ingestion service

apiVersion: v1
kind: Pod
metadata:
  name: neural-trader-app
  labels:
    app: neural-trader
    tier: application
spec:
  # Pod-level settings
  hostname: app-pod
  restartPolicy: OnFailure
  
  # Shared volumes for the pod
  volumes:
    - name: app-config
      hostPath:
        path: /workspaces/neural-trader/config
        type: Directory
    - name: data-ingestion-code
      hostPath:
        path: /workspaces/neural-trader/data_ingestion
        type: Directory
    - name: ingestion-logs
      persistentVolumeClaim:
        claimName: ingestion-logs-pvc
    - name: ingestion-cache
      persistentVolumeClaim:
        claimName: ingestion-cache-pvc
    - name: trader-logs
      persistentVolumeClaim:
        claimName: trader-logs-pvc

  # Security context for rootless operation
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    # Data Ingestion Service
    - name: data-ingestion
      image: localhost/neural-trader-data-ingestion:latest
      imagePullPolicy: IfNotPresent
      
      env:
        # Database configuration
        - name: TIMESCALE_HOST
          value: neural-trader-db
        - name: TIMESCALE_PORT
          value: "5432"
        - name: TIMESCALE_DATABASE
          value: neural_trader_db
        - name: TIMESCALE_USER
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: postgres-user
        - name: TIMESCALE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: postgres-password
        # Redis configuration
        - name: REDIS_HOST
          value: neural-trader-cache
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: redis-password
        # API Keys from secrets
        - name: IEX_CLOUD_API_KEY
          valueFrom:
            secretKeyRef:
              name: neural-trader-api-keys
              key: iex-cloud-api-key
              optional: true
        - name: ALPHA_VANTAGE_API_KEY
          valueFrom:
            secretKeyRef:
              name: neural-trader-api-keys
              key: alpha-vantage-api-key
              optional: true
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: neural-trader-api-keys
              key: polygon-api-key
              optional: true
        - name: FINNHUB_API_KEY
          valueFrom:
            secretKeyRef:
              name: neural-trader-api-keys
              key: finnhub-api-key
              optional: true
        # Application configuration
        - name: LOG_LEVEL
          value: INFO
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TZ
          value: UTC
      
      ports:
        - containerPort: 8000
          hostPort: 8001
          protocol: TCP
      
      volumeMounts:
        - name: data-ingestion-code
          mountPath: /app/data_ingestion
          readOnly: true
        - name: app-config
          mountPath: /app/config
          readOnly: true
        - name: ingestion-logs
          mountPath: /app/logs
        - name: ingestion-cache
          mountPath: /app/cache
      
      resources:
        limits:
          cpu: "2"
          memory: 2Gi
        requests:
          cpu: "1"
          memory: 1Gi
      
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5

    # Neural Trader Main Application
    - name: neural-trader
      image: localhost/neural-trader:latest
      imagePullPolicy: IfNotPresent
      
      env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@neural-trader-db:5432/neural_trader_db"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: postgres-password
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@neural-trader-cache:6379/0"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: redis-password
        - name: RUST_LOG
          value: info
        - name: RUST_BACKTRACE
          value: "1"
        - name: TZ
          value: UTC
      
      ports:
        - containerPort: 3030
          hostPort: 3030
          protocol: TCP
      
      volumeMounts:
        - name: app-config
          mountPath: /app/config
          readOnly: true
        - name: trader-logs
          mountPath: /app/logs
      
      resources:
        limits:
          cpu: "4"
          memory: 4Gi
        requests:
          cpu: "2"
          memory: 2Gi
      
      livenessProbe:
        httpGet:
          path: /health
          port: 3030
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5