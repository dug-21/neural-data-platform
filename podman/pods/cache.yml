# Cache Pod Configuration
# This pod contains Redis and Redis Commander services

apiVersion: v1
kind: Pod
metadata:
  name: neural-trader-cache
  labels:
    app: neural-trader
    tier: cache
spec:
  # Pod-level settings
  hostname: cache-pod
  restartPolicy: OnFailure
  
  # Shared volumes for the pod
  volumes:
    - name: redis-data
      persistentVolumeClaim:
        claimName: redis-data-pvc
    - name: redis-config
      configMap:
        name: redis-config
        items:
          - key: redis.conf
            path: redis.conf

  # Security context for rootless operation
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    # Redis Container
    - name: redis
      image: localhost/neural-trader-redis:latest
      imagePullPolicy: IfNotPresent
      
      command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        - --requirepass
        - $(REDIS_PASSWORD)
      
      env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: redis-password
      
      ports:
        - containerPort: 6379
          hostPort: 6379
          protocol: TCP
      
      volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/etc/redis
          readOnly: true
      
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
      
      livenessProbe:
        exec:
          command:
            - redis-cli
            - ping
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      
      readinessProbe:
        exec:
          command:
            - redis-cli
            - ping
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3

    # Redis Commander Container (Development Profile)
    - name: redis-commander
      image: docker.io/rediscommander/redis-commander:latest
      imagePullPolicy: IfNotPresent
      
      env:
        - name: REDIS_HOSTS
          value: "local:localhost:6379:0:$(REDIS_PASSWORD)"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: redis-password
      
      ports:
        - containerPort: 8081
          hostPort: 8081
          protocol: TCP
      
      resources:
        limits:
          cpu: "0.5"
          memory: 256Mi
        requests:
          cpu: "0.25"
          memory: 128Mi