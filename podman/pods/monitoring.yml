# Monitoring Pod Configuration
# This pod contains Prometheus and Grafana services

apiVersion: v1
kind: Pod
metadata:
  name: neural-trader-monitoring
  labels:
    app: neural-trader
    tier: monitoring
spec:
  # Pod-level settings
  hostname: monitoring-pod
  restartPolicy: OnFailure
  
  # Shared volumes for the pod
  volumes:
    - name: prometheus-config
      configMap:
        name: prometheus-config
        items:
          - key: prometheus.yml
            path: prometheus.yml
    - name: prometheus-data
      persistentVolumeClaim:
        claimName: prometheus-data-pvc
    - name: grafana-provisioning
      hostPath:
        path: /workspaces/neural-trader/docker/grafana/provisioning
        type: Directory
    - name: grafana-dashboards
      hostPath:
        path: /workspaces/neural-trader/docker/grafana/dashboards
        type: Directory
    - name: grafana-data
      persistentVolumeClaim:
        claimName: grafana-data-pvc

  # Security context for rootless operation
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    # Prometheus Container
    - name: prometheus
      image: docker.io/prom/prometheus:latest
      imagePullPolicy: IfNotPresent
      
      args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/usr/share/prometheus/console_libraries'
        - '--web.console.templates=/usr/share/prometheus/consoles'
        - '--web.enable-lifecycle'
        - '--storage.tsdb.retention.time=30d'
      
      ports:
        - containerPort: 9090
          hostPort: 9090
          protocol: TCP
      
      volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
          readOnly: true
        - name: prometheus-data
          mountPath: /prometheus
      
      resources:
        limits:
          cpu: "1"
          memory: 1Gi
        requests:
          cpu: "0.5"
          memory: 512Mi
      
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: 9090
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      
      readinessProbe:
        httpGet:
          path: /-/ready
          port: 9090
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3

    # Grafana Container
    - name: grafana
      image: docker.io/grafana/grafana:latest
      imagePullPolicy: IfNotPresent
      
      env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: grafana-password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-clock-panel,grafana-simple-json-datasource"
        - name: GF_SERVER_HTTP_PORT
          value: "3000"
      
      ports:
        - containerPort: 3000
          hostPort: 3000
          protocol: TCP
      
      volumeMounts:
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning
          readOnly: true
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        - name: grafana-data
          mountPath: /var/lib/grafana
      
      resources:
        limits:
          cpu: "1"
          memory: 512Mi
        requests:
          cpu: "0.5"
          memory: 256Mi
      
      livenessProbe:
        httpGet:
          path: /api/health
          port: 3000
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5