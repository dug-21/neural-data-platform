# Podman Compose configuration for Neural Trader
# This file provides compatibility with docker-compose workflows
# Use: podman-compose up -d

version: '3.8'

# Define pod network
networks:
  neural-trader-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Named volumes
volumes:
  timescale_data:
  timescale_logs:
  redis_data:
  ingestion_logs:
  ingestion_cache:
  trader_logs:
  prometheus_data:
  grafana_data:
  pgadmin_data:

services:
  # Database Pod Services
  timescaledb:
    image: localhost/neural-trader-timescaledb:latest
    container_name: neural_trader_timescaledb
    hostname: timescaledb
    pod: neural-trader-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-neural_trader}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-neural_trader_db}
      - POSTGRES_SHARED_BUFFERS=2GB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=6GB
      - POSTGRES_MAINTENANCE_WORK_MEM=512MB
      - POSTGRES_WORK_MEM=128MB
      - POSTGRES_MAX_CONNECTIONS=200
      - POSTGRES_MAX_PARALLEL_WORKERS=8
      - POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER=4
    volumes:
      - timescale_data:/var/lib/postgresql/data:Z
      - ./docker/timescaledb/init-scripts:/docker-entrypoint-initdb.d:ro,Z
      - timescale_logs:/var/log/postgresql:Z
    ports:
      - "5432:5432"
    networks:
      - neural-trader-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neural_trader -d neural_trader_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Podman-specific options
    security_opt:
      - label=disable
    userns_mode: keep-id
    
  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: neural_trader_pgadmin
    hostname: pgadmin
    pod: neural-trader-db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@neuraltrader.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_LISTEN_PORT=8082
    volumes:
      - pgadmin_data:/var/lib/pgadmin:Z
    ports:
      - "8082:8082"
    networks:
      - neural-trader-net
    depends_on:
      - timescaledb
    profiles:
      - development
    restart: unless-stopped
    security_opt:
      - label=disable
    userns_mode: keep-id

  # Cache Pod Services
  redis:
    image: localhost/neural-trader-redis:latest
    container_name: neural_trader_redis
    hostname: redis
    pod: neural-trader-cache
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data:Z
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro,Z
    ports:
      - "6379:6379"
    networks:
      - neural-trader-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - label=disable
    userns_mode: keep-id

  redis-commander:
    image: docker.io/rediscommander/redis-commander:latest
    container_name: neural_trader_redis_commander
    hostname: redis-commander
    pod: neural-trader-cache
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - neural-trader-net
    depends_on:
      - redis
    profiles:
      - development
    restart: unless-stopped
    security_opt:
      - label=disable
    userns_mode: keep-id

  # Application Pod Services
  data-ingestion:
    image: localhost/neural-trader-data-ingestion:latest
    container_name: neural_trader_data_ingestion
    hostname: data-ingestion
    pod: neural-trader-app
    environment:
      # Database configuration
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DATABASE=${POSTGRES_DB:-neural_trader_db}
      - TIMESCALE_USER=${POSTGRES_USER:-neural_trader}
      - TIMESCALE_PASSWORD=${POSTGRES_PASSWORD}
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # API Keys
      - IEX_CLOUD_API_KEY=${IEX_CLOUD_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      # Application configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    volumes:
      - ./data_ingestion:/app/data_ingestion:ro,Z
      - ./config:/app/config:ro,Z
      - ingestion_logs:/app/logs:Z
      - ingestion_cache:/app/cache:Z
    ports:
      - "8001:8000"
    networks:
      - neural-trader-net
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - label=disable
    userns_mode: keep-id

  neural-trader:
    image: localhost/neural-trader:latest
    container_name: neural_trader_app
    hostname: neural-trader
    pod: neural-trader-app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-neural_trader}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-neural_trader_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      - TZ=UTC
    volumes:
      - ./config:/app/config:ro,Z
      - trader_logs:/app/logs:Z
    ports:
      - "3030:3030"
    networks:
      - neural-trader-net
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - label=disable
    userns_mode: keep-id

  # Monitoring Pod Services
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: neural_trader_prometheus
    hostname: prometheus
    pod: neural-trader-monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus_data:/prometheus:Z
    ports:
      - "9090:9090"
    networks:
      - neural-trader-net
    restart: unless-stopped
    security_opt:
      - label=disable
    userns_mode: keep-id

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: neural_trader_grafana
    hostname: grafana
    pod: neural-trader-monitoring
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana_data:/var/lib/grafana:Z
    ports:
      - "3000:3000"
    networks:
      - neural-trader-net
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - label=disable
    userns_mode: keep-id

# Pod definitions (for podman-compose compatibility)
x-podman-pods:
  neural-trader-db:
    name: neural-trader-db
    share: net
    
  neural-trader-cache:
    name: neural-trader-cache
    share: net
    
  neural-trader-app:
    name: neural-trader-app
    share: net
    
  neural-trader-monitoring:
    name: neural-trader-monitoring
    share: net