[package]
name = "ndp-intelligence"
version = "0.1.0"
edition = "2021"
description = "NDP Intelligence Foundation - embeddings, storage, and graph backends"

[features]
default = []
ruvector = ["ruvector-core"]
ruvector-graph-backend = ["ruvector-graph"]

[dependencies]
ndp-lib = { path = "../ndp-lib" }
tokio-postgres = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
deadpool-postgres = "0.14"

# Optional ruvector dependencies (feature-gated)
ruvector-core = { version = "2.0", optional = true }
ruvector-graph = { version = "2.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
