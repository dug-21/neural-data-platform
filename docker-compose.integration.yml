# Integration Test Environment - Mirrors Production (deploy/pi)
# Usage:
#   docker compose -f docker-compose.integration.yml up -d
#   docker compose -f docker-compose.integration.yml down -v  # Clean slate
#
# Production stack (dp-017 aligned):
#   - etcd (config store)
#   - mosquitto (MQTT broker)
#   - timescaledb (Silver layer)
#   - air-quality-app (Bronze + Silver ETL via event subscriber)
#   - ndp-mcp-server (MCP interface)
#   - grafana (dashboards)
#
# Test data injection:
#   mosquitto_pub -h localhost -t "airgradient/test/measures" \
#     -m '{"wifi":-50,"pm02":15,"rco2":650,"atmp":22.5,"rhum":55}'

services:
  # MQTT Broker - receives data from sensors
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: integration-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # etcd - Configuration Store
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: integration-etcd
    ports:
      - "2379:2379"
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=integration-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_QUOTA_BACKEND_BYTES=536870912
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB - Silver Layer Storage + pgvector (intelligence layer)
  timescaledb:
    build:
      context: .
      dockerfile: docker/integration-timescaledb/Dockerfile
    image: ndp/timescaledb-pgvector:integration
    container_name: integration-timescaledb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ndp
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./deploy/pi/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ndp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Air Quality App - Bronze Layer + Silver ETL (event subscriber)
  # Silver ETL is now integrated into this app, not a separate daemon
  air-quality-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: ndp/air-quality-app:integration
    container_name: integration-air-quality
    ports:
      - "8080:8080"
    volumes:
      - air-quality-data:/data
      - ./config/base/streams:/config/streams:ro
      - ./config/base/processors:/config/processors:ro
    environment:
      - RUST_LOG=info,silver_etl=debug
      - DATA_DIR=/data
      - ETCD_ENDPOINT=http://etcd:2379
      - MQTT_BROKER_URL=mosquitto
      - MQTT_PORT=1883
      # Silver ETL (integrated event subscriber)
      - TIMESCALE_URL=postgresql://postgres:postgres@timescaledb:5432/ndp
      - TIMESCALE_MAX_CONNECTIONS=5
      - TIMESCALE_TIMEOUT_SECS=10
      - STREAM_CONFIG_DIR=/config/streams
      # External APIs (optional for testing)
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY:-}
      - WEATHER_LATITUDE=${WEATHER_LATITUDE:-29.95838}
      - WEATHER_LONGITUDE=${WEATHER_LONGITUDE:--81.30878}
      # Event notifications (optional)
      - EVENT_NOTIFIER_ENABLED=${EVENT_NOTIFIER_ENABLED:-false}
      - THRESHOLD_PROCESSOR_ENABLED=${THRESHOLD_PROCESSOR_ENABLED:-false}
    depends_on:
      mosquitto:
        condition: service_healthy
      etcd:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # NDP MCP Server - Bronze + Silver Layer MCP Interface
  ndp-mcp-server:
    build:
      context: .
      dockerfile: core/ndp-mcp-server/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: ndp/ndp-mcp-server:integration
    container_name: integration-mcp-server
    ports:
      - "9100:9100"
    volumes:
      - air-quality-data:/data:ro
    environment:
      - RUST_LOG=info
      - NDP_RAW_PATH=/data/raw
      - NDP_ETCD_ENDPOINTS=http://etcd:2379
      - NDP_MCP_LISTEN=0.0.0.0:9100
      - NDP_TIMESCALE_URL=postgresql://postgres:postgres@timescaledb:5432/ndp
      - NDP_TIMESCALE_MAX_CONNECTIONS=5
      - NDP_TIMESCALE_CONNECT_TIMEOUT_SECS=10
    depends_on:
      etcd:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Intelligence Daemon - similarity search and prediction
  ndp-intelligence:
    build:
      context: .
      dockerfile: docker/intelligence/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: ndp/intelligence:integration
    container_name: integration-intelligence
    environment:
      - RUST_LOG=info,ndp_intelligence=debug
      - DATABASE_URL=host=timescaledb dbname=ndp user=postgres password=postgres
      - INTELLIGENCE_DOMAIN=indoor-air-quality
      - ETCD_ENDPOINTS=http://etcd:2379
      - INTELLIGENCE_POLL_INTERVAL_SECS=1200
      - INTELLIGENCE_POOL_SIZE=2
      - INTELLIGENCE_WARMUP_THRESHOLD=168
    depends_on:
      etcd:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - intelligence

  # Grafana - Data Visualization
  grafana:
    image: grafana/grafana:latest-ubuntu
    container_name: integration-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - air-quality-data:/data:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=info
      # DuckDB plugin for Bronze layer queries (matches production)
      - GF_INSTALL_PLUGINS=https://github.com/motherduckdb/grafana-duckdb-datasource/releases/download/v0.2.1/motherduck-duckdb-datasource-0.2.1.zip;motherduck-duckdb-datasource
    depends_on:
      - timescaledb

volumes:
  mosquitto-data:
  mosquitto-logs:
  etcd-data:
  timescaledb-data:
  air-quality-data:
  grafana-data:

networks:
  default:
    name: integration-network
    driver: bridge
