[package]
name = "neural-trading"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "neural-trading"
path = "src/main.rs"

[lib]
name = "neural_trading"
path = "src/lib.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"

# Data processing
ndarray = "0.15"

# Trading specific
ta = "0.5"
orderbook = "0.1"

# Networking and messaging
redis = { version = "0.25", features = ["tokio-comp", "streams"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# Database and persistence
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }

# Configuration and environment
config = "0.14"
dotenvy = "0.15"

# Metrics and observability
prometheus = "0.13"
opentelemetry = "0.25"

# Add missing dependencies for compilation
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
tempfile = "3.0"