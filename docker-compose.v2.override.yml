# Development overrides for docker-compose.v2.yml
# This file is automatically loaded by docker-compose
version: '3.8'

services:
  config-store:
    # For development, remove the local mount and use embedded configs
    volumes:
      - config-repo:/config-repo
    environment:
      # Use embedded configs for development (no external Git needed)
      CONFIG_MODE: ${CONFIG_MODE:-embedded}
      CONFIG_REPO_URL: ${CONFIG_REPO_URL:-}
      # If you want to use a Git repo, set CONFIG_REPO_URL:
      # CONFIG_REPO_URL: https://github.com/yourusername/neural-trader-configs.git
      # CONFIG_REPO_URL: git://host.docker.internal:9418/configs  # For local git daemon
      CONFIG_BRANCH: ${CONFIG_BRANCH:-dev}
      CONFIG_ENV: ${CONFIG_ENV:-dev}
      CONFIG_PATH: /config-repo/configs
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Embedded configs for development (used when CONFIG_MODE=embedded)
      EMBEDDED_CONFIGS: |
        {
          "dev": {
            "app": {
              "name": "Neural Trader",
              "version": "2.0.0",
              "environment": "development"
            },
            "database": {
              "host": "timescaledb",
              "port": 5432,
              "name": "neural_trader"
            },
            "redis": {
              "host": "redis",
              "port": 6379
            },
            "services": {
              "config_store": {
                "port": 50051,
                "cache_ttl": 300
              },
              "data_ingestion": {
                "port": 50052,
                "batch_size": 100
              }
            }
          }
        }