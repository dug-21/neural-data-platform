version: '3.8'

# Minimal compose configuration to save disk space

services:
  neural-trader:
    build:
      context: .
      dockerfile: Dockerfile.minimal
    image: neural-trader:minimal
    container_name: neural_trader_app
    environment:
      DATABASE_URL: postgresql://neural_trader:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL}
      RUST_LOG: ${RUST_LOG}
      TRADING_MODE: ${TRADING_MODE}
      INITIAL_CAPITAL: ${INITIAL_CAPITAL}
      PRIMARY_PROVIDER: ${PRIMARY_PROVIDER}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      ALPHA_ADVANTAGE_API_KEY: ${ALPHA_ADVANTAGE_API_KEY}
      IEX_CLOUD_API_KEY: ${IEX_CLOUD_API_KEY}
      POLYGON_API_KEY: ${POLYGON_API_KEY}
    ports:
      - "${APP_PORT:-3030}:3030"
    depends_on:
      - timescaledb
      - redis
    networks:
      - neural_trader_network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: neural_trader_timescaledb
    environment:
      POSTGRES_USER: neural_trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: neural_trader_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - neural_trader_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neural_trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neural_trader_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neural_trader_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-ingestion:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile
    image: neural-trader-data-ingestion:latest
    container_name: neural_trader_data_ingestion
    command: ["python", "main.py"]
    environment:
      DATABASE_URL: postgresql://neural_trader:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: ${LOG_LEVEL}
      PRIMARY_PROVIDER: ${PRIMARY_PROVIDER}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      ALPHA_ADVANTAGE_API_KEY: ${ALPHA_ADVANTAGE_API_KEY}
      IEX_CLOUD_API_KEY: ${IEX_CLOUD_API_KEY}
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
      NEWSAPI_KEY: ${NEWSAPI_KEY}
    depends_on:
      - timescaledb
      - redis
    networks:
      - neural_trader_network

volumes:
  timescaledb_data:
  redis_data:

networks:
  neural_trader_network:
    driver: bridge