# Security-Hardened Docker Compose Configuration
# Addresses all identified vulnerabilities and implements security best practices

version: '3.8'

services:
  # Neural Trader Main Application - Security Hardened
  neural-trader:
    build:
      context: .
      dockerfile: Dockerfile.secure
      target: production
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: neural_trader_app_secure
    hostname: neural-trader
    
    # Security: Run as non-root user
    user: "nonroot:nonroot"
    
    # Security: Read-only root filesystem
    read_only: true
    
    # Security: Minimal Linux capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: Disable new privileges
    security_opt:
      - no-new-privileges:true
    
    # Security: Use custom seccomp profile
    security_opt:
      - seccomp:./docker/security/seccomp-profile.json
    
    # Security: Temporary filesystems for writable directories
    tmpfs:
      - /tmp:rw,size=100m,mode=1777
      - /var/tmp:rw,size=50m,mode=1777
      - /app/logs:rw,size=500m,mode=755
    
    # Security: Environment variables from secrets
    environment:
      - DATABASE_URL_FILE=/run/secrets/database_url
      - REDIS_URL_FILE=/run/secrets/redis_url
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - TZ=UTC
    
    # Security: Use Docker secrets instead of environment variables
    secrets:
      - database_url
      - redis_url
      - jwt_secret
    
    # Security: Limited resource constraints
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
          pids: 100
        reservations:
          cpus: '1'
          memory: 1G
    
    # Security: Network isolation
    networks:
      - neural_trader_backend
    
    # Security: Restart policy for resilience
    restart: unless-stopped
    
    # Security: Health check for monitoring
    healthcheck:
      test: ["CMD", "/usr/local/bin/neural-trader", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Security: Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # TimescaleDB - Security Hardened
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: neural_trader_timescaledb_secure
    hostname: timescaledb
    
    # Security: Run as postgres user (non-root)
    user: postgres
    
    # Security: Read-only root filesystem with writable data volume
    read_only: true
    
    # Security: Minimal capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    
    # Security: Disable new privileges
    security_opt:
      - no-new-privileges:true
    
    # Security: Temporary filesystems
    tmpfs:
      - /tmp:rw,size=100m,mode=1777
      - /var/tmp:rw,size=50m,mode=1777
      - /run/postgresql:rw,size=100m,mode=755
    
    # Security: Environment from secrets
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=neural_trader
      - TIMESCALEDB_TELEMETRY=off
      - POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256"
    
    # Security: Use secrets for sensitive data
    secrets:
      - postgres_password
    
    # Security: Secure volume mounts
    volumes:
      - timescale_data:/var/lib/postgresql/data:rw
      - ./docker/timescaledb/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/timescaledb/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
          pids: 200
        reservations:
          cpus: '2'
          memory: 2G
    
    # Security: Network isolation
    networks:
      - neural_trader_backend
    
    # Security: Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    restart: unless-stopped
    
    # Security: Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis - Security Hardened
  redis:
    image: redis:7-alpine
    container_name: neural_trader_redis_secure
    hostname: redis
    
    # Security: Run as redis user
    user: redis
    
    # Security: Read-only root filesystem
    read_only: true
    
    # Security: Minimal capabilities
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    
    # Security: Disable new privileges
    security_opt:
      - no-new-privileges:true
    
    # Security: Temporary filesystems
    tmpfs:
      - /tmp:rw,size=100m,mode=1777
    
    # Security: Redis configuration with authentication
    command: >
      redis-server 
      --requirepass "${REDIS_PASSWORD}"
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 300
      --databases 1
      --dir /data
    
    # Security: Environment from secrets
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    
    # Security: Use secrets
    secrets:
      - redis_password
    
    # Security: Secure volume mount
    volumes:
      - redis_data:/data:rw
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
          pids: 50
        reservations:
          cpus: '1'
          memory: 512M
    
    # Security: Network isolation
    networks:
      - neural_trader_backend
    
    # Security: Health check
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    restart: unless-stopped
    
    # Security: Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Reverse Proxy - Security Hardened
  nginx:
    image: nginx:alpine
    container_name: neural_trader_nginx_secure
    hostname: nginx
    
    # Security: Run as nginx user
    user: nginx
    
    # Security: Read-only root filesystem
    read_only: true
    
    # Security: Minimal capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    
    # Security: Disable new privileges
    security_opt:
      - no-new-privileges:true
    
    # Security: Temporary filesystems
    tmpfs:
      - /tmp:rw,size=100m,mode=1777
      - /var/tmp:rw,size=50m,mode=1777
      - /var/cache/nginx:rw,size=100m,mode=755
      - /var/run:rw,size=10m,mode=755
    
    # Security: Configuration files
    volumes:
      - ./docker/nginx/nginx.secure.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    
    # Security: Ports
    ports:
      - "80:80"
      - "443:443"
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
          pids: 50
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Security: Network access
    networks:
      - neural_trader_frontend
      - neural_trader_backend
    
    # Security: Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    restart: unless-stopped
    
    depends_on:
      - neural-trader

  # Security Monitoring - Falco for runtime security
  falco:
    image: falcosecurity/falco:latest
    container_name: neural_trader_falco
    hostname: falco
    
    # Security: Privileged mode required for kernel monitoring
    privileged: true
    
    # Security: Host network for system monitoring
    network_mode: host
    
    # Security: Mount necessary host paths
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      - ./docker/falco/falco.yaml:/etc/falco/falco.yaml:ro
    
    # Security: Environment
    environment:
      - FALCO_GRPC_ENABLED=true
      - FALCO_GRPC_BIND_ADDRESS=0.0.0.0:5060
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    restart: unless-stopped
    
    # Security: Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Security: Docker secrets for sensitive data
secrets:
  database_url:
    file: ./secrets/database_url.txt
  redis_url:
    file: ./secrets/redis_url.txt
  redis_password:
    file: ./secrets/redis_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

# Security: Encrypted volumes
volumes:
  timescale_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/neural-trader/timescale
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/neural-trader/redis

# Security: Network segmentation
networks:
  neural_trader_frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: nt-frontend
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
  
  neural_trader_backend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: nt-backend
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1