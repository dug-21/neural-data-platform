# Redis configuration for Config-Store Integration Tests
# Optimized for testing environment with security and performance considerations

# Network configuration
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# General configuration
daemonize no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile ""
databases 16

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence (for test data durability)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Security (basic auth for tests)
requirepass test_redis_pass

# Client connections
maxclients 10000

# Slow log (for performance monitoring)
slowlog-log-slower-than 10000
slowlog-max-len 128

# Pub/Sub settings for configuration change notifications
notify-keyspace-events "Ex"

# Memory usage optimizations
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Advanced configuration
tcp-backlog 511
unixsocket /var/run/redis/redis-server.sock
unixsocketperm 700

# Disable dangerous commands in test environment
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command EVAL ""
rename-command SCRIPT ""

# Enable keyspace notifications for config change tracking
notify-keyspace-events "KEA"