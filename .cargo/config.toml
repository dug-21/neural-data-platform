# Cargo configuration for neural-data-platform

[build]
# Optimize for the native CPU
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
# Enable source-based code coverage only when NDP_COVERAGE=1
# Usage: NDP_COVERAGE=1 cargo build
# Without env var, no coverage instrumentation overhead

[alias]
# Test aliases
test-unit = "test --lib"
test-integration = "test --test '*'"
test-all = "test --all-features"
