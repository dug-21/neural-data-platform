# Optimized Docker Compose - Fixed for Docker Desktop
# Uses BuildKit features and efficient caching strategies

services:
  neural-trader:
    build:
      context: .
      dockerfile: Dockerfile.optimized.fixed
      target: development
      args:
        DOCKER_BUILDKIT: 1
    image: neural-trader:dev
    environment:
      - DATABASE_URL=postgresql://postgres:dev_password@timescaledb:5432/neural_trader
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
      - RUST_LOG=debug
    ports:
      - "3030:3030"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Use delegated mounts for better performance
      - ./src:/app/src:ro,delegated
      - ./target:/app/target:delegated
    networks:
      - neural_trader_dev
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=neural_trader
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - neural_trader_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neural_trader_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  data-ingestion:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile.optimized.fixed
      args:
        DOCKER_BUILDKIT: 1
    image: neural-trader-data-ingestion:dev
    environment:
      - DATABASE_URL=postgresql://postgres:dev_password@timescaledb:5432/neural_trader
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      # API Keys from environment
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ALPHA_ADVANTAGE_API_KEY=${ALPHA_ADVANTAGE_API_KEY}
      - IEX_CLOUD_API_KEY=${IEX_CLOUD_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - QUANDL_API_KEY=${QUANDL_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-finnhub}
      - NASDAQ_API_KEY=${NASDAQ_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
    ports:
      - "8001:8001"
      - "9091:9090"  # Prometheus metrics
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data_ingestion:/app:ro,delegated
    networks:
      - neural_trader_dev
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Optional monitoring services
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - neural_trader_dev
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-neural_trader}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - neural_trader_dev
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  neural_trader_dev:
    driver: bridge

volumes:
  timescaledb_data:
  redis_data:
  prometheus_data:
  grafana_data: