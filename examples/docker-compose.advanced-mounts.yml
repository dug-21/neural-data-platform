# Advanced Docker Compose Example with Multiple External Mounts
# This file demonstrates various mounting strategies for external data
# Copy and modify as needed for your specific setup

version: '3.8'

services:
  # Data ingestion service with multiple external mounts
  data-ingestion-advanced:
    build:
      context: ..
      dockerfile: docker/data-ingestion/Dockerfile
    container_name: neural_trader_data_ingestion_advanced
    environment:
      # Database configuration
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DATABASE=${POSTGRES_DB:-neural_trader_db}
      - TIMESCALE_USER=${POSTGRES_USER:-neural_trader}
      - TIMESCALE_PASSWORD=${POSTGRES_PASSWORD}
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # External data paths
      - HISTORICAL_DATA_PATH=/mnt/historical-data
      - LIVE_DATA_PATH=/mnt/live-data
      - BACKUP_DATA_PATH=/mnt/backup-data
      - MODEL_PATH=/mnt/models
      - CONFIG_PATH=/mnt/external-config
      # Enable external data features
      - EXTERNAL_DATA_ENABLED=true
      - USE_EXTERNAL_MODELS=true
    volumes:
      # Application code (read-only)
      - ../data_ingestion:/app/data_ingestion:ro
      - ../config:/app/config:ro
      
      # Standard container volumes
      - ingestion_logs:/app/logs
      - ingestion_cache:/app/cache
      
      # === EXTERNAL DRIVE MOUNTS ===
      
      # Primary historical data (USB drive, read-only)
      - type: bind
        source: ${HISTORICAL_DATA_PATH:-/media/user/TradingData}
        target: /mnt/historical-data
        read_only: true
        bind:
          propagation: rprivate
      
      # Live data feed (NFS share, read-only)
      - type: bind
        source: ${LIVE_DATA_PATH:-/mnt/nfs/live-data}
        target: /mnt/live-data
        read_only: true
        bind:
          propagation: shared
      
      # Backup data (external SSD, read-only)
      - type: bind
        source: ${BACKUP_DATA_PATH:-/mnt/backup-ssd}
        target: /mnt/backup-data
        read_only: true
      
      # Machine learning models (external drive, read-only)
      - type: bind
        source: ${MODEL_STORAGE_PATH:-/mnt/model-storage}
        target: /mnt/models
        read_only: true
      
      # External configuration overrides (network share)
      - type: bind
        source: ${EXTERNAL_CONFIG_PATH:-/mnt/config-share}
        target: /mnt/external-config
        read_only: true
      
      # === CONDITIONAL MOUNTS (using profiles) ===
      
      # Development: Local data directory with write access
      # Only mounted when using 'development' profile
      - type: bind
        source: ${DEV_DATA_PATH:-./dev-data}
        target: /mnt/dev-data
        read_only: false
        
      # === NAMED VOLUME MOUNTS ===
      
      # Large working directory on external storage
      - external_workspace:/mnt/workspace
      
    profiles:
      - advanced
    networks:
      - neural_trader_net
    depends_on:
      - timescaledb
      - redis
    restart: unless-stopped

  # Neural trader application with advanced mounting
  neural-trader-advanced:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
    container_name: neural_trader_app_advanced
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-neural_trader}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-neural_trader_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      - TZ=UTC
      # External paths
      - HISTORICAL_DATA_PATH=/mnt/historical-data
      - MODEL_PATH=/mnt/models
      - WORKSPACE_PATH=/mnt/workspace
      - EXTERNAL_DATA_ENABLED=true
    volumes:
      # Application config
      - ../config:/app/config:ro
      - trader_logs:/app/logs
      
      # Same external mounts as data-ingestion
      - type: bind
        source: ${HISTORICAL_DATA_PATH:-/media/user/TradingData}
        target: /mnt/historical-data
        read_only: true
      
      - type: bind
        source: ${MODEL_STORAGE_PATH:-/mnt/model-storage}
        target: /mnt/models
        read_only: true
      
      # Shared workspace for large computations
      - external_workspace:/mnt/workspace
      
    profiles:
      - advanced
    networks:
      - neural_trader_net
    depends_on:
      - timescaledb
      - redis
    restart: unless-stopped

  # Data preprocessing service (optional)
  data-preprocessor:
    image: python:3.11-slim
    container_name: neural_trader_preprocessor
    working_dir: /app
    command: python -c "import time; time.sleep(3600)"  # Keep alive for demo
    environment:
      - INPUT_PATH=/mnt/historical-data
      - OUTPUT_PATH=/mnt/workspace/processed
      - TEMP_PATH=/tmp/processing
    volumes:
      # Input data (read-only)
      - type: bind
        source: ${HISTORICAL_DATA_PATH:-/media/user/TradingData}
        target: /mnt/historical-data
        read_only: true
      
      # Output workspace (read-write)
      - external_workspace:/mnt/workspace
      
      # Temporary processing space (tmpfs for speed)
      - type: tmpfs
        target: /tmp/processing
        tmpfs:
          size: 2G
          mode: 01777
      
    profiles:
      - advanced
      - preprocessing
    networks:
      - neural_trader_net

  # Model training service with GPU support
  model-trainer:
    image: tensorflow/tensorflow:latest-gpu
    container_name: neural_trader_model_trainer
    environment:
      - TRAINING_DATA_PATH=/mnt/historical-data
      - MODEL_OUTPUT_PATH=/mnt/models/training
      - WORKSPACE_PATH=/mnt/workspace
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      # Data sources
      - type: bind
        source: ${HISTORICAL_DATA_PATH:-/media/user/TradingData}
        target: /mnt/historical-data
        read_only: true
      
      # Model storage (read-write for saving new models)
      - type: bind
        source: ${MODEL_STORAGE_PATH:-/mnt/model-storage}
        target: /mnt/models
        read_only: false
      
      # Large workspace for training
      - external_workspace:/mnt/workspace
      
    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    profiles:
      - advanced
      - training
      - gpu
    networks:
      - neural_trader_net

# Named volumes for external storage
volumes:
  # Large workspace on external storage
  external_workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      # This should point to a fast external SSD or large HDD
      device: ${WORKSPACE_PATH:-/mnt/external-workspace}
  
  # Model storage with backup
  model_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_STORAGE_PATH:-/mnt/model-storage}
  
  # Standard volumes from main compose file
  timescale_data:
    driver: local
  redis_data:
    driver: local
  ingestion_logs:
    driver: local
  ingestion_cache:
    driver: local
  trader_logs:
    driver: local

networks:
  neural_trader_net:
    driver: bridge

# Example usage:
# 
# 1. Basic usage with external historical data:
#    HISTORICAL_DATA_PATH=/media/user/TradingData docker-compose -f docker-compose.advanced-mounts.yml --profile advanced up -d
#
# 2. With preprocessing:
#    docker-compose -f docker-compose.advanced-mounts.yml --profile advanced --profile preprocessing up -d
#
# 3. Full setup with GPU training:
#    docker-compose -f docker-compose.advanced-mounts.yml --profile advanced --profile training --profile gpu up -d
#
# 4. Development mode:
#    DEV_DATA_PATH=./dev-data docker-compose -f docker-compose.advanced-mounts.yml --profile advanced --profile development up -d

# Environment variables required:
# - HISTORICAL_DATA_PATH: Path to historical trading data
# - MODEL_STORAGE_PATH: Path to ML model storage
# - WORKSPACE_PATH: Path to large workspace directory
# - POSTGRES_PASSWORD: Database password
# - REDIS_PASSWORD: Redis password

# Optional environment variables:
# - LIVE_DATA_PATH: Path to live data feed
# - BACKUP_DATA_PATH: Path to backup data
# - EXTERNAL_CONFIG_PATH: Path to external configuration
# - DEV_DATA_PATH: Path to development data (development profile only)