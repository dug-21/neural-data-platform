# Podman containers configuration for Neural Trader development
[containers]
# Use fuse-overlayfs for rootless containers
rootless_storage_driver = "overlay"

# Default capabilities
default_capabilities = [
  "CHOWN",
  "DAC_OVERRIDE",
  "FOWNER",
  "FSETID",
  "KILL",
  "NET_BIND_SERVICE",
  "SETFCAP",
  "SETGID",
  "SETPCAP",
  "SETUID",
  "SYS_CHROOT"
]

# Default ulimits
default_ulimits = [
  "nofile=65536:65536"
]

# Environment variables
env = [
  "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  "TERM=xterm"
]

# Use host network for better performance in development
netns = "private"

# Log driver
log_driver = "k8s-file"

# Cgroup manager
cgroup_manager = "cgroupfs"

[network]
# Use slirp4netns for rootless networking
network_backend = "cni"

# Default network name
default_network = "podman"

[engine]
# Number of locks available
num_locks = 2048

# Runtime
runtime = "crun"

# Stop timeout
stop_timeout = 10

# Remote connections
remote = false

# Volume path
volume_path = "/home/vscode/.local/share/containers/storage/volumes"

# Image parallel copies
image_parallel_copies = 0

# Events logger
events_logger = "file"

# Namespace to use
namespace = ""