[package]
name = "neural-ml-ops"
version = "0.1.0"
edition = "2021"
description = "Domain-agnostic ML Operations platform with neural training coordination"

[lib]
name = "neural_ml_ops"
path = "src/lib.rs"

[[bin]]
name = "neural-ml-ops"
path = "src/main.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"

# Configuration
config-store = { path = "../config-store" }

# Neural core - required for EventBus integration
# neural-core = { path = "../neural-core" }

# Protobuf dependencies
prost = "0.12"
prost-types = "0.12"

# Data structures
dashmap = "6.0"
crossbeam = "0.8"
parking_lot = "0.12"

# CLI and server
clap = { version = "4.0", features = ["derive"] }
axum = { version = "0.7", features = ["http2"] }
tower = "0.5"

# Storage and serialization
bincode = "1.3"
sha2 = "0.10"

# Redis for events (optional)
redis = { version = "0.26", features = ["tokio-comp"], optional = true }

# HTTP client for webhooks
reqwest = { version = "0.11", features = ["json"] }

# Additional dependencies
rand = "0.8"
num_cpus = "1.16"
toml = "0.8"

[features]
default = ["events", "storage"]
# neural = ["dep:neural-core", "dep:ruv-fann"]
events = ["dep:redis"]
storage = []

[dev-dependencies]
tempfile = "3.14"
tokio-test = "0.4"