# Tarpaulin configuration for neural-trader
# Targeting 85% coverage for new code

[default]
# Exclude files that shouldn't be measured
exclude-files = [
    "vendor/*",
    "target/*",
    "tests/*",
    "benches/*",
    "examples/*",
    "src/bin/*",
    "build.rs",
    "**/mod.rs"  # Exclude module files that just re-export
]

# General settings
ignore-panics = true
ignore-tests = false
force-clean = false
verbose = false
timeout = "600s"
release = false
all-features = false
workspace = true
locked = false
frozen = false
target-dir = "target/tarpaulin"

# Coverage thresholds
# fail-under = 85  # Uncomment to enforce 85% coverage

# Output formats
out = ["Html", "Lcov", "Json"]
output-dir = "target/coverage"

# Parallel test execution
test-threads = 4
jobs = 4

# Include/exclude patterns for source files
packages = ["autonomous-platform", "mcp-trading-server"]

[report]
# Skip files with no coverage
skip-clean = false

# Coverage report settings
ignore-panics = true
print-summary = true
print-uncovered-lines = true

[phase1-neural]
# Specific configuration for Phase 1 neural components
packages = ["autonomous-platform"]
exclude-files = [
    "vendor/*",
    "target/*",
    "tests/*",
    "benches/*",
    "examples/*",
    "src/bin/*",
    "src/daa/*",  # Exclude DAA for Phase 1 focus
    "src/agents/*"  # Exclude agents for Phase 1 focus
]

# Focus on neural components
include-tests = true
test-names = [
    "neural",
    "fann",
    "predictor",
    "strategy",
    "feature"
]

[phase1-features]
# Configuration for Phase 1 feature engineering
packages = ["autonomous-platform"]
exclude-files = [
    "vendor/*",
    "target/*",
    "tests/*",
    "benches/*",
    "examples/*",
    "src/bin/*"
]

# Focus on feature components
include-tests = true
test-names = [
    "features",
    "technical_indicators",
    "market_microstructure",
    "regime_detection",
    "cross_asset"
]

[phase1-backtesting]
# Configuration for Phase 1 backtesting
packages = ["autonomous-platform"]
exclude-files = [
    "vendor/*",
    "target/*",
    "tests/*",
    "benches/*",
    "examples/*",
    "src/bin/*"
]

# Focus on backtesting components
include-tests = true
test-names = [
    "backtesting",
    "walk_forward",
    "monte_carlo",
    "ab_testing",
    "engine"
]

[integration]
# Configuration for integration tests
packages = ["autonomous-platform", "mcp-trading-server"]
test-types = ["integration", "lib"]
release = false

[unit]
# Configuration for unit tests only
packages = ["autonomous-platform", "mcp-trading-server"]
test-types = ["unit", "lib"]
release = false