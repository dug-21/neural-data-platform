version: '3.8'

services:
  # TimescaleDB - Time-series database optimized for trading data
  timescaledb:
    build:
      context: .
      dockerfile: docker/timescaledb/Dockerfile
    container_name: neural_trader_timescaledb
    hostname: timescaledb
    environment:
      - POSTGRES_USER=neural_trader
      - POSTGRES_PASSWORD=neural_trader_pass
      - POSTGRES_DB=neural_trader_db
      - POSTGRES_SHARED_BUFFERS=2GB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=6GB
      - POSTGRES_MAINTENANCE_WORK_MEM=512MB
      - POSTGRES_WORK_MEM=128MB
      - POSTGRES_MAX_CONNECTIONS=200
      - POSTGRES_MAX_PARALLEL_WORKERS=8
      - POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER=4
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init-scripts:/docker-entrypoint-initdb.d:ro
      - timescale_logs:/var/log/postgresql
    ports:
      - "5432:5432"
    networks:
      - neural_trader_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neural_trader -d neural_trader_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # Redis - In-memory data store for real-time market data
  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: neural_trader_redis
    hostname: redis
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - neural_trader_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Python Data Ingestion Service
  data-ingestion:
    build:
      context: .
      dockerfile: docker/data-ingestion/Dockerfile
    container_name: neural_trader_data_ingestion
    hostname: data-ingestion
    environment:
      - DATABASE_URL=postgresql://neural_trader:neural_trader_pass@timescaledb:5432/neural_trader_db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    volumes:
      - ./data_ingestion:/app/data_ingestion:ro
      - ./config:/app/config:ro
      - ingestion_logs:/app/logs
      - ingestion_cache:/app/cache
    ports:
      - "8001:8000"  # Metrics port
    networks:
      - neural_trader_net
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Neural Trader Main Application
  neural-trader:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: neural_trader_app
    hostname: neural-trader
    environment:
      - DATABASE_URL=postgresql://neural_trader:neural_trader_pass@timescaledb:5432/neural_trader_db
      - REDIS_URL=redis://redis:6379/0
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - TZ=UTC
    volumes:
      - ./config:/app/config:ro
      - trader_logs:/app/logs
    ports:
      - "3030:3030"  # Metrics/API port
    networks:
      - neural_trader_net
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: neural_trader_prometheus
    hostname: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - neural_trader_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: neural_trader_grafana
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=neural_trader_admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - neural_trader_net
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Redis Commander for Redis management (development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: neural_trader_redis_commander
    hostname: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - neural_trader_net
    depends_on:
      - redis
    profiles:
      - development
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # pgAdmin for PostgreSQL management (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: neural_trader_pgadmin
    hostname: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@neuraltrader.local
      - PGADMIN_DEFAULT_PASSWORD=neural_trader_admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8082:80"
    networks:
      - neural_trader_net
    depends_on:
      - timescaledb
    profiles:
      - development
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  timescale_data:
    driver: local
  timescale_logs:
    driver: local
  redis_data:
    driver: local
  ingestion_logs:
    driver: local
  ingestion_cache:
    driver: local
  trader_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  neural_trader_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16