# Data Requirements Configuration
# Defines data type characteristics and quality requirements for dynamic data discovery (Phase 3)

[data_discovery]
# Enable dynamic data type discovery system
enabled = true
dynamic_type_registration = true    # Allow runtime registration of new data types
channel_agnostic = true            # Work with any Redis channel pattern
auto_model_activation = true       # Automatically activate models when data available

# Supported data scopes for multi-scope routing
supported_scopes = ["symbol", "market", "sector", "geographic"]

# Global data quality settings
global_quality_threshold = 0.7     # Minimum quality score for any data type
freshness_weight = 0.3             # Weight for data freshness in quality score
completeness_weight = 0.4          # Weight for data completeness
consistency_weight = 0.3           # Weight for data consistency

[characteristic_requirements]
# Define requirements by data characteristics, not specific types

[characteristic_requirements.high_frequency]
# For data that updates frequently (price, volume, order flow)
description = "High-frequency market data characteristics"
min_update_frequency_seconds = 60  # Must update at least this often
max_latency_ms = 100              # Maximum acceptable latency
min_history_samples = 1000        # Minimum historical samples needed
quality_threshold = 0.95          # High quality requirement
compression_enabled = true        # Enable compression for storage

[characteristic_requirements.medium_frequency]
# For data that updates periodically (sentiment, news, analyst ratings)
description = "Medium-frequency auxiliary data"
min_update_frequency_seconds = 300 # 5-minute minimum update
max_latency_ms = 1000             # 1 second acceptable latency
min_history_samples = 500         # Moderate history requirement
quality_threshold = 0.85          # Good quality requirement
compression_enabled = true

[characteristic_requirements.low_frequency]
# For data that updates rarely (earnings, economic indicators)
description = "Low-frequency fundamental data"
min_update_frequency_seconds = 86400  # Daily updates acceptable
max_latency_ms = 5000             # 5 seconds acceptable
min_history_samples = 100         # Minimal history needed
quality_threshold = 0.90          # High accuracy more important than frequency
compression_enabled = false

[characteristic_requirements.event_based]
# For data that arrives sporadically (FDA approvals, M&A, breaking news)
description = "Event-driven data without regular schedule"
event_driven = true               # No regular update schedule
max_latency_ms = 500              # Fast processing when events occur
min_history_samples = 50          # Limited history expected
quality_threshold = 0.95          # High quality critical for events
deduplication_required = true     # Prevent duplicate events

[data_routing]
# Configuration for multi-scope data routing

[data_routing.symbol_specific]
# Data specific to individual symbols
channel_patterns = ["symbol:*:*", "ticker:*:*", "stock:*:*"]
routing_key_position = 1          # Position of symbol in channel name
cache_ttl_seconds = 60            # Cache symbol data for 1 minute
priority = 1                      # Highest priority routing

[data_routing.market_wide]
# Data affecting entire market
channel_patterns = ["market:*", "index:*", "broad:*"]
broadcast_to_all_symbols = true   # Send to all active symbols
cache_ttl_seconds = 300           # Cache market data for 5 minutes
priority = 2

[data_routing.sector_specific]
# Data specific to market sectors
channel_patterns = ["sector:*:*", "industry:*:*", "etf:*:*"]
routing_key_position = 1          # Position of sector in channel name
map_to_symbols = true             # Route to all symbols in sector
cache_ttl_seconds = 180           # Cache sector data for 3 minutes
priority = 3

[data_routing.geographic]
# Data specific to geographic regions
channel_patterns = ["geo:*:*", "region:*:*", "country:*:*"]
routing_key_position = 1          # Position of region in channel name
map_to_affected_symbols = true    # Route based on symbol geography
cache_ttl_seconds = 600           # Cache geographic data longer
priority = 4

[quality_assessment]
# How to assess data quality dynamically

[quality_assessment.scoring]
# Scoring methodology for data quality
missing_data_penalty = 0.1        # Penalty per 1% missing data
stale_data_penalty = 0.05         # Penalty per hour of staleness
inconsistency_penalty = 0.2       # Penalty for inconsistent values
source_reliability_weight = 0.3   # Weight for source reputation

[quality_assessment.thresholds]
# Minimum thresholds for data usage
critical_quality = 0.9            # Required for critical decisions
standard_quality = 0.7            # Required for normal operations
experimental_quality = 0.5        # Minimum for experimental features
reject_below = 0.3                # Reject data below this quality

[model_activation]
# Rules for automatic model activation based on data availability

[model_activation.rules]
# Activation rules based on data characteristics
basic_models = { required_chars = ["high_frequency"], quality_threshold = 0.8 }
advanced_models = { required_chars = ["high_frequency", "medium_frequency"], quality_threshold = 0.85 }
expert_models = { required_chars = ["high_frequency", "medium_frequency", "low_frequency"], quality_threshold = 0.9 }
experimental_models = { required_chars = ["event_based"], quality_threshold = 0.95 }

[model_activation.priority]
# Priority order for model activation when resources limited
priority_order = ["basic_models", "advanced_models", "expert_models", "experimental_models"]
max_active_models_per_symbol = 5  # Limit models per symbol
resource_based_limiting = true    # Reduce models under resource pressure

[data_evolution]
# Configuration for progressive data enhancement

[data_evolution.stages]
# Stages of data evolution as new sources become available
stage1 = { name = "price_only", min_characteristics = ["high_frequency"] }
stage2 = { name = "price_plus_sentiment", min_characteristics = ["high_frequency", "medium_frequency"] }
stage3 = { name = "multi_modal", min_characteristics = ["high_frequency", "medium_frequency", "low_frequency"] }
stage4 = { name = "full_spectrum", min_characteristics = ["high_frequency", "medium_frequency", "low_frequency", "event_based"] }

[data_evolution.transitions]
# Rules for transitioning between stages
upgrade_on_quality_improvement = true   # Move to higher stage when quality improves
downgrade_on_quality_degradation = true # Move to lower stage if quality drops
transition_cooldown_minutes = 30        # Wait between stage transitions
notify_on_transition = true             # Send notifications for stage changes