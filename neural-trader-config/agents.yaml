# Agent Configuration
# Defines autonomous agents for the trading system
# Optimized for personal day trading with neural model assignments

agents:
  # Market Analyzer - Uses NHITS for trend prediction
  market_analyzer:
    type: researcher
    name: "Market Trend Analyzer"
    capabilities:
      - market_data_analysis
      - pattern_recognition
      - trend_forecasting
      - multi_timeframe_analysis
    neural_model:
      primary: NHITS        # Excellent for trend prediction
      config:
        horizon: 24         # 24 periods ahead
        hidden_size: 256
        n_blocks: 3
        confidence_threshold: 0.75
    data_windows:
      - 1m                  # Micro movements
      - 5m                  # Short-term trends
      - 15m                 # Medium-term patterns
      - 1h                  # Intraday trends
    data_sources:
      - timescale          # Historical data
      - redis              # Real-time streaming
    analysis_metrics:
      - trend_strength
      - momentum
      - volume_profile
      - support_resistance
    update_frequency: 10s   # Fast updates for day trading
    
  # Entry Signal Agent - Uses NHITS for buy/sell timing
  entry_signal_agent:
    type: analyst
    name: "Entry Signal Generator"
    capabilities:
      - signal_generation
      - entry_timing
      - probability_assessment
      - confluence_detection
    neural_model:
      primary: NHITS        # For precise timing predictions
      config:
        horizon: 12         # 12 periods ahead for entry
        hidden_size: 128
        n_blocks: 2
        min_confidence: 0.8  # High confidence for entries
    signal_criteria:
      - trend_alignment
      - momentum_confirmation
      - volume_breakout
      - pattern_completion
    data_windows:
      - 1m                  # Precise entry timing
      - 5m                  # Confirmation timeframe
    entry_rules:
      max_signals_per_day: 5
      min_reward_ratio: 2.0  # 2:1 risk/reward minimum
      confluence_required: 3  # Need 3 confirming factors
    
  # Risk Manager - Uses DeepAR for volatility prediction
  risk_manager:
    type: analyst
    name: "Dynamic Risk Manager"
    capabilities:
      - portfolio_analysis
      - risk_assessment
      - position_sizing
      - volatility_prediction
      - drawdown_protection
    neural_model:
      primary: DeepAR       # Excellent for volatility/uncertainty
      config:
        prediction_length: 30
        context_length: 100
        num_samples: 100
        quantiles: [0.1, 0.5, 0.9]
    day_trading_rules:
      max_position: 0.02    # 2% per trade for day trading
      max_daily_loss: 0.03  # 3% daily loss limit
      stop_loss: 0.01       # 1% hard stop
      trailing_stop: 0.005  # 0.5% trailing stop
      max_drawdown: 0.05    # 5% max drawdown
      correlation_limit: 0.5 # Lower correlation for day trades
    volatility_adjustments:
      high_volatility_reduction: 0.5  # Halve position in high vol
      low_volatility_increase: 1.2    # 20% increase in low vol
    monitoring:
      - positions
      - market_exposure
      - volatility
      - daily_pnl
      - win_rate
      
  # Position Sizer - Uses MLP for optimal sizing
  position_sizer:
    type: optimizer
    name: "Adaptive Position Sizer"
    capabilities:
      - optimal_sizing
      - kelly_criterion
      - risk_adjusted_sizing
      - account_balance_management
    neural_model:
      primary: MLP          # Non-linear optimization
      config:
        hidden_layers: [128, 64, 32]
        dropout: 0.2
        activation: "relu"
    sizing_inputs:
      - account_balance
      - win_rate
      - average_win_loss
      - current_drawdown
      - market_volatility
      - correlation_exposure
    sizing_rules:
      min_position: 0.005   # 0.5% minimum
      max_position: 0.02    # 2% maximum
      kelly_fraction: 0.25  # Conservative Kelly
      scale_with_confidence: true
    day_trading_adjustments:
      morning_session: 0.8  # 80% size in morning
      afternoon_session: 1.0 # Full size midday
      closing_hour: 0.5     # 50% size near close
      
  # Exit Strategy Agent - Uses TCN for exit timing
  exit_strategy_agent:
    type: optimizer
    name: "Smart Exit Manager"
    capabilities:
      - exit_timing
      - profit_taking
      - stop_management
      - time_based_exits
    neural_model:
      primary: TCN          # Temporal patterns for exits
      config:
        num_channels: [32, 64, 128]
        kernel_size: 3
        dropout: 0.1
        lookback: 50
    exit_strategies:
      - profit_target
      - trailing_stop
      - time_decay
      - momentum_exhaustion
      - support_breakdown
    day_trading_exits:
      quick_scalp:
        target: 0.005       # 0.5% quick profit
        time_limit: 5m      # Exit within 5 minutes
      standard_trade:
        target: 0.01        # 1% standard target
        time_limit: 30m     # 30 minute max hold
      runner_position:
        target: 0.02        # 2% for runners
        trailing_stop: 0.007 # Tight trailing stop
    end_of_day:
      close_all_positions: true
      cutoff_time: "15:30"  # Close 30min before market close
      
  # Execution Agent - Fast order execution
  execution_agent:
    type: coder
    name: "High-Speed Executor"
    capabilities:
      - order_execution
      - slippage_minimization
      - timing_optimization
      - order_splitting
    execution_params:
      order_types: ["market", "limit", "stop", "stop_limit"]
      max_slippage: 0.0005   # 0.05% for day trading
      retry_attempts: 2      # Quick retries
      timeout_seconds: 5     # Fast timeout
    day_trading_optimization:
      use_limit_orders: true
      price_improvement: 0.0001
      avoid_market_open: 5m  # Wait 5min after open
      avoid_market_close: 10m # Stop 10min before close
      
  # Master Coordinator - Orchestrates all agents
  coordinator:
    type: coordinator
    name: "Day Trading Orchestrator"
    capabilities:
      - agent_orchestration
      - conflict_resolution
      - decision_aggregation
      - performance_monitoring
    coordination:
      mode: "fast_consensus"  # Quick decisions for day trading
      consensus_threshold: 0.6  # Lower threshold for speed
      decision_timeout: 2s      # Fast decision making
      voting_weight:
        market_analyzer: 0.25
        entry_signal_agent: 0.20
        risk_manager: 0.30     # Risk gets highest weight
        position_sizer: 0.10
        exit_strategy_agent: 0.15
    conflict_resolution:
      priority_order:
        - risk_manager         # Risk always wins
        - exit_strategy_agent  # Exits are critical
        - entry_signal_agent
        - market_analyzer
        - position_sizer
    performance_tracking:
      - daily_pnl
      - win_rate
      - average_hold_time
      - profit_factor
      - max_drawdown