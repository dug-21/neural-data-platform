# Trading System Configuration
# Neural Trading Platform with DAA Integration
# Optimized for Personal Day Trading

system:
  mode: production
  environment: stock_day_trading
  log_level: info
  performance_tracking: true

# Neural Model Configuration for Day Trading
neural:
  model_assignments:
    market_analyzer:
      type: NHITS
      purpose: "Trend prediction and pattern recognition"
      config:
        horizon: 24
        confidence_threshold: 0.8
        update_frequency: 10s
    
    entry_signals:
      type: NHITS
      purpose: "Precise entry timing"
      config:
        horizon: 12
        confidence_threshold: 0.85
        min_signal_strength: 0.7
    
    risk_management:
      type: DeepAR
      purpose: "Volatility prediction and risk assessment"
      config:
        samples: 100
        quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
        volatility_window: 30m
    
    position_sizing:
      type: MLP
      purpose: "Optimal position size calculation"
      config:
        layers: [128, 64, 32]
        inputs: ["volatility", "win_rate", "drawdown", "time_of_day"]
    
    exit_timing:
      type: TCN
      purpose: "Exit signal generation"
      config:
        temporal_window: 50
        channels: [32, 64, 128]
        
  ensemble_mode: "weighted_voting"
  fallback_strategy: "conservative"  # Reduce size on model disagreement

# Agent Configuration for Day Trading
agents:
  spawn_strategy: immediate       # Fast spawning for day trading
  max_agents: 6                  # All specialized agents
  coordination: fast_hierarchical # Quick decision making
  topology: hierarchical
  
  initialization:
    auto_spawn_on_start: true
    agent_order:
      - market_analyzer          # First: understand market
      - risk_manager            # Second: establish risk params
      - entry_signal_agent      # Third: look for entries
      - position_sizer          # Fourth: size positions
      - exit_strategy_agent     # Fifth: manage exits
      - execution_agent         # Sixth: execute trades
      
  communication:
    protocol: "memory_based"     # Fast shared memory
    update_frequency: 1s         # Rapid updates
    consensus_timeout: 2s        # Quick decisions

# Day Trading Specific Configuration
trading:
  style: "day_trading"
  
  # Asset Configuration
  symbols: 
    primary: ["AAPL", "MSFT", "GOOG", "NVDA"]     # Main focus
    secondary: ["SPY", "QQQ", "TSLA", "NVDA"] # When opportunities arise
    watchlist: ["META", "NFLX", "AMD", "CRM"]
    max_correlation: 0.6                  # Avoid correlated trades
  
  # Timeframe Configuration for Day Trading
  timeframes:
    execution: "1m"        # Trade execution timeframe
    signal: "5m"          # Signal generation
    trend: "15m"          # Trend confirmation
    context: "1h"         # Market context
    
  # Position Management
  positions:
    max_concurrent: 2      # Maximum 2 positions at once
    max_per_symbol: 1     # One position per symbol
    max_daily_trades: 10  # Avoid overtrading
    
  # Risk Management for Day Trading
  risk_management:
    risk_per_trade: 0.01   # 1% risk per trade
    daily_loss_limit: 0.03 # 3% daily stop
    profit_target: 0.02    # 2% daily profit target
    
    # Time-based rules
    trading_hours:
      start: "09:35"       # Start 5 min after market open
      end: "15:30"         # End 30 min before close
      avoid_lunch: true   # Trade through lunch
      
    # Stock-specific filters
    price_filters:
      min_price: 10.0            # Avoid penny stocks
      max_price: 1000.0          # Avoid extremely high-priced stocks
      min_volume: 1000000        # Min 1M daily volume
      min_avg_volume: 500000     # Min 500K average volume

    # Volatility adjustments
    volatility_filters:
      min_atr: 0.002       # Minimum 0.2% ATR
      max_atr: 0.05        # Maximum 5% ATR
      adjust_size: true    # Reduce size in high volatility
      
  # Order Configuration
  orders:
    default_type: "limit"
    slippage_protection: 0.0005  # 0.05% max slippage
    partial_fills: true
    time_in_force: "IOC"         # Immediate or cancel for day trading
    
  # Performance Tracking
  metrics:
    track_intraday: true
    calculate_sharpe: true
    monitor_drawdown: true
    alert_thresholds:
      daily_loss: -0.02          # Alert at 2% loss
      consecutive_losses: 3      # Alert after 3 losses
      low_win_rate: 0.4         # Alert if win rate < 40%

# Data Configuration for Real-time Day Trading
data:
  # TimescaleDB for historical data
  timescale:
    url: "postgresql://postgres:${POSTGRES_PASSWORD:-dev_password}@localhost:5432/neural_trader
    host: localhost
    port: 5432
    database: neural_trader
    username: postgres
    password: ${POSTGRES_PASSWORD:-dev_password}
    max_connections: 20        # More connections for day trading
    connection_timeout: 5s     # Fast timeout
    
    # Optimized for day trading queries
    query_optimization:
      use_indexes: true
      cache_recent: "1h"      # Cache last hour
      compression: "aggressive" # Compress older data
      
  # Redis for real-time data
  redis:
    url: "redis://localhost:6379"
    host: localhost
    port: 6379
    db: 0
    pool_size: 20             # Larger pool for real-time
    
    # Stream configuration
    streams:
      market_data:
        retention: "1h"        # Keep 1 hour in memory
        batch_size: 100
      signals:
        retention: "30m"
        batch_size: 10
      executions:
        retention: "1d"        # Keep executions for analysis
        batch_size: 1
        
    # Pub/Sub for agent communication
    pubsub:
      channels:
        - "market_updates"
        - "trade_signals"
        - "risk_alerts"
        - "execution_status"
        
# Day Trading Session Management
session:
  pre_market:
    duration: "30m"
    actions:
      - "load_models"
      - "check_positions"
      - "analyze_overnight"
      - "prepare_watchlist"
      
  market_hours:
    actions:
      - "monitor_signals"
      - "execute_trades"
      - "manage_positions"
      - "track_performance"
      
  post_market:
    duration: "30m"
    actions:
      - "close_positions"
      - "calculate_metrics"
      - "update_models"
      - "generate_report"

# Paper Trading Settings
paper_trading:
  initial_capital: 10000.00
  commission_per_share: 0.005   # $0.005 per share
  min_commission: 1.00           # $1 minimum
  
  # Realistic stock market simulation
  market_impact:
    enabled: true
    impact_factor: 0.0001        # 0.01% per $1000 traded
    
  spread_simulation:
    enabled: true
    min_spread: 0.01             # $0.01 minimum spread
    spread_factor: 0.0002        # 0.02% of price
      
# Backtesting Configuration
backtest:
  enabled: true
  data_range: "30d"            # Last 30 days
  validate_models: true
  paper_trade_first: true      # Always paper trade new strategies
  min_sample_trades: 100       # Need 100 trades before live