# Autonomous Training Configuration
# This configuration controls the DAA autonomous training system and real-time adaptive capabilities

[autonomous_training]
# Master control for autonomous training system
enabled = true
accuracy_threshold = 0.8          # Minimum accuracy before triggering retraining (Phase 3 requirement)
error_rate_threshold = 0.1        # Maximum error rate threshold (Phase 3 requirement)
consecutive_failure_threshold = 5  # Failures before model rollback (Phase 3 requirement)
checkpoint_interval_minutes = 30   # How often to save model checkpoints
max_training_duration_hours = 2    # Maximum time for a single training session
min_samples_for_training = 1000    # Minimum data samples required to initiate training
performance_update_interval_ms = 50 # How often to update performance metrics (Phase 3 target)

[realtime_training]
# Real-time adaptive training configuration (Phase 3)
enabled = true
online_learning_rate = 0.001       # Base learning rate for online updates
gradient_update_latency_ms = 50    # Target latency for gradient updates (Phase 3 target)
rollback_threshold = 5             # Consecutive failures before automatic rollback
checkpoint_retention_days = 7      # How long to keep model checkpoints
adaptive_learning_rates = true     # Enable dynamic learning rate adjustment
market_regime_detection = true     # Detect and adapt to market regime changes

[performance_triggers]
# Thresholds that trigger autonomous training decisions
accuracy_degradation = 0.05        # Retrain if accuracy drops by this amount
latency_threshold_ms = 150         # Retrain if prediction latency exceeds this
memory_usage_threshold = 0.85      # Trigger optimization if memory exceeds this
confidence_threshold = 0.65        # Minimum acceptable confidence level

[training_scheduler]
# Configuration for the DAA training scheduler
enabled = true
market_aware_scheduling = true     # Respect market hours for training
resource_limit_during_market = 0.3 # Max CPU usage during market hours
resource_limit_after_hours = 0.8   # Max CPU usage after market hours
preferred_training_window = "02:00-06:00"  # Preferred UTC training window
emergency_training_enabled = true  # Allow immediate training for critical issues

[model_validation]
# Validation settings for newly trained models
cross_validation_folds = 5         # Number of CV folds
validation_split = 0.2             # Portion of data for validation
min_improvement_threshold = 0.02   # Minimum improvement to accept new model
backtesting_required = true        # Require backtesting before deployment
backtesting_days = 30              # Days of historical data for backtesting

[resource_management]
# Resource allocation for training operations
max_concurrent_training = 2        # Maximum parallel training jobs
memory_limit_gb = 2.0              # Memory limit per training job
cpu_cores_limit = 4                # CPU cores per training job
gpu_enabled = false                # Enable GPU acceleration if available
disk_space_limit_gb = 5.0          # Disk space for checkpoints and models

[failure_handling]
# How to handle training failures and errors
max_retry_attempts = 3             # Retry failed training this many times
retry_delay_minutes = 5            # Wait between retry attempts
fallback_to_previous = true        # Use previous model if training fails
alert_on_failure = true            # Send alerts for training failures
failure_cooldown_hours = 1         # Wait before attempting after repeated failures

[data_requirements]
# Data quality requirements for training
min_data_quality_score = 0.8       # Minimum data quality to proceed
stale_data_threshold_hours = 2     # Data older than this is considered stale
missing_data_tolerance = 0.05      # Maximum acceptable missing data ratio
outlier_detection_enabled = true   # Remove outliers before training
outlier_std_threshold = 4.0        # Standard deviations for outlier detection

[integration]
# Integration with other system components
redis_channel = "training:updates"  # Redis channel for training notifications
persist_to_database = true         # Save training history to database
emit_metrics = true                # Emit training metrics for monitoring
webhook_notifications = false      # Send webhook notifications for events
log_level = "info"                 # Logging level for training operations