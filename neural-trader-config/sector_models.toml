# ===== MODEL CONFIGURATIONS =====

[models.technology_lstm]
model_type = "LSTM"
sector = "technology"
description = "LSTM model optimized for technology sector patterns"
required_data = ["price", "volume", "market_cap"]
optional_data = ["sentiment", "news", "earnings", "insider_trading"]
preferred_data = ["options_flow", "social_media", "analyst_ratings"]
max_memory_mb = 256
min_accuracy = 0.78
max_latency_ms = 80
ensemble_weight = 0.35
lazy_load_conditions = ["data_available", "performance_threshold"]
specialization_layers = 2

[models.technology_transformer]
model_type = "Transformer"
sector = "technology"
description = "Transformer model for complex technology sector relationships"
required_data = ["price", "volume", "sentiment", "market_cap"]
optional_data = ["news", "social_media", "earnings"]
preferred_data = ["options_flow", "insider_trading", "analyst_ratings"]
max_memory_mb = 512
min_accuracy = 0.82
max_latency_ms = 120
ensemble_weight = 0.40
lazy_load_conditions = ["enhanced_data_available", "high_volatility"]
specialization_layers = 3

[models.technology_tcn]
model_type = "TCN"
sector = "technology"
description = "Temporal Convolutional Network for technology sector time series"
required_data = ["price", "volume"]
optional_data = ["sentiment", "news"]
preferred_data = ["options_flow"]
max_memory_mb = 192
min_accuracy = 0.75
max_latency_ms = 60
ensemble_weight = 0.25
lazy_load_conditions = ["real_time_mode"]
specialization_layers = 1

[models.financial_lstm]
model_type = "LSTM"
sector = "financial_services"
description = "LSTM optimized for financial services patterns"
required_data = ["price", "volume", "interest_rates"]
optional_data = ["economic_indicators", "fed_minutes", "yield_curve"]
preferred_data = ["credit_spreads", "sector_rotation"]
max_memory_mb = 224
min_accuracy = 0.76
max_latency_ms = 70
ensemble_weight = 0.40
lazy_load_conditions = ["data_available"]
specialization_layers = 2

[models.financial_deepar]
model_type = "DeepAR"
sector = "financial_services"
description = "DeepAR for financial sector probabilistic forecasting"
required_data = ["price", "volume", "interest_rates"]
optional_data = ["economic_indicators", "volatility"]
preferred_data = ["options_data", "earnings"]
max_memory_mb = 288
min_accuracy = 0.78
max_latency_ms = 100
ensemble_weight = 0.35
lazy_load_conditions = ["uncertainty_quantification"]
specialization_layers = 2

[models.healthcare_nhits]
model_type = "NHITS"
sector = "healthcare"
description = "NHITS model for healthcare sector hierarchical forecasting"
required_data = ["price", "volume"]
optional_data = ["fda_announcements", "clinical_trials"]
