specialization_layers = 1

# ===== DATA REQUIREMENTS =====

[data_requirements]
description = "Global data requirements and availability thresholds"

[data_requirements.required]
price = { min_history_days = 30, update_frequency = "1min", quality_threshold = 0.95 }
volume = { min_history_days = 30, update_frequency = "1min", quality_threshold = 0.90 }
market_cap = { min_history_days = 1, update_frequency = "daily", quality_threshold = 0.98 }

[data_requirements.optional]
sentiment = { min_history_days = 7, update_frequency = "5min", quality_threshold = 0.80 }
news = { min_history_days = 14, update_frequency = "realtime", quality_threshold = 0.75 }
earnings = { min_history_days = 90, update_frequency = "quarterly", quality_threshold = 0.99 }
economic_indicators = { min_history_days = 365, update_frequency = "monthly", quality_threshold = 0.95 }

[data_requirements.preferred]
options_flow = { min_history_days = 5, update_frequency = "1min", quality_threshold = 0.85 }
insider_trading = { min_history_days = 30, update_frequency = "daily", quality_threshold = 0.90 }
analyst_ratings = { min_history_days = 60, update_frequency = "daily", quality_threshold = 0.88 }
social_media = { min_history_days = 3, update_frequency = "realtime", quality_threshold = 0.70 }

# ===== PERFORMANCE CONFIGURATION =====

[performance]
description = "Performance thresholds and optimization settings"

[performance.memory_optimization]
enable_shared_features = true
feature_cache_ttl_seconds = 300
max_cache_size_mb = 1024
enable_lazy_loading = true
unload_inactive_models_minutes = 15
memory_pressure_threshold = 0.85

[performance.prediction_latency]
max_prediction_latency_ms = 100
max_ensemble_latency_ms = 150
timeout_strategy = "fallback_to_fastest"
enable_parallel_inference = true
max_concurrent_predictions = 8

[performance.accuracy_thresholds]
min_sector_accuracy = 0.70
min_symbol_accuracy = 0.65
ensemble_confidence_threshold = 0.75
consensus_threshold = 0.70
performance_degradation_threshold = 0.05

[performance.resource_limits]
max_total_memory_gb = 4.0
max_cpu_percent = 80.0
max_gpu_percent = 90.0
disk_cache_limit_gb = 10.0
network_bandwidth_limit_mbps = 100.0

# ===== HIERARCHICAL DAA CONFIGURATION =====

[daa_coordination]
description = "Hierarchical DAA coordination settings"

[daa_coordination.master_coordinator]
portfolio_consensus_threshold = 0.70
cross_sector_risk_weight = 0.30
meta_predictor_weight = 0.20
max_portfolio_positions = 20
rebalancing_frequency = "hourly"

[daa_coordination.sector_coordinators]
sector_consensus_threshold = 0.65
intra_sector_correlation_limit = 0.80
max_sector_positions = 4
position_sizing_method = "risk_parity"
risk_per_sector = 0.02

[daa_coordination.voting_mechanisms]
voting_strategy = "weighted_confidence"
minimum_model_agreement = 0.60
uncertainty_penalty_factor = 0.15
recency_bias_factor = 0.10
performance_weight_decay = 0.95

# ===== INTEGRATION SETTINGS =====

[integration]
description = "Integration with existing systems"

[integration.redis_channels]
preserve_symbol_channels = true
add_sector_aggregation = true
sector_metrics_ttl = 180
enable_cross_sector_messaging = true

[integration.daa_bridge]
enable_legacy_compatibility = true
enhanced_decision_weight = 0.70
legacy_decision_weight = 0.30
performance_feedback_enabled = true

[integration.health_monitoring]
enable_sector_health_checks = true
health_check_interval_seconds = 30
sector_degradation_threshold = 0.10
auto_failover_enabled = true

# ===== LAZY LOADING CONDITIONS =====

[lazy_loading]
description = "Conditions for model activation and deactivation"

[lazy_loading.activation_conditions]
data_available = { required_data_coverage = 0.90, preferred_data_coverage = 0.70 }
performance_threshold = { accuracy_above = 0.75, latency_below_ms = 100 }
enhanced_data_available = { preferred_data_coverage = 0.85, optional_data_coverage = 0.60 }
high_volatility = { volatility_percentile = 0.90, volume_spike_factor = 2.0 }
real_time_mode = { latency_requirement_ms = 50, accuracy_requirement = 0.70 }
uncertainty_quantification = { confidence_required = 0.80, prediction_intervals = true }
regulatory_events = { fda_calendar = true, earnings_season = true }
commodity_volatility = { oil_volatility_threshold = 0.05, correlation_threshold = 0.60 }
consumer_data_available = { consumer_confidence = true, retail_sales = true }
macro_economic_shifts = { fed_meeting = true, inflation_data = true }
economic_indicators = { pmi_available = true, employment_data = true }

[lazy_loading.deactivation_conditions]
performance_degradation = { accuracy_drop = 0.05, consecutive_failures = 5 }
resource_pressure = { memory_usage_above = 0.90, cpu_usage_above = 0.95 }
data_unavailable = { required_data_missing_hours = 2, quality_below = 0.80 }
market_closed = { extended_hours = false, low_volume_threshold = 0.10 }

# ===== TESTING AND VALIDATION =====

[testing]
description = "Configuration for testing and validation"

[testing.backtesting]
min_backtest_days = 252
validation_split = 0.20
walk_forward_windows = 12
monte_carlo_simulations = 1000

[testing.performance_benchmarks]
benchmark_symbols = ["SPY", "QQQ", "XLK", "XLF", "XLV"]
performance_metrics = ["sharpe_ratio", "max_drawdown", "win_rate", "profit_factor"]
min_benchmark_outperformance = 0.02

[testing.model_validation]
cross_validation_folds = 5
holdout_test_percentage = 0.15
statistical_significance_level = 0.05
minimum_sample_size = 1000