lazy_load_conditions = ["regulatory_events"]
specialization_layers = 2

[models.energy_lstm]
model_type = "LSTM"
sector = "energy"
description = "LSTM for energy sector with commodity correlation"
required_data = ["price", "volume", "oil_prices", "gas_prices"]
optional_data = ["weather_data", "inventory_reports"]
preferred_data = ["drilling_permits", "production_data"]
max_memory_mb = 160
min_accuracy = 0.72
max_latency_ms = 75
ensemble_weight = 0.60
lazy_load_conditions = ["commodity_volatility"]
specialization_layers = 1

[models.consumer_discretionary_mlp]
model_type = "MLP"
sector = "consumer_discretionary"
description = "Multi-layer perceptron for consumer discretionary patterns"
