# Production Configuration for Neural Trader Autonomous Platform
# This configuration is optimized for production deployment with:
# - Enhanced security settings
# - Resource-efficient configuration
# - Comprehensive monitoring
# - Production-grade database and caching

[platform]
name = "neural-trader-autonomous"
version = "0.1.0"
environment = "production"
log_level = "info"

[database]
# Production database with SSL and connection pooling
url = "postgres://neural_trader:neural_trader_pass@localhost:5432/neural_trader_db?sslmode=require"
max_connections = 50
min_connections = 10
# Connection timeout in seconds
connection_timeout = 30
# Idle connection timeout in seconds
idle_timeout = 600
# Maximum query execution time in seconds
max_query_time = 60

[redis]
# Production Redis with authentication
url = "redis://:redis_password@localhost:6379/0"
max_connections = 25
default_ttl_seconds = 7200
# Connection timeout in milliseconds
connection_timeout_ms = 5000
# Enable Redis cluster mode for high availability
cluster_mode = false
# Redis connection pool settings
pool_max_idle = 8
pool_timeout_seconds = 30

[neural]
# Production neural network configuration
memory_gb = 4.0
models = ["NHITS", "DeepAR", "TCN", "MLP", "Transformer"]
use_real_models = true
prediction_cache_ttl = 1800
# Model loading timeout in seconds
model_load_timeout = 300
# Maximum concurrent model predictions
max_concurrent_predictions = 50
# Enable model performance monitoring
enable_model_monitoring = true
# Model accuracy threshold for alerts
accuracy_threshold = 0.85

[monitoring]
# Enhanced monitoring for production
metrics_interval_secs = 30
quality_threshold = 0.95
# Enable detailed performance metrics
enable_performance_metrics = true
# Enable memory usage monitoring
enable_memory_monitoring = true
# Enable error rate monitoring
enable_error_monitoring = true
# Alert thresholds
cpu_usage_threshold = 80.0
memory_usage_threshold = 85.0
error_rate_threshold = 0.05
# Metrics export configuration
prometheus_port = 8080
prometheus_path = "/metrics"

[logging]
# Structured logging configuration
level = "info"
format = "json"
# Log file configuration
enable_file_logging = true
log_file_path = "/var/log/neural-trader/app.log"
log_file_max_size_mb = 100
log_file_max_files = 10
# Enable async logging for performance
async_logging = true
# Log sensitive data filtering
filter_sensitive_data = true

[security]
# Production security settings
enable_tls = true
tls_cert_path = "/etc/ssl/certs/neural-trader.crt"
tls_key_path = "/etc/ssl/private/neural-trader.key"
# API rate limiting
rate_limit_requests_per_minute = 1000
rate_limit_burst = 100
# Request timeout in seconds
request_timeout_seconds = 30
# Enable CORS for production APIs
enable_cors = true
allowed_origins = ["https://neural-trader.com", "https://api.neural-trader.com"]
# Enable request validation
enable_request_validation = true
# Maximum request body size in MB
max_request_body_mb = 10

[performance]
# Production performance optimization
# Worker thread configuration
worker_threads = 8
# Async task queue size
async_queue_size = 10000
# Enable TCP keep-alive
tcp_keepalive = true
# TCP keep-alive settings
tcp_keepalive_time = 7200
tcp_keepalive_interval = 75
tcp_keepalive_probes = 9
# Memory optimization
enable_memory_compaction = true
gc_interval_minutes = 30

[alerts]
# Production alerting configuration
enable_email_alerts = true
email_smtp_server = "smtp.gmail.com"
email_smtp_port = 587
email_from = "alerts@neural-trader.com"
email_to = ["admin@neural-trader.com", "devops@neural-trader.com"]
# Slack integration
enable_slack_alerts = true
slack_webhook_url = "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
# PagerDuty integration for critical alerts
enable_pagerduty = true
pagerduty_service_key = "YOUR_PAGERDUTY_SERVICE_KEY"

[backup]
# Production backup configuration
enable_automatic_backup = true
backup_interval_hours = 6
backup_retention_days = 30
backup_storage_path = "/var/backups/neural-trader"
# Enable cloud backup
enable_cloud_backup = true
cloud_backup_provider = "s3"
cloud_backup_bucket = "neural-trader-backups"
cloud_backup_region = "us-east-1"

[circuit_breaker]
# Circuit breaker patterns for resilience
enable_circuit_breaker = true
failure_threshold = 5
recovery_timeout_seconds = 60
half_open_max_calls = 10

[graceful_shutdown]
# Graceful shutdown configuration
shutdown_timeout_seconds = 30
enable_graceful_shutdown = true
# Allow time for in-flight requests to complete
drain_timeout_seconds = 10