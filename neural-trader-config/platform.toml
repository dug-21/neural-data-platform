[platform]
name = "neural-trader-autonomous"
version = "0.1.0"

[database]
url = "postgres://neural_trader:neural_trader_pass@localhost/neural_trader_db"
max_connections = 20
min_connections = 5

[redis]
url = "redis://localhost:6379"
max_connections = 10
default_ttl_seconds = 3600

[neural]
memory_gb = 1.0
models = ["NHITS", "DeepAR", "TCN", "MLP"]
use_real_models = true
prediction_cache_ttl = 300

# Sector model configuration
[neural.sector_configuration]
enabled = true
config_path = "config/sector_models.toml"
sector_model_priority = ["technology", "financial_services", "healthcare"]
max_active_sectors = 10
sector_coordinator_enabled = true
hierarchical_daa_enabled = true
lazy_loading_enabled = true
memory_target_mb_per_symbol = 50
shared_feature_extraction = true
sector_aggregation_interval_ms = 50

# Model selection and weighting
[neural.model_selection]
vendor_models_only = true
disable_fann_legacy = true
auto_weight_adjustment = true
model_weights = { NHITS = 1.2, TCN = 1.1, DeepAR = 1.3, Transformer = 1.4, MLP = 0.8 }

[monitoring]
metrics_interval_secs = 60
quality_threshold = 0.95

[daa]
# Explicit DAA configuration (overrides defaults)
enabled = true
neural_weight = 0.6              # 60% weight for neural predictions
strategy_weight = 0.4            # 40% weight for strategy signals
consensus_threshold = 0.7        # 70% Byzantine consensus threshold
enable_sector_coordinators = true
enable_master_coordinator = true
enable_performance_feedback = true
min_confidence = 0.75
max_risk_per_trade = 0.02
max_positions = 5
enable_adaptation = true

[autonomous_training]
# Reference to detailed autonomous training configuration
enabled = true
config_path = "config/autonomous_training.toml"

[data_discovery]
# Reference to data requirements configuration
enabled = true
config_path = "config/data_requirements.toml"

[redis.channels]
# Dynamic Redis channel configuration
market_data_patterns = ["market:*", "data:*", "symbol:*:*"]
sector_channels = ["sector:*:metrics", "sector:*:aggregation"]
training_channels = ["training:*", "performance:*"]
enable_channel_discovery = true

[training_service]
# Training service integration settings
enabled = true
batch_size = 32
validation_split = 0.2
early_stopping_patience = 5
checkpoint_on_improvement = true
distributed_training = false