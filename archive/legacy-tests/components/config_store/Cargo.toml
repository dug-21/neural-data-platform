[package]
name = "config-store-tests"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "run_config_store_tests"
path = "run_tests.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
md5 = "0.7"
bincode = "1.3"
futures = "0.3"

# Test-specific dependencies
[dev-dependencies]
tokio-test = "0.4"
criterion = "0.4"
proptest = "1.0"
tempfile = "3.0"

[features]
default = []
performance-tests = []
security-tests = []
integration-tests = []