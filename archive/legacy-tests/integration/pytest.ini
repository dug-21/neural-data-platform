[tool:pytest]
# Pytest configuration for Config-Store Integration Tests

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = 
    tests/integration

# Minimum version
minversion = 7.0

# Add options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov-report=term-missing
    --cov-report=html:coverage/html
    --cov-report=xml:coverage/coverage.xml
    --junit-xml=test-results/pytest-results.xml
    --html=test-results/report.html
    --self-contained-html

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    config_store: Config store related tests
    data_ingestion: Data ingestion related tests
    fallback: Fallback mechanism tests
    hot_reload: Hot reload functionality tests
    rate_limiting: Rate limiting tests
    database: Database related tests
    redis: Redis related tests
    security: Security related tests
    performance: Performance tests
    migration: Migration process tests
    validation: Configuration validation tests

# Test timeout (5 minutes default)
timeout = 300

# Async test configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = tests
omit = 
    */venv/*
    */env/*
    */tests/*
    */__pycache__/*
    */migrations/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# HTML coverage report
[coverage:html]
directory = coverage/html
title = Config-Store Integration Test Coverage

# XML coverage report  
[coverage:xml]
output = coverage/coverage.xml