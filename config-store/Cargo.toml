[package]
name = "config-store"
version = "0.1.0"
edition = "2021"
build = "../build.rs"

[[bin]]
name = "config-store-server"
path = "src/bin/config-store-server.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
regex = "1"
once_cell = "1"
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
toml = "0.8"
tempfile = "3.8"
walkdir = "2"
jsonschema = "0.17"

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
tokio-test = "0.4"
testcontainers = "0.15"
mockall = "0.11"
criterion = "0.5"
futures = "0.3"

