[package]
name = "config-store"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
regex = "1"
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"
testcontainers = "0.15"
mockall = "0.11"
criterion = "0.5"
futures = "0.3"

