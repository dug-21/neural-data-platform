# Security Headers Configuration
# Comprehensive security headers to prevent common attacks

# Security: Prevent clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Security: Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Security: Enable XSS protection
add_header X-XSS-Protection "1; mode=block" always;

# Security: Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; child-src 'none'; frame-src 'none'; worker-src 'none'; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;

# Security: Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Security: Strict Transport Security (HSTS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Security: Permission Policy (formerly Feature Policy)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Security: Hide server information
add_header Server "" always;
more_clear_headers Server;

# Security: Cache control for sensitive content
add_header Cache-Control "no-cache, no-store, must-revalidate" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;