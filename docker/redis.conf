# Redis configuration for Neural Trader

# Network and general
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General settings
daemonize no
loglevel notice
logfile ""
databases 16

# Snapshotting (RDB persistence)
# Save after 900 sec (15 min) if at least 1 key changed
save 900 1
# Save after 300 sec (5 min) if at least 10 keys changed
save 300 10
# Save after 60 sec if at least 10000 keys changed
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) persistence
appendonly yes
appendfilename "appendonly.aof"
# fsync every second (good balance between speed and safety)
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Slow log
# Log queries slower than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# Memory management
maxmemory 4gb
# Remove least recently used keys when memory limit is reached
maxmemory-policy allkeys-lru

# Performance tuning
# Higher Hz for more responsive expiry handling
hz 50
dynamic-hz yes

# Client handling
maxclients 10000

# Threading (Redis 6+)
io-threads 4
io-threads-do-reads yes

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""

# Enable keyspace notifications for expired keys
notify-keyspace-events Ex

# Latency monitoring
latency-monitor-threshold 100

# Active rehashing
activerehashing yes

# Client output buffer limits
# Normal clients
client-output-buffer-limit normal 0 0 0
# Replica clients
client-output-buffer-limit replica 256mb 64mb 60
# Pub/sub clients
client-output-buffer-limit pubsub 32mb 8mb 60

# Advanced config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Modules (uncomment if using RedisTimeSeries for tick data)
# loadmodule /usr/lib/redis/modules/redistimeseries.so

# Security (uncomment and set in production)
# requirepass your_strong_password_here
# ACL configuration for fine-grained access control