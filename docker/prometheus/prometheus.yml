global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'neural-trader'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Neural Trader Rust application
  - job_name: 'neural-trader'
    static_configs:
      - targets: ['neural-trader:3030']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Data Ingestion Python service
  - job_name: 'data-ingestion'
    static_configs:
      - targets: ['data-ingestion:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # TimescaleDB
  - job_name: 'timescaledb'
    static_configs:
      - targets: ['timescaledb:9187']
    metrics_path: '/metrics'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
    metrics_path: '/metrics'

  # Node Exporter (if added)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

