apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: neural_trader
    user: neural_trader_readonly
    secureJsonData:
      password: readonly_password_changeme
    jsonData:
      sslmode: 'disable'
      maxOpenConns: 0
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    editable: false