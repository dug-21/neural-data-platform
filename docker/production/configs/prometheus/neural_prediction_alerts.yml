groups:
  - name: neural_prediction_alerts
    interval: 30s
    rules:
      # Neural model performance alerts
      - alert: NeuralPredictionAccuracyLow
        expr: neural_trader_prediction_accuracy < 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Neural prediction accuracy is below threshold"
          description: "Neural prediction accuracy is {{ $value }} which is below the 70% threshold"

      - alert: NeuralPredictionLatencyHigh
        expr: neural_trader_prediction_latency_ms > 500
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Neural prediction latency is high"
          description: "Neural prediction latency is {{ $value }}ms which exceeds 500ms threshold"

      - alert: NeuralModelNotUpdating
        expr: time() - neural_trader_model_last_update_timestamp > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Neural model has not been updated recently"
          description: "Neural model last updated {{ $value }} seconds ago (> 1 hour)"

      # DAA coordinator alerts
      - alert: DAACoordinatorInactive
        expr: rate(neural_trader_daa_decisions_total[5m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "DAA Coordinator is not making decisions"
          description: "No DAA decisions have been made in the last 10 minutes"

      - alert: DAAAgentFailureHigh
        expr: rate(neural_trader_daa_agent_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High DAA agent failure rate"
          description: "DAA agent failure rate is {{ $value }} per second"

      # Trading strategy alerts
      - alert: TradingStrategyError
        expr: rate(neural_trader_strategy_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Trading strategy error rate is high"
          description: "Strategy error rate is {{ $value }} per second"

      - alert: PositionRiskLimitExceeded
        expr: neural_trader_position_risk > 0.02
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Position risk limit exceeded"
          description: "Position risk is {{ $value }} which exceeds 2% limit"

      # Memory and resource alerts
      - alert: NeuralMemoryUsageHigh
        expr: neural_trader_memory_usage_gb > 3.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Neural trader memory usage is high"
          description: "Memory usage is {{ $value }}GB (threshold: 3.5GB)"

      - alert: NeuralProcessorCPUHigh
        expr: rate(neural_trader_cpu_usage_percent[5m]) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Neural trader CPU usage is high"
          description: "CPU usage is {{ $value }}% over the last 5 minutes"