global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'neural-trader-prod'
    
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  # Neural Trader metrics - currently not implemented
  # Uncomment when HTTP server is added to neural-trader
  # - job_name: 'neural-trader'
  #   static_configs:
  #     - targets: ['neural-trader:8080']
  #   metrics_path: '/metrics'
  #   scrape_interval: 10s
    
  # Data Ingestion metrics
  - job_name: 'data-ingestion'
    static_configs:
      - targets: ['data-ingestion:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s
    
  # TimescaleDB metrics - requires postgres_exporter
  # - job_name: 'timescaledb'
  #   static_configs:
  #     - targets: ['timescaledb:9187']
      
  # Redis metrics - requires redis_exporter
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
      
  # Node exporter for system metrics - requires node_exporter
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
      
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']