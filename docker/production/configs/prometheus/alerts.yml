groups:
  - name: neural_trader_alerts
    interval: 30s
    rules:
      # High prediction error rate
      - alert: HighPredictionError
        expr: neural_trader_prediction_error_rate > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High prediction error rate detected"
          description: "Prediction error rate is {{ $value }} (threshold: 0.1)"
          
      # Low trading confidence
      - alert: LowTradingConfidence
        expr: neural_trader_avg_confidence < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Trading confidence below threshold"
          description: "Average trading confidence is {{ $value }} (threshold: 0.5)"
          
      # DAA latency
      - alert: HighDAALatency
        expr: neural_trader_daa_latency_ms > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DAA decision latency exceeds threshold"
          description: "DAA latency is {{ $value }}ms (threshold: 5ms)"
          
      # Database connection issues
      - alert: DatabaseConnectionLost
        expr: up{job="timescaledb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TimescaleDB connection lost"
          description: "Cannot connect to TimescaleDB"
          
      # High memory usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}% (threshold: 90%)"