# Production Docker Compose - ports adjusted to avoid VSCode conflicts

# Production Docker Compose with only named volumes (no bind mounts)
services:
  timescaledb:
    build:
      context: .
      dockerfile: images/timescaledb.dockerfile
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-neural_trader}
      - POSTGRES_DB=${POSTGRES_DB:-neural_trader}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - neural_trader_internal
    ports:
      - "127.0.0.1:5432:5432"  # TimescaleDB  # Only expose to localhost
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - neural_trader_internal
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  neural-trader:
    build:
      context: ../..
      dockerfile: docker/production/images/neural-trader.dockerfile
    restart: unless-stopped
    depends_on:
      - timescaledb
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-neural_trader}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-neural_trader}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_PORT=8080
    volumes:
      - neural_trader_data:/var/lib/neural-trader
      - neural_trader_logs:/var/log/neural-trader
    networks:
      - neural_trader_internal
      - monitoring
    ports:
      - "127.0.0.1:8080:8080"  # Neural Trader API
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "neural-trader", "health"]
      interval: 30s
      timeout: 3s
      retries: 3

  data-ingestion:
    build:
      context: ../..
      dockerfile: docker/production/images/data-ingestion.dockerfile
    restart: unless-stopped
    depends_on:
      - timescaledb
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-neural_trader}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-neural_trader}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # TimescaleDB connection settings
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DATABASE=neural_trader
      - TIMESCALE_USER=${POSTGRES_USER:-neural_trader}
      - TIMESCALE_PASSWORD=${POSTGRES_PASSWORD}
      # Redis connection settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # API Keys from .env
      - YAHOO_API_KEY=${YAHOO_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - ALPHA_ADVANTAGE_API_KEY=${ALPHA_ADVANTAGE_API_KEY}  # Alternative name used in simple setup
      - IEX_CLOUD_API_KEY=${IEX_CLOUD_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - QUANDL_API_KEY=${QUANDL_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - NASDAQ_API_KEY=${NASDAQ_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      # Trading symbols
      - SYMBOLS=${TRADING_SYMBOLS_PRIMARY:-AAPL,MSFT,GOOGL}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-60}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-finnhub}
    ports:
      - "127.0.0.1:8001:8001"  # Data ingestion API
      - "127.0.0.1:9091:9090"  # Data ingestion metrics
    volumes:
      - data_ingestion_logs:/var/log/data-ingestion
    networks:
      - neural_trader_internal
      - monitoring
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G

  prometheus:
    build:
      context: .
      dockerfile: images/prometheus.dockerfile
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"  # Prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  grafana:
    build:
      context: .
      dockerfile: images/grafana.dockerfile
    restart: unless-stopped
    depends_on:
      - prometheus
      - timescaledb
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
      - neural_trader_internal  # For TimescaleDB access
    ports:
      - "127.0.0.1:3000:3000"  # Grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# Optional exporters removed for cleaner production setup
# Add back if you need detailed system/Redis metrics:
# - node-exporter: system metrics (CPU, memory, disk)
# - redis-exporter: Redis performance metrics

networks:
  neural_trader_internal:
    driver: bridge
    internal: true  # No external access
  monitoring:
    driver: bridge

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  neural_trader_data:
    driver: local
  neural_trader_logs:
    driver: local
  data_ingestion_logs:
    driver: local