# Production Docker Compose - ports adjusted to avoid VSCode conflicts
#
# IMPORTANT: This compose file uses pre-built images. Build them first with:
#   ./build.sh
#
# The build.sh script creates these images:
# - neural-trader:prod
# - neural-trader/timescaledb:prod
# - neural-trader/prometheus:prod
# - neural-trader/grafana:prod
# - neural-trader/data-ingestion:prod
#
# Production Docker Compose with only named volumes (no bind mounts)
services:
  timescaledb:
    image: neural-trader/timescaledb:prod
    container_name: neural_trader_timescaledb
    hostname: timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - neural_trader_internal
    ports:
      - "127.0.0.1:5433:5432"  # TimescaleDB  # Only expose to localhost
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: neural_trader_redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - neural_trader_internal
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  neural-trader:
    image: neural-trader:prod
    container_name: neural_trader_app
    hostname: neural-trader
    restart: unless-stopped
    depends_on:
      - timescaledb
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      - MCP_PORT=8080
      - NEURAL_USE_REAL_MODELS=${NEURAL_USE_REAL_MODELS}
      - PROMETHEUS_METRICS_ENABLED=true
      - METRICS_PORT=9092
      # Enable revamped Neural/Autonomous Capabilities
      - ENABLE_SECTOR_MODELS=${ENABLE_SECTOR_MODELS}
      - ENABLE_REALTIME_ADAPTATION=${ENABLE_REALTIME_ADAPTATION}
      - ENABLE_DATA_DISCOVERY=${ENABLE_DATA_DISCOVERY}
      - ENABLE_MULTI_CHANNEL=${ENABLE_MULTI_CHANNEL}
      - NEURAL_USE_REAL_MODELS=${NEURAL_USE_REAL_MODELS}
      # Configuration Paths (using relative paths from WORKDIR)
      - SECTOR_CONFIG_PATH=${SECTOR_CONFIG_PATH}
      - AUTONOMOUS_TRAINING_CONFIG=${AUTONOMOUS_TRAINING_CONFIG}
      - DATA_REQUIREMENTS_CONFIG=${DATA_REQUIREMENTS_CONFIG}
      # Training Env Config
      - ENABLE_AUTONOMOUS_TRAINING=${ENABLE_AUTONOMOUS_TRAINING}
      - TRAINING_SAMPLE_THRESHOLD=${TRAINING_SAMPLE_THRESHOLD}
    volumes:
      # - neural_trader_persistence:/opt/neural-trader
      - neural_trader_logs:/var/log/neural-trader
    networks:
      - neural_trader_internal
      - monitoring
    ports:
      - "127.0.0.1:8080:8080"  # Neural Trader API/MCP
      - "127.0.0.1:9092:9092" # Exposed Health/Metrics
      # Metrics port not exposed - accessible only via Docker network when implemented
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:9092/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  data-ingestion:
    image: neural-trader/data-ingestion:prod
    container_name: neural_trader_data_ingestion
    hostname: data-ingestion
    restart: unless-stopped
    depends_on:
      - timescaledb
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL}
      # TimescaleDB connection settings
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DATABASE=${POSTGRES_DB}
      - TIMESCALE_USER=${POSTGRES_USER}
      - TIMESCALE_PASSWORD=${POSTGRES_PASSWORD}
      # Redis connection settings
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # API Keys from .env
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - ALPACA_WS_ENABLED=${ALPACA_WS_ENABLED:-false}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - ALPHA_ADVANTAGE_API_KEY=${ALPHA_ADVANTAGE_API_KEY}  # Alternative name used in simple setup
      - IEX_CLOUD_API_KEY=${IEX_CLOUD_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - QUANDL_API_KEY=${QUANDL_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - NASDAQ_API_KEY=${NASDAQ_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      # Trading configuration
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-alpaca}
      - USE_SIMPLE_MODE=${USE_SIMPLE_MODE:-false}
      - TRADING_SYMBOLS_PRIMARY=${TRADING_SYMBOLS_PRIMARY:-AAPL,MSFT,GOOGL,AMZN,NVDA,DDOG}
      - SYMBOLS=${TRADING_SYMBOLS_PRIMARY}
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-60s}
    ports:
      - "127.0.0.1:8002:8001"  # Data ingestion API
    volumes:
      - data_ingestion_logs:/var/log/data-ingestion
      # - /Volumes/OneTouch/trader/polygon_data:/data
    networks:
      - neural_trader_internal
      - monitoring
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G

  prometheus:
    image: neural-trader/prometheus:prod
    container_name: neural_trader_prometheus
    hostname: prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring
    ports:
      - "127.0.0.1:9093:9090"  # Prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    environment:
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DATABASE=${POSTGRES_DB}
      - TIMESCALE_USER=${POSTGRES_USER}
      - TIMESCALE_PASSWORD=${POSTGRES_PASSWORD}
 
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  grafana:
    image: neural-trader/grafana:prod
    container_name: neural_trader_grafana
    hostname: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - timescaledb
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
      - neural_trader_internal  # For TimescaleDB access
    ports:
      - "127.0.0.1:3000:3000"  # Grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Postgres Exporter for database metrics
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - neural_trader_internal
      - monitoring
    # No ports exposed - only accessible via Docker network
    depends_on:
      - timescaledb

  # Redis Exporter for cache metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      - neural_trader_internal
      - monitoring
    # No ports exposed - only accessible via Docker network
    depends_on:
      - redis

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - monitoring
    # No ports exposed - only accessible via Docker network

networks:
  neural_trader_internal:
    driver: bridge
    # Removed internal: true to allow external API access for data providers
  monitoring:
    driver: bridge

volumes:
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  neural_trader_persistence:
    driver: local
  neural_trader_logs:
    driver: local
  data_ingestion_logs:
    driver: local