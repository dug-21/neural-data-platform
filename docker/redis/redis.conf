# Redis Configuration for Neural Trader
# Optimized for real-time market data and high-frequency trading

# Network and General
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence Configuration
# Enable both RDB and AOF for data safety
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Threading
io-threads 8
io-threads-do-reads yes

# Client Management
maxclients 10000

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 100

# Event Notification
notify-keyspace-events "Ex"

# Advanced Config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Redis Streams Configuration
# Optimized for real-time market data streaming
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Client Output Buffer Limits
# Normal clients
client-output-buffer-limit normal 0 0 0
# Replica clients
client-output-buffer-limit replica 256mb 64mb 60
# Pub/Sub clients
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency Configuration
hz 10

# Dynamic HZ
dynamic-hz yes

# AOF Rewrite Incremental FSyncs
aof-rewrite-incremental-fsync yes

# RDB Saves
rdb-save-incremental-fsync yes

# Enable Redis Modules (if available in the container)
# loadmodule /usr/lib/redis/modules/redisjson.so
# loadmodule /usr/lib/redis/modules/redistimeseries.so
# loadmodule /usr/lib/redis/modules/redisearch.so
# loadmodule /usr/lib/redis/modules/redisbloom.so

# Disable Dangerous Commands in Production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_e8f9c6d5a2b3"

# Performance Tuning
# Enable Jemalloc Background Thread
jemalloc-bg-thread yes

# Defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 1
active-defrag-cycle-max 25
active-defrag-max-scan-fields 1000

# Threaded I/O
# Use multiple threads for I/O operations
io-threads 8
io-threads-do-reads yes

# TLS/SSL Configuration (commented out, enable if needed)
# tls-port 6380
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-ca-cert-file /tls/ca.crt
# tls-dh-params-file /tls/redis.dh