# Test Prometheus Configuration
# Optimized for testing with faster scrape intervals and shorter retention

global:
  scrape_interval: 5s        # Faster scraping for tests
  evaluation_interval: 5s    # Faster rule evaluation
  scrape_timeout: 3s         # Shorter timeout for tests
  
  external_labels:
    environment: 'test'
    instance: 'neural-trader-test'

# Alertmanager configuration (disabled for testing)
alerting:
  alertmanagers: []

# Load rules once and periodically evaluate them
rule_files:
  - "alerts-test.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus-test'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 10s
    metrics_path: /metrics
    
  # Neural Trader application
  - job_name: 'neural-trader-test'
    static_configs:
      - targets: ['neural-trader-test:8081']
    scrape_interval: 5s
    metrics_path: /metrics
    scrape_timeout: 3s
    honor_labels: true
    
  # Data Ingestion service
  - job_name: 'data-ingestion-test'
    static_configs:
      - targets: ['data-ingestion-test:9090']
    scrape_interval: 5s
    metrics_path: /metrics
    scrape_timeout: 3s
    
  # TimescaleDB metrics (if available)
  - job_name: 'timescaledb-test'
    static_configs:
      - targets: ['timescaledb-test:5432']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 5s
    # This might not work without postgres_exporter, but included for completeness
    
  # Redis metrics (basic)
  - job_name: 'redis-test'
    static_configs:
      - targets: ['redis-test:6379']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 5s
    # This might not work without redis_exporter, but included for completeness
    
  # Mock API Server metrics
  - job_name: 'mock-api-server'
    static_configs:
      - targets: ['mock-api-server:8000']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 3s

# Test-specific metric relabeling
metric_relabel_configs:
  # Add test labels to all metrics
  - target_label: 'test_environment'
    replacement: 'docker_test'
  
  # Add timestamp for test tracking
  - target_label: 'test_run_id'
    replacement: 'test_run_${HOSTNAME}_${TIMESTAMP}'

# Storage configuration optimized for testing
storage:
  tsdb:
    retention.time: 7d        # Short retention for tests
    retention.size: 1GB       # Limited storage for tests
    wal-compression: true     # Enable compression to save space

# Web configuration
web:
  console.templates: /etc/prometheus/consoles
  console.libraries: /etc/prometheus/console_libraries
  enable-lifecycle: true     # Allow configuration reload
  enable-admin-api: true     # Enable admin API for tests