# Test Alert Rules for Neural Trader
# These are test-specific alerts with relaxed thresholds

groups:
  - name: neural-trader-test-alerts
    interval: 10s  # Faster evaluation for tests
    rules:
      # Application Health Alerts
      - alert: NeuralTraderTestDown
        expr: up{job="neural-trader-test"} == 0
        for: 30s  # Shorter duration for tests
        labels:
          severity: critical
          service: neural-trader
          environment: test
        annotations:
          summary: "Neural Trader test instance is down"
          description: "Neural Trader test instance has been down for more than 30 seconds"
          
      - alert: DataIngestionTestDown
        expr: up{job="data-ingestion-test"} == 0
        for: 30s
        labels:
          severity: critical
          service: data-ingestion
          environment: test
        annotations:
          summary: "Data Ingestion test service is down"
          description: "Data Ingestion test service has been down for more than 30 seconds"

      # Performance Alerts (relaxed for testing)
      - alert: HighMemoryUsageTest
        expr: process_resident_memory_bytes / 1024 / 1024 > 1024  # 1GB threshold for tests
        for: 1m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "High memory usage in test environment"
          description: "Process memory usage is above 1GB in test environment"
          
      - alert: HighCPUUsageTest
        expr: rate(process_cpu_seconds_total[1m]) > 0.8  # 80% CPU usage
        for: 1m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "High CPU usage in test environment"
          description: "Process CPU usage is above 80% for 1 minute"

  - name: data-quality-test-alerts
    interval: 15s
    rules:
      # Data Quality Alerts for Testing
      - alert: MockDataGenerationFailure
        expr: increase(data_ingestion_errors_total[1m]) > 5
        for: 1m
        labels:
          severity: warning
          service: data-ingestion
          environment: test
        annotations:
          summary: "Mock data generation failures detected"
          description: "More than 5 data generation errors in the last minute"
          
      - alert: TestDataStaleness
        expr: time() - data_ingestion_last_update_timestamp > 120  # 2 minutes
        for: 30s
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "Test data is stale"
          description: "No new test data received for more than 2 minutes"

  - name: model-performance-test-alerts
    interval: 20s
    rules:
      # Model Performance Alerts for Testing
      - alert: LowPredictionAccuracyTest
        expr: model_accuracy < 0.5  # 50% threshold for tests
        for: 2m
        labels:
          severity: warning
          service: neural-trader
          environment: test
        annotations:
          summary: "Low model prediction accuracy in tests"
          description: "Model accuracy has dropped below 50% for 2 minutes"
          
      - alert: PredictionLatencyHighTest
        expr: prediction_latency_seconds > 5  # 5 seconds threshold for tests
        for: 1m
        labels:
          severity: warning
          service: neural-trader
          environment: test
        annotations:
          summary: "High prediction latency in test environment"
          description: "Prediction latency is above 5 seconds"

  - name: database-test-alerts
    interval: 30s
    rules:
      # Database Alerts for Testing
      - alert: DatabaseConnectionsHighTest
        expr: pg_stat_activity_count > 8  # Lower threshold for tests
        for: 1m
        labels:
          severity: warning
          service: timescaledb
          environment: test
        annotations:
          summary: "High database connections in test environment"
          description: "More than 8 database connections active"
          
      - alert: TestDataVolumeHigh
        expr: pg_database_size_bytes / 1024 / 1024 / 1024 > 0.5  # 500MB for tests
        for: 5m
        labels:
          severity: info
          service: timescaledb
          environment: test
        annotations:
          summary: "Test database size is growing"
          description: "Test database size is above 500MB"

  - name: integration-test-alerts
    interval: 10s
    rules:
      # Integration Test Specific Alerts
      - alert: TestExecutionTimeout
        expr: test_execution_duration_seconds > 300  # 5 minutes timeout
        for: 0s  # Immediate alert
        labels:
          severity: critical
          environment: test
        annotations:
          summary: "Test execution timeout"
          description: "Test execution is taking longer than expected (>5 minutes)"
          
      - alert: TestFailureRate
        expr: rate(test_failures_total[5m]) > 0.1  # 10% failure rate
        for: 1m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "High test failure rate"
          description: "Test failure rate is above 10% in the last 5 minutes"