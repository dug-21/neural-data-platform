# Neural Trader Test Configuration
# This file is used for testing the neural trader in isolated environment

[server]
host = "0.0.0.0"
port = 8081  # Different from production (8080)
workers = 2  # Reduced for testing
debug = true
testing_mode = true

[database]
# URL is provided via environment variable DATABASE_URL
max_connections = 10  # Reduced for testing
min_connections = 2
connect_timeout = 10  # Faster timeout for tests
idle_timeout = 300    # Shorter idle timeout
test_mode = true
auto_migrate = true

[redis]
# URL is provided via environment variable REDIS_URL
pool_size = 5  # Reduced for testing
ttl_seconds = 1800  # Shorter TTL for tests
test_mode = true

[neural]
models = ["NHITS", "TCN", "DeepAR"]  # Reduced set for testing
horizon = 5  # Shorter horizon for faster tests
update_frequency = 30  # More frequent updates for testing
confidence_threshold = 0.6  # Lower threshold for testing
ensemble_method = "simple_average"
test_mode = true
mock_predictions = true

[agent]
decision_threshold = 0.6  # Lower threshold for testing
risk_tolerance = 0.05     # Higher risk tolerance for testing
max_position_size = 1000.0  # Reduced position size
test_mode = true
paper_trading = true

[monitoring]
metrics_enabled = true
metrics_path = "/metrics"
health_check_path = "/health"
log_level = "debug"  # More verbose for testing
test_metrics = true

[trading]
# Test trading configuration
symbols = ["AAPL", "MSFT", "GOOGL"]  # Reduced set for testing
update_interval = 5  # Faster updates for testing
max_concurrent_orders = 2  # Reduced for testing
test_mode = true
paper_trading_only = true
mock_broker = true

[features]
# Feature engineering settings for testing
enabled_features = [
    "sma_5", "sma_10", "ema_5", 
    "rsi_14", "volume_sma_10",
    "price_momentum", "volatility"
]
update_interval = 10  # Faster feature updates for testing
test_mode = true
mock_calculations = false  # Keep real calculations for validation

[data_sources]
# Test data source configuration
primary_provider = "mock"
fallback_providers = ["test"]
test_mode = true
mock_data_enabled = true
real_time_disabled = true  # Disable real-time data in tests

[logging]
level = "debug"
format = "json"
file = "/var/log/neural-trader/test.log"
console = true
test_mode = true

[performance]
# Performance monitoring for tests
enable_profiling = true
profile_output = "/var/log/neural-trader/profile.json"
benchmark_mode = true
collect_metrics = true

[testing]
# Test-specific configurations
test_data_path = "/test-fixtures"
mock_providers = true
accelerated_time = true  # Speed up time-based operations
disable_external_apis = true
test_database_cleanup = true
parallel_test_execution = false