# Tarpaulin Configuration for Data-Staging Service
# Ensures >90% code coverage with comprehensive reporting

[config]
# Coverage target - fail if below 90%
fail-under = 90.0

# Output formats
out = ["Html", "Json", "Stdout"]
output-dir = "target/tarpaulin"

# Include all relevant code
include-tests = false
run-types = ["Tests", "Doctests"]

# Exclude generated code and external dependencies
exclude-files = [
    "target/*",
    "*/generated.rs",
    "*/proto/*",
    "*/vendor/*",
    "tests/mod.rs",  # Test infrastructure
]

# Follow links for comprehensive coverage
follow-exec = true

# Count hits for accurate measurement
count-hits = true

# Include all source files in workspace
all-features = true
workspace = true

# Verbose output for debugging
verbose = true

# Timeout settings
timeout = 300  # 5 minutes for full test suite

# Engine configuration
engine = "llvm"  # Use LLVM engine for best coverage

[report]
# Report configuration
title = "Data-Staging Service Coverage Report"
output-path = "target/tarpaulin"

# HTML report customization
html-title = "Neural Trader V2 Phase 4: Data-Staging Service Test Coverage"
html-template = "coverage-template.html"

[thresholds]
# Coverage thresholds that must be met
line = 90.0      # Line coverage ≥90%
function = 85.0  # Function coverage ≥85%  
branch = 80.0    # Branch coverage ≥80%

[ignore]
# Patterns to ignore in coverage calculation
patterns = [
    "tests/*",           # Test files themselves
    "*/tests/*",         # Test modules
    "benches/*",         # Benchmark files
    "examples/*",        # Example code
    "*generated*",       # Generated protobuf code
    "*/build.rs",        # Build scripts
]

# Specific lines to ignore (for auto-generated code)
line-patterns = [
    "#\\[derive\\(",     # Derive macros
    "//.*LCOV_EXCL",     # Manual exclusions
]

[testing]
# Test execution configuration
test-timeout = 120  # 2 minutes per test
test-threads = 4    # Parallel test execution

# Environment variables for tests
env = [
    "RUST_LOG=debug",
    "DATA_STAGING_TEST_MODE=true",
    "TARPAULIN_VERBOSE=1"
]

# Additional test arguments
args = [
    "--test-threads=4",
    "--quiet"
]

[coverage]
# Coverage calculation settings
exclude-unreachable = true  # Exclude unreachable code
force-clean = true         # Clean before running
locked = true              # Use Cargo.lock

# Include doc tests in coverage
include-doc-tests = true

# Measure coverage of integration tests
integration-tests = true

[output]
# Output format configuration
json-summary = true     # Generate JSON summary
json-detailed = true    # Include detailed JSON data
xml-format = "cobertura"  # XML format for CI integration

# Custom output files
html-path = "target/tarpaulin/coverage.html"
json-path = "target/tarpaulin/coverage.json" 
xml-path = "target/tarpaulin/coverage.xml"