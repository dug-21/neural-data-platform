services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=neural_trader
      - TIMESCALEDB_TELEMETRY=off
    ports:
      - "5432:5432"
    volumes:
      - neural_trader_timescale_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init-scripts/01-init-db-simple.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    networks:
      - neural_trader_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - neural_trader_redis_data:/data
    networks:
      - neural_trader_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Development tools only - main app runs locally
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - neural_trader_dev

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_EMAIL_DELIVERABILITY=False
    ports:
      - "8082:80"
    depends_on:
      - timescaledb
    networks:
      - neural_trader_dev

volumes:
  neural_trader_timescale_data:
    external: true
  neural_trader_redis_data:
    external: true

networks:
  neural_trader_dev:
    driver: bridge
