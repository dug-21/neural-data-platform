# =============================================================================
# PostgreSQL/TimescaleDB Configuration for Raspberry Pi 5
# =============================================================================
# Feature: DP-006 - Silver Layer Implementation
#
# Optimized for:
#   - Raspberry Pi 5 (4GB RAM, but competing with other services)
#   - TimescaleDB hypertables with 1-day chunks
#   - Dashboard query patterns (recent data, aggregates)
#   - Batch ETL writes (hourly)
#
# Memory budget: 256MB container limit
# =============================================================================

# -----------------------------------------------------------------------------
# Connection Settings
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 20            # Low - Pi doesn't need many connections

# -----------------------------------------------------------------------------
# Memory Settings (Tuned for Pi 5 with 256MB container limit)
# -----------------------------------------------------------------------------
shared_buffers = 64MB           # 25% of container memory
work_mem = 16MB                 # Per-operation memory for sorts/hashes
maintenance_work_mem = 32MB     # For VACUUM, CREATE INDEX
effective_cache_size = 128MB    # Hint for query planner (OS cache)

# TimescaleDB specific
timescaledb.max_background_workers = 2

# -----------------------------------------------------------------------------
# Write-Ahead Log (WAL)
# -----------------------------------------------------------------------------
wal_level = replica             # Minimum for point-in-time recovery
max_wal_size = 256MB            # Limit WAL growth on SD card
min_wal_size = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# Synchronous writes - balance durability vs SD card wear
synchronous_commit = off        # Faster writes, small data loss risk on crash
wal_writer_delay = 1000ms       # Batch WAL writes

# -----------------------------------------------------------------------------
# Query Planner
# -----------------------------------------------------------------------------
random_page_cost = 1.1          # SSD/SD card - sequential and random similar
effective_io_concurrency = 200  # Modern storage can handle parallel IO
default_statistics_target = 100 # Default statistics granularity

# -----------------------------------------------------------------------------
# Background Workers
# -----------------------------------------------------------------------------
max_worker_processes = 4        # Total background workers (including TimescaleDB)
max_parallel_workers = 2        # For parallel queries
max_parallel_workers_per_gather = 1  # Limit parallelism per query

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off         # Let Docker handle logs
log_min_duration_statement = 1000  # Log queries over 1 second
log_line_prefix = '%t [%p]: '
log_timezone = 'UTC'

# -----------------------------------------------------------------------------
# Locale and Formatting
# -----------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# -----------------------------------------------------------------------------
# TimescaleDB Settings
# -----------------------------------------------------------------------------
# Enable TimescaleDB (loaded via shared_preload_libraries in container)
timescaledb.telemetry_level = 'off'  # Disable telemetry for privacy

# Compression settings
timescaledb.compress_segmentby_default_function = 'first'
timescaledb.compress_orderby_default_function = 'first'

# Background job settings
timescaledb.max_background_workers = 2

# -----------------------------------------------------------------------------
# Autovacuum (Important for TimescaleDB hypertables)
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 1       # Single worker for Pi
autovacuum_naptime = 60s         # Check every minute
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# -----------------------------------------------------------------------------
# Statement Behavior
# -----------------------------------------------------------------------------
statement_timeout = 60000        # 60 second timeout for queries
lock_timeout = 10000             # 10 second lock timeout
idle_in_transaction_session_timeout = 300000  # 5 minute idle transaction timeout
