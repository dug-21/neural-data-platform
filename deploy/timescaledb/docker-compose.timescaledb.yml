# =============================================================================
# Neural Data Platform - TimescaleDB Docker Compose
# =============================================================================
# Feature: DP-006 - Silver Layer Implementation
#
# This file adds TimescaleDB to the NDP stack.
# Use with: docker compose -f docker-compose.yml -f docker-compose.timescaledb.yml up
#
# Resource constraints optimized for Raspberry Pi 5:
#   - Memory limit: 256MB (can increase to 512MB if available)
#   - Shared buffers: 64MB
#   - Work mem: 16MB
# =============================================================================

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ndp-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-ndp}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?TIMESCALE_PASSWORD required}
      POSTGRES_DB: ${TIMESCALE_DB:-neural_data}
      # PostgreSQL tuning for Pi
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # Data persistence
      - timescale-data:/var/lib/postgresql/data
      # Init scripts (mounted read-only)
      - ./init:/docker-entrypoint-initdb.d:ro
      # Custom configuration
      - ./conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-ndp} -d ${TIMESCALE_DB:-neural_data}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ndp-network
    labels:
      - "com.ndp.component=silver-layer"
      - "com.ndp.feature=dp-006"

volumes:
  timescale-data:
    driver: local
    name: ndp-timescale-data

networks:
  ndp-network:
    external: true
    name: ndp-network
