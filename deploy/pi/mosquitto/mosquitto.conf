# Mosquitto MQTT Broker Configuration for Pi Deployment
# AirGradient sensors publish to: airgradient/readings/{device_id}

# Listeners
listener 1883
protocol mqtt

# WebSocket support (optional - for browser debugging)
listener 9001
protocol websockets

# Authentication
# For home network, anonymous is fine
# For production, set allow_anonymous false and configure password_file
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Logging - minimal for Pi SD card longevity
log_dest stdout
log_type error
log_type warning
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection settings
max_connections 50
max_queued_messages 1000
max_inflight_messages 20

# Message settings
message_size_limit 0
max_qos 2
retain_available true

# Performance tuning
sys_interval 60
