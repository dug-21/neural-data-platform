# Production Docker Compose for Raspberry Pi 5
# Neural Data Platform - Air Quality Monitoring Stack
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services

services:
  # MQTT Broker - receives data from AirGradient sensors
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"     # MQTT
      - "9001:9001"     # WebSocket (optional)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # etcd - Configuration Store
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd
    ports:
      - "2379:2379"
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=neural-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
      # Memory optimization for Pi
      - ETCD_QUOTA_BACKEND_BYTES=536870912
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Air Quality App - Multi-Stream Ingestion (MQTT + HTTP Polling)
  air-quality-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: neural-data-platform/air-quality-app:latest
    container_name: air-quality-app
    ports:
      - "8080:8080"     # HTTP API
    volumes:
      - air-quality-data:/data
    environment:
      # Core Settings
      - RUST_LOG=info
      - DATA_DIR=/data
      - ETCD_ENDPOINT=http://etcd:2379
      # MQTT Source (indoor air quality)
      - MQTT_BROKER_URL=mosquitto
      - MQTT_PORT=1883
      # HTTP Polling Source (outdoor weather/air quality - AIR-005)
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - WEATHER_LATITUDE=${WEATHER_LATITUDE:-29.95838}
      - WEATHER_LONGITUDE=${WEATHER_LONGITUDE:--81.30878}
    depends_on:
      mosquitto:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # TimescaleDB - Silver Layer + Data Dictionary (DP-002)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: pi5-timescaledb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ndp_secure_password}
      - POSTGRES_DB=ndp
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ndp"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # NDP MCP Server - Bronze Layer MCP Interface (DP-005)
  # Provides Model Context Protocol access to Parquet data
  # Memory target: <50MB runtime (64MB limit with buffer)
  ndp-mcp-server:
    build:
      context: ../..
      dockerfile: core/ndp-mcp-server/Dockerfile
    image: neural-data-platform/ndp-mcp-server:latest
    container_name: ndp-mcp-server
    ports:
      - "9100:9100"     # MCP HTTP endpoint
    volumes:
      - air-quality-data:/data:ro    # Read-only access to Bronze Parquet files
    environment:
      - RUST_LOG=info
      - NDP_RAW_PATH=/data/raw
      - NDP_ETCD_ENDPOINTS=http://etcd:2379
      - NDP_MCP_LISTEN=0.0.0.0:9100
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 64M

  # Grafana - Data Visualization & Dashboards (DP-001, DP-002)
  # Uses DuckDB plugin for Bronze layer Parquet queries
  # Uses PostgreSQL datasource for TimescaleDB Silver layer
  grafana:
    image: grafana/grafana:latest-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"     # Grafana web UI
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - air-quality-data:/data:ro             # Parquet files for DuckDB views
    environment:
      # Security
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Performance
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      # Server
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_LOG_LEVEL=info
      # Plugins - Install DuckDB datasource from GitHub (v0.2.1 for glibc 2.35 compat)
      - GF_INSTALL_PLUGINS=https://github.com/motherduckdb/grafana-duckdb-datasource/releases/download/v0.2.1/motherduck-duckdb-datasource-0.2.1.zip;motherduck-duckdb-datasource
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  # Silver ETL - Bronze to Silver Layer Transformation (DP-006)
  # Reads Parquet files from Bronze, writes to TimescaleDB Silver layer
  # Memory target: <200MB runtime (256MB limit with buffer)
  silver-etl:
    build:
      context: ../..
      dockerfile: apps/silver-etl/Dockerfile
    image: neural-data-platform/silver-etl:latest
    container_name: silver-etl
    volumes:
      - air-quality-data:/data:ro    # Read-only access to Bronze Parquet files
    environment:
      - RUST_LOG=info
      - ETCD_ENDPOINT=http://etcd:2379
      - BRONZE_DATA_DIR=/data/raw
      - TIMESCALE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-ndp_secure_password}@timescaledb:5432/ndp
    depends_on:
      timescaledb:
        condition: service_healthy
      etcd:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - silver

volumes:
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
  etcd-data:
    driver: local
  air-quality-data:
    driver: local
  timescaledb-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: neural-network
    driver: bridge
