# Production Docker Compose for Raspberry Pi 5
# Neural Data Platform - Air Quality Monitoring Stack
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services

services:
  # MQTT Broker - receives data from AirGradient sensors
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"     # MQTT
      - "9001:9001"     # WebSocket (optional)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # etcd - Configuration Store
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd
    ports:
      - "2379:2379"
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=neural-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
      # Memory optimization for Pi
      - ETCD_QUOTA_BACKEND_BYTES=536870912
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Air Quality App - Multi-Stream Ingestion (MQTT + HTTP Polling)
  air-quality-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: neural-data-platform/air-quality-app:latest
    container_name: air-quality-app
    ports:
      - "8080:8080"     # HTTP API
    volumes:
      - air-quality-data:/data
    environment:
      # Core Settings
      - RUST_LOG=info
      - DATA_DIR=/data
      - ETCD_ENDPOINT=http://etcd:2379
      # MQTT Source (indoor air quality)
      - MQTT_BROKER_URL=mosquitto
      - MQTT_PORT=1883
      # HTTP Polling Source (outdoor weather/air quality - AIR-005)
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - WEATHER_LATITUDE=${WEATHER_LATITUDE:-29.95838}
      - WEATHER_LONGITUDE=${WEATHER_LONGITUDE:--81.30878}
    depends_on:
      mosquitto:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # DuckDB - Analytical Query Engine (DP-001 Silver Layer)
  # Grafana DuckDB plugin connects directly to neural_platform.db
  duckdb:
    image: datacatering/duckdb:v1.1.3
    container_name: duckdb
    volumes:
      - air-quality-data:/data:ro           # Read-only access to Bronze layer
      - duckdb-data:/var/duckdb             # Persistent DuckDB database files
      - ../../config/duckdb:/config/duckdb:ro  # SQL view definitions
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mkdir -p /var/duckdb
        echo 'Initializing DuckDB Silver layer...'

        # Initialize views (retry until successful or max attempts)
        MAX_ATTEMPTS=10
        ATTEMPT=0
        until /duckdb /var/duckdb/neural_platform.db < /config/duckdb/init.sql 2>&1; do
          ATTEMPT=$((ATTEMPT + 1))
          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo 'Init failed after max attempts, continuing anyway...'
            break
          fi
          echo "Init attempt $ATTEMPT failed, retrying in 30s..."
          sleep 30
        done

        # Make DB files world-writable for Grafana DuckDB plugin (needs write for locking)
        chmod 666 /var/duckdb/*.db 2>/dev/null || true
        echo 'DuckDB initialized. Keeping container alive...'

        while true; do
          chmod 666 /var/duckdb/*.db 2>/dev/null || true
          sleep 300
        done
    healthcheck:
      test: ["CMD", "test", "-f", "/var/duckdb/neural_platform.db"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      air-quality-app:
        condition: service_healthy

  # Grafana - Data Visualization & Dashboards (DP-001)
  # Uses DuckDB plugin v0.2.1 (glibc 2.35 compatible) connecting directly to DuckDB
  grafana:
    image: grafana/grafana:latest-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"     # Grafana web UI
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - duckdb-data:/duckdb                   # DuckDB database file
      - air-quality-data:/data:ro             # Parquet files for DuckDB views
    environment:
      # Security
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Performance
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      # Server
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_LOG_LEVEL=info
      # Plugins - Install DuckDB datasource from GitHub (v0.2.1 for glibc 2.35 compat)
      - GF_INSTALL_PLUGINS=https://github.com/motherduckdb/grafana-duckdb-datasource/releases/download/v0.2.1/motherduck-duckdb-datasource-0.2.1.zip;motherduck-duckdb-datasource
    restart: unless-stopped
    depends_on:
      duckdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
  etcd-data:
    driver: local
  air-quality-data:
    driver: local
  duckdb-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: neural-network
    driver: bridge
