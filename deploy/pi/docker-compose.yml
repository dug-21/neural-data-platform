# Production Docker Compose for Raspberry Pi 5
# Neural Data Platform - Air Quality Monitoring Stack
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services

services:
  # MQTT Broker - receives data from AirGradient sensors
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"     # MQTT
      - "9001:9001"     # WebSocket (optional)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # etcd - Configuration Store
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd
    ports:
      - "2379:2379"
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=neural-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
      # Memory optimization for Pi
      - ETCD_QUOTA_BACKEND_BYTES=536870912
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Air Quality App - MQTT to Parquet ingestion with multi-stream support
  air-quality-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: neural-data-platform/air-quality-app:latest
    container_name: air-quality-app
    ports:
      - "8080:8080"     # HTTP API
      - "8081:8081"     # Webhook handler for dynamic stream management
      - "9090:9090"     # Metrics
    volumes:
      - air-quality-data:/app/data
      - air-quality-streams:/app/data/streams  # Stream-specific data storage
    environment:
      - RUST_LOG=info
      - STORAGE_PATH=/app/data
      - ETCD_ENDPOINT=http://etcd:2379
      - MQTT_BROKER_URL=mosquitto
      - MQTT_PORT=1883
      # Multi-stream configuration
      - ENABLE_MULTI_STREAM=true
      - MAX_CONCURRENT_STREAMS=8
      - WEBHOOK_ENABLED=true
      - WEBHOOK_PORT=8081
      - STREAM_CONFIG_PREFIX=/air-quality/streams
    depends_on:
      mosquitto:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
  etcd-data:
    driver: local
  air-quality-data:
    driver: local
  air-quality-streams:
    driver: local

networks:
  default:
    name: neural-network
    driver: bridge
