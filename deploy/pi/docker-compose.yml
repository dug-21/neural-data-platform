# Production Docker Compose for Raspberry Pi 5
# Neural Data Platform - Air Quality Monitoring Stack
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services

services:
  # MQTT Broker - receives data from AirGradient sensors
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"     # MQTT
      - "9001:9001"     # WebSocket (optional)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # etcd - Configuration Store
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: etcd
    ports:
      - "2379:2379"
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=neural-cluster
      - ETCD_INITIAL_CLUSTER_STATE=new
      # Memory optimization for Pi
      - ETCD_QUOTA_BACKEND_BYTES=536870912
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Air Quality App - Multi-Stream Ingestion (MQTT + HTTP Polling)
  air-quality-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: neural-data-platform/air-quality-app:latest
    container_name: air-quality-app
    ports:
      - "8080:8080"     # HTTP API
    volumes:
      - air-quality-data:/data
    environment:
      # Core Settings
      - RUST_LOG=info
      - DATA_DIR=/data
      - ETCD_ENDPOINT=http://etcd:2379
      # MQTT Source (indoor air quality)
      - MQTT_BROKER_URL=mosquitto
      - MQTT_PORT=1883
      # HTTP Polling Source (outdoor weather/air quality - AIR-005)
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - WEATHER_LATITUDE=${WEATHER_LATITUDE:-29.95838}
      - WEATHER_LONGITUDE=${WEATHER_LONGITUDE:--81.30878}
    depends_on:
      mosquitto:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # DuckDB - Analytical Query Engine (DP-001 Silver Layer)
  # Grafana connects directly via DuckDB plugin (no SQLite export needed)
  duckdb:
    image: datacatering/duckdb:v1.1.3
    container_name: duckdb
    volumes:
      - air-quality-data:/data:ro           # Read-only access to Bronze layer
      - duckdb-data:/var/duckdb             # Persistent DuckDB database files
      - ../../config/duckdb:/config/duckdb:ro  # SQL view definitions
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "
      mkdir -p /var/duckdb &&
      echo 'Initializing DuckDB Silver layer views...' &&
      /duckdb /var/duckdb/neural_platform.db < /config/duckdb/init.sql 2>&1 || echo 'Init warning (may be OK if no data yet)' &&
      echo 'DuckDB initialized. Keeping container alive for Grafana queries...' &&
      tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "test", "-f", "/var/duckdb/neural_platform.db"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      air-quality-app:
        condition: service_healthy

  # Grafana - Data Visualization & Dashboards (DP-001)
  # Uses Ubuntu image for DuckDB plugin compatibility (glibc required)
  grafana:
    image: grafana/grafana-oss:11.4.0-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"     # Grafana web UI
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - duckdb-data:/data/duckdb:ro           # Read-only access to DuckDB database
      - air-quality-data:/data:ro             # Read-only access to Bronze Parquet files
    environment:
      # Security
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Performance
      - GF_DATABASE_TYPE=sqlite3
      - GF_DATABASE_PATH=/var/lib/grafana/grafana.db
      # Server
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_LOG_LEVEL=info
      # Plugins - Allow unsigned DuckDB plugin
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=motherduck-duckdb-datasource
      - GF_INSTALL_PLUGINS=https://github.com/motherduckdb/grafana-duckdb-datasource/releases/download/v1.0.14/motherduck-duckdb-datasource-1.0.14.zip;motherduck-duckdb-datasource
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      duckdb:
        condition: service_healthy

volumes:
  mosquitto-data:
    driver: local
  mosquitto-logs:
    driver: local
  etcd-data:
    driver: local
  air-quality-data:
    driver: local
  duckdb-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: neural-network
    driver: bridge
