# Neural Data Platform - Pattern Index
#
# This index maps pattern queries to both memory keys and documentation files.
# Use with get-pattern skill to find established project patterns.
#
# Memory Namespace: ndp-patterns
#
# Format:
#   category:
#     pattern-name:
#       key: "memory key in ndp-patterns namespace"
#       files: ["list of relevant files"]
#       summary: "brief description"
#       queries: ["trigger phrases that should match this pattern"]

