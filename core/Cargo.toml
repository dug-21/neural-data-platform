[package]
name = "platform-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enable real TimescaleDB output (dp-012)
timescale = ["tokio-postgres", "bb8", "bb8-postgres"]

[dependencies]
# NDP types (single source of truth)
ndp-types = { workspace = true }

chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures = "0.3"
rumqttc = { workspace = true }
reqwest = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
tokio-stream = "0.1"
tokio-util = "0.7"
rand = "0.8"
regex = "1.10"

# etcd configuration store (dp-005)
etcd-client = "0.14"

# CSV async parsing (dp-013)
csv-async = { version = "1.3", features = ["tokio", "serde"] }

# UUID generation (DP-012 Phase 3)
uuid = { version = "1.6", features = ["v4"] }

# TimescaleDB connection pool (dp-012, optional)
tokio-postgres = { version = "0.7", optional = true, features = ["with-chrono-0_4"] }
bb8 = { version = "0.8", optional = true }
bb8-postgres = { version = "0.8", optional = true }

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
wiremock = "0.6"
uuid = { version = "1.6", features = ["v4"] }
tempfile = "3.8"
serde_yaml = "0.9"
