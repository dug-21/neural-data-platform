# Error Handling Standards for Neural Trading System
# Production-grade error management across all interfaces

version: 1.0.0
last_updated: 2024-01-19

error_codes:
  # System-wide error code ranges
  ranges:
    - range: "1000-1999"
      category: "Client Errors"
      description: "Invalid requests, authentication, authorization"
    
    - range: "2000-2999"
      category: "Domain Registry Errors"
      description: "Service discovery, configuration, schema issues"
    
    - range: "3000-3999"
      category: "Data Ingestion Errors"
      description: "Data validation, parsing, quality issues"
    
    - range: "4000-4999"
      category: "Event Bus Errors"
      description: "Messaging, routing, delivery issues"
    
    - range: "5000-5999"
      category: "ML Ops Errors"
      description: "Feature extraction, training, model issues"
    
    - range: "6000-6999"
      category: "Model Execution Errors"
      description: "Inference, prediction, serving issues"
    
    - range: "7000-7999"
      category: "Action Layer Errors"
      description: "Trading, risk, execution issues"
    
    - range: "8000-8999"
      category: "Infrastructure Errors"
      description: "System, network, storage issues"
    
    - range: "9000-9999"
      category: "Critical System Errors"
      description: "Emergency conditions requiring immediate action"

  # Specific error definitions
  definitions:
    # Client Errors (1000-1999)
    - code: 1001
      name: "INVALID_REQUEST"
      message: "Request validation failed"
      http_status: 400
      retryable: false
      
    - code: 1002
      name: "AUTHENTICATION_FAILED"
      message: "Authentication credentials invalid"
      http_status: 401
      retryable: false
      
    - code: 1003
      name: "AUTHORIZATION_DENIED"
      message: "Insufficient permissions"
      http_status: 403
      retryable: false
      
    - code: 1004
      name: "RATE_LIMIT_EXCEEDED"
      message: "Too many requests"
      http_status: 429
      retryable: true
      retry_after: 60
    
    # Data Ingestion Errors (3000-3999)
    - code: 3001
      name: "SCHEMA_VALIDATION_FAILED"
      message: "Data does not match expected schema"
      http_status: 422
      retryable: false
      
    - code: 3002
      name: "DATA_QUALITY_THRESHOLD_BREACH"
      message: "Data quality below acceptable threshold"
      http_status: 422
      retryable: true
      
    - code: 3003
      name: "BACKPRESSURE_ACTIVE"
      message: "System under load, reduce ingestion rate"
      http_status: 503
      retryable: true
      retry_after: 30
    
    # ML Ops Errors (5000-5999)
    - code: 5001
      name: "FEATURE_EXTRACTION_FAILED"
      message: "Unable to extract required features"
      http_status: 500
      retryable: true
      
    - code: 5002
      name: "DATA_DRIFT_DETECTED"
      message: "Significant drift detected in input data"
      http_status: 422
      retryable: false
      
    - code: 5003
      name: "MODEL_NOT_READY"
      message: "Model is still loading or training"
      http_status: 503
      retryable: true
      retry_after: 60
    
    # Model Execution Errors (6000-6999)
    - code: 6001
      name: "INFERENCE_TIMEOUT"
      message: "Model inference exceeded timeout"
      http_status: 504
      retryable: true
      
    - code: 6002
      name: "MODEL_VERSION_NOT_FOUND"
      message: "Requested model version does not exist"
      http_status: 404
      retryable: false
      
    - code: 6003
      name: "PREDICTION_CONFIDENCE_LOW"
      message: "Model confidence below threshold"
      http_status: 422
      retryable: false
    
    # Action Layer Errors (7000-7999)
    - code: 7001
      name: "RISK_LIMIT_BREACH"
      message: "Trade would exceed risk limits"
      http_status: 422
      retryable: false
      
    - code: 7002
      name: "INSUFFICIENT_LIQUIDITY"
      message: "Market liquidity insufficient for order"
      http_status: 422
      retryable: true
      
    - code: 7003
      name: "EXECUTION_REJECTED"
      message: "Order rejected by broker/exchange"
      http_status: 422
      retryable: false
    
    # Critical System Errors (9000-9999)
    - code: 9001
      name: "EMERGENCY_SHUTDOWN"
      message: "System emergency shutdown triggered"
      http_status: 503
      retryable: false
      
    - code: 9002
      name: "DATA_CORRUPTION_DETECTED"
      message: "Critical data corruption detected"
      http_status: 500
      retryable: false
      
    - code: 9003
      name: "CIRCUIT_BREAKER_OPEN"
      message: "Circuit breaker activated"
      http_status: 503
      retryable: true
      retry_after: 300

error_response_format:
  standard:
    type: object
    required: [error, request_id, timestamp]
    properties:
      error:
        type: object
        required: [code, message]
        properties:
          code:
            type: string
            description: "Error code"
          message:
            type: string
            description: "Human-readable error message"
          details:
            type: object
            description: "Additional error details"
          field_errors:
            type: array
            description: "Field-level validation errors"
            items:
              type: object
              properties:
                field:
                  type: string
                error:
                  type: string
                value:
                  type: any
      request_id:
        type: string
        description: "Request tracking ID"
      timestamp:
        type: string
        format: date-time
      retry_after:
        type: integer
        description: "Seconds to wait before retry"
      help_url:
        type: string
        description: "URL for error documentation"

retry_policies:
  default:
    max_attempts: 3
    initial_delay_ms: 1000
    backoff_multiplier: 2
    max_delay_ms: 30000
    jitter: true
    
  aggressive:
    max_attempts: 5
    initial_delay_ms: 500
    backoff_multiplier: 1.5
    max_delay_ms: 15000
    jitter: true
    
  conservative:
    max_attempts: 2
    initial_delay_ms: 5000
    backoff_multiplier: 3
    max_delay_ms: 60000
    jitter: false

circuit_breaker_config:
  default:
    failure_threshold: 5
    success_threshold: 2
    timeout_seconds: 60
    half_open_max_requests: 3
    
  sensitive:
    failure_threshold: 3
    success_threshold: 5
    timeout_seconds: 120
    half_open_max_requests: 1

error_aggregation:
  windows:
    - name: "1_minute"
      duration_seconds: 60
      
    - name: "5_minutes"
      duration_seconds: 300
      
    - name: "1_hour"
      duration_seconds: 3600
  
  thresholds:
    - metric: "error_rate"
      window: "1_minute"
      threshold: 0.05
      action: "alert"
      
    - metric: "error_rate"
      window: "1_minute"
      threshold: 0.10
      action: "circuit_break"
      
    - metric: "specific_error_count"
      error_code: 7001
      window: "5_minutes"
      threshold: 10
      action: "emergency_stop"

logging_standards:
  levels:
    - level: "DEBUG"
      description: "Detailed diagnostic information"
      
    - level: "INFO"
      description: "General informational messages"
      
    - level: "WARN"
      description: "Warning messages for potentially harmful situations"
      
    - level: "ERROR"
      description: "Error events that might still allow continued operation"
      
    - level: "FATAL"
      description: "Critical events causing termination"
  
  required_fields:
    - field: "timestamp"
      type: "ISO8601"
      
    - field: "level"
      type: "string"
      
    - field: "service"
      type: "string"
      
    - field: "request_id"
      type: "string"
      
    - field: "message"
      type: "string"
      
    - field: "error_code"
      type: "string"
      required_for: ["ERROR", "FATAL"]
  
  structured_format:
    type: "JSON"
    example: |
      {
        "timestamp": "2024-01-19T10:30:45.123Z",
        "level": "ERROR",
        "service": "model-execution",
        "request_id": "req-123456",
        "message": "Inference timeout",
        "error_code": "6001",
        "context": {
          "model_id": "model-abc",
          "latency_ms": 5234,
          "timeout_ms": 5000
        },
        "stack_trace": "..."
      }

alerting_rules:
  - name: "High Error Rate"
    condition: "error_rate > 0.05"
    duration: "5m"
    severity: "warning"
    channels: ["slack", "email"]
    
  - name: "Critical Error Spike"
    condition: "error_rate > 0.10"
    duration: "1m"
    severity: "critical"
    channels: ["slack", "pagerduty", "email"]
    
  - name: "Risk Limit Breaches"
    condition: "count(error_code=7001) > 5"
    duration: "5m"
    severity: "critical"
    channels: ["slack", "pagerduty", "email", "sms"]
    
  - name: "Model Degradation"
    condition: "count(error_code=6003) > 20"
    duration: "10m"
    severity: "warning"
    channels: ["slack", "email"]

recovery_procedures:
  - error_code: 9001
    name: "Emergency Shutdown Recovery"
    steps:
      - "Cancel all pending orders"
      - "Close all open positions"
      - "Preserve system state"
      - "Notify operations team"
      - "Begin diagnostic procedures"
    
  - error_code: 5002
    name: "Data Drift Recovery"
    steps:
      - "Switch to conservative model"
      - "Increase monitoring thresholds"
      - "Trigger model retraining"
      - "Notify ML team"
      - "Collect drift samples"
    
  - error_code: 7001
    name: "Risk Limit Breach Recovery"
    steps:
      - "Block new trades"
      - "Reduce position sizes"
      - "Activate hedging strategies"
      - "Notify risk team"
      - "Generate compliance report"