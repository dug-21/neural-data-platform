[package]
name = "config-client"
version = "0.1.0"
edition = "2021"
description = "Thin etcd wrapper for type-safe configuration"

[dependencies]
etcd-client = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
