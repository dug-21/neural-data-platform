[package]
name = "mcp-trading-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# MCP SDK
mcp-sdk = "0.1.0"
# Async runtime
tokio = { version = "1.39", features = ["full"] }
# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Database
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
# Redis
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }
# HTTP client for neural predictions
reqwest = { version = "0.12", features = ["json"] }
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Configuration
config = "0.14"
# Time handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
pretty_assertions = "1.4"