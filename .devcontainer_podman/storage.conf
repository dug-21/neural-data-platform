# Podman storage configuration for rootless containers
[storage]
# Storage driver
driver = "overlay"

# Storage root directory
graphroot = "/home/vscode/.local/share/containers/storage"

# Runtime directory
runroot = "/run/user/1000/containers"

[storage.options]
# Enable mount program for rootless
mount_program = "/usr/bin/fuse-overlayfs"

# Overlay storage options
[storage.options.overlay]
# Enable fuse-overlayfs
mount_program = "/usr/bin/fuse-overlayfs"

# Skip mount home
skip_mount_home = "false"

# Size for container images
size = "10G"

# Additional storage options
mountopt = "nodev,metacopy=on"

# Use native diff
use_composefs = "false"