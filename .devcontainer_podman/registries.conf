# Container registries configuration
unqualified-search-registries = ["docker.io", "quay.io", "registry.access.redhat.com"]

# Docker Hub
[[registry]]
location = "docker.io"
prefix = "docker.io"

# Quay.io
[[registry]]
location = "quay.io"
prefix = "quay.io"

# Red Hat Registry
[[registry]]
location = "registry.access.redhat.com"
prefix = "registry.access.redhat.com"

# GitHub Container Registry
[[registry]]
location = "ghcr.io"
prefix = "ghcr.io"

# Local registry (for development)
[[registry]]
location = "localhost:5000"
prefix = "localhost:5000"
insecure = true