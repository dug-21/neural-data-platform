service:
  name: data-staging
  version: 1.0.0
  source_id: data-staging
  domain: trading

processing:
  transform_verbose: false
  quality_threshold: 0.7
  
redis:
  input_stream: market_data_raw
  output_stream: market_data_staged
  consumer_group: data-staging
  batch_size: 100
  block_timeout_ms: 5000
  
database:
  pool_size: 10
  timeout_seconds: 30
  
dlq:
  enabled: true
  max_retries: 3
  
eventbus:
  type: redis
  channels:
    - "market_data.*"
    - "staging.*"
  batch_size: 100
  buffer_size: 1024
  
logging:
  level: info
  format: json
  
monitoring:
  metrics:
    enabled: true
    port: 9092
  health:
    port: 50052