service:
  name: neural-trading
  version: 1.0.0
  
trading:
  mode: paper
  capital: 100000
  max_position_size: 1000
  risk_limit: 100
  leverage: 1
  commission: 0.001
  slippage: 0.0005
  
risk:
  stop_loss_pct: 2.0
  take_profit_pct: 5.0
  position_sizing: kelly
  max_drawdown_pct: 10.0
  daily_loss_limit_pct: 2.0
  
daa:
  consensus_threshold: 0.6
  voting_timeout_ms: 100
  max_agents: 5
  redis_channel: "daa:coordination"
  
inference:
  model_path: /app/models/latest
  timeout_ms: 50
  cache_size: 1000
  
broker:
  retry_attempts: 3
  
websocket:
  enabled: true
  port: 8080
  path: /ws

# EventBus configuration inherited from neural-core  
eventbus:
  type: redis
  channels:
    - "trading:signals:*"
    - "trading:orders:*"
    - "trading:positions:*"
  batch_size: 100
  buffer_size: 1024
  block_timeout_ms: 5000
  ack_timeout_ms: 30000
  
logging:
  level: info
  format: json
  trade_logs: true
  
monitoring:
  metrics:
    enabled: true
    port: 9094
    track_trades: true
    track_pnl: true
  health:
    port: 50054