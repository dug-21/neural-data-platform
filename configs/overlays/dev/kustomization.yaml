# Development environment overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

patchesStrategicMerge:
  - config-store/config.yaml
  - data-ingestion/config.yaml
  - data-staging/config.yaml
  - neural-ml-ops/config.yaml
  - neural-trading/config.yaml

configMapGenerator:
  - name: environment-config
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug
      - ENABLE_DEBUG=true