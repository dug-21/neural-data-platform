version: '3.8'

services:
  neural-trader:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - DATABASE_URL=postgresql://postgres:dev_password@timescaledb:5432/neural_trader
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
      - RUST_LOG=debug
    ports:
      - "3030:3030"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./target:/app/target
    networks:
      - neural_trader_dev

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_USER=postgres
      - POSTGRES_DB=neural_trader
      - TIMESCALEDB_TELEMETRY=off
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_dev_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init-scripts/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    networks:
      - neural_trader_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - neural_trader_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  data-ingestion:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile
    command: ["python", "main.py"]
    environment:
      - DATABASE_URL=postgresql://postgres:dev_password@timescaledb:5432/neural_trader
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - IEX_CLOUD_API_KEY=${IEX_CLOUD_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data_ingestion:/app:ro
    networks:
      - neural_trader_dev

  # Development tools
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - neural_trader_dev

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@neural-trader.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8082:80"
    depends_on:
      - timescaledb
    networks:
      - neural_trader_dev

volumes:
  timescaledb_dev_data:
  redis_dev_data:

networks:
  neural_trader_dev:
    driver: bridge