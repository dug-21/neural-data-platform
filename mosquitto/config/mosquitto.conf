# Eclipse Mosquitto MQTT Broker Configuration
# For Neural Data Platform Air Quality Application

# General Settings
listener 1883
protocol mqtt

# Anonymous access (for development)
# For production, enable authentication
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection settings
max_connections -1
max_queued_messages 1000
max_inflight_messages 20
max_keepalive 65535

# Message size
message_size_limit 0

# QoS settings
upgrade_outgoing_qos false
max_qos 2

# Retained messages
retain_available true
# max_retained_messages removed - deprecated in mosquitto 2.0+

# Performance tuning for Pi 5
sys_interval 10

# WebSocket listener (optional, for browser clients)
# listener 9001
# protocol websockets

# Production Authentication (uncomment for production use)
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# TLS/SSL (uncomment for production use)
# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
