version: '3.8'

networks:
  neural-net:
    driver: bridge

volumes:
  timescale-data:
  redis-data:
  config-repo:
  prometheus-data:
  grafana-data:

services:
  # =============================================================================
  # INFRASTRUCTURE SERVICES (Start First)
  # =============================================================================
  
  redis:
    image: redis:7-alpine
    container_name: neural-redis
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: neural-timescale
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: neural_trader
      POSTGRES_USER: postgres
    env_file:
      - .env.${CONFIG_ENV:-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # CONFIG STORE (Must Start Before Services)
  # =============================================================================
  
  config-store:
    build:
      context: .
      dockerfile: docker/Dockerfile.config-store
      cache_from:
        - neural-trader/config-store:latest
    image: neural-trader/config-store:${BUILD_ID:-latest}
    container_name: neural-config-store
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "50051:50051"  # gRPC port
      - "8090:8090"    # Health/metrics port
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - config-repo:/config-repo
    environment:
      CONFIG_REPO_URL: ${CONFIG_REPO_URL:-https://github.com/org/neural-trader.git}
      CONFIG_BRANCH: ${CONFIG_BRANCH:-main}
      CONFIG_ENV: ${CONFIG_ENV:-dev}
      CONFIG_PATH: /config-repo/config/${CONFIG_ENV:-dev}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - .env.${CONFIG_ENV:-dev}
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # DATA PIPELINE SERVICES
  # =============================================================================
  
  data-ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.data-ingestion
      cache_from:
        - neural-trader/data-ingestion:latest
    image: neural-trader/data-ingestion:${BUILD_ID:-latest}
    container_name: neural-data-ingestion
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "8091:8091"  # API/health port
    depends_on:
      config-store:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      CONFIG_STORE_URL: config-store:50051
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader
      SERVICE_NAME: data-ingestion
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - .env.${CONFIG_ENV:-dev}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  data-staging:
    build:
      context: .
      dockerfile: docker/Dockerfile.data-staging
      cache_from:
        - neural-trader/data-staging:latest
    image: neural-trader/data-staging:${BUILD_ID:-latest}
    container_name: neural-data-staging
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "8092:8092"  # API/health port
    depends_on:
      config-store:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-ingestion:
        condition: service_started
    environment:
      CONFIG_STORE_URL: config-store:50051
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: data-staging
      REDIS_STREAM: market_data_raw
      CONSUMER_GROUP: data-staging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - .env.${CONFIG_ENV:-dev}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # ML AND TRADING SERVICES
  # =============================================================================
  
  neural-ml-ops:
    build:
      context: .
      dockerfile: docker/Dockerfile.neural-ml-ops
      cache_from:
        - neural-trader/neural-ml-ops:latest
    image: neural-trader/neural-ml-ops:${BUILD_ID:-latest}
    container_name: neural-ml-ops
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "8093:8093"  # API/health port
      - "50052:50052"  # gRPC port
    depends_on:
      config-store:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      data-staging:
        condition: service_started
    volumes:
      - ./models:/models  # Model storage
    environment:
      CONFIG_STORE_URL: config-store:50051
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: neural-ml-ops
      MODEL_PATH: /models
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - .env.${CONFIG_ENV:-dev}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  neural-trading:
    build:
      context: .
      dockerfile: docker/Dockerfile.neural-trading
      cache_from:
        - neural-trader/neural-trading:latest
    image: neural-trader/neural-trading:${BUILD_ID:-latest}
    container_name: neural-trading
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "8094:8094"  # API/health port
      - "50053:50053"  # gRPC port
    depends_on:
      config-store:
        condition: service_healthy
      neural-ml-ops:
        condition: service_started
    environment:
      CONFIG_STORE_URL: config-store:50051
      REDIS_URL: redis://redis:6379
      SERVICE_NAME: neural-trading
      TRADING_MODE: ${TRADING_MODE:-paper}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - .env.${CONFIG_ENV:-dev}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # MONITORING SERVICES (Optional for Dev)
  # =============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: neural-prometheus
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: neural-grafana
    restart: unless-stopped
    networks:
      - neural-net
    ports:
      - "3000:3000"
    volumes:
      - ./config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    profiles:
      - monitoring

  # =============================================================================
  # TEST RUNNER SERVICE (Only for Testing)
  # =============================================================================
  
  test-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.test-runner
    image: neural-trader/test-runner:${BUILD_ID:-latest}
    container_name: neural-test-runner
    networks:
      - neural-net
    depends_on:
      - config-store
      - data-ingestion
      - data-staging
      - neural-ml-ops
      - neural-trading
    volumes:
      - ./tests:/tests
      - ./test-results:/test-results
    environment:
      CONFIG_ENV: ${CONFIG_ENV:-test}
      TEST_TYPE: ${TEST_TYPE:-all}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader
    env_file:
      - .env.${CONFIG_ENV:-test}
    profiles:
      - test
    command: ["python", "/tests/run_tests.py"]

  # =============================================================================
  # MIGRATION RUNNER (Database Schema Updates)
  # =============================================================================
  
  migration-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.migration
    image: neural-trader/migration:${BUILD_ID:-latest}
    container_name: neural-migration
    networks:
      - neural-net
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@timescaledb:5432/neural_trader
    env_file:
      - .env.${CONFIG_ENV:-dev}
    profiles:
      - migrate
    command: ["./migrate.sh", "up"]