# IoT Domain Configuration
# Real-time IoT device monitoring, predictive maintenance, and edge computing

domain:
  name: "iot"
  version: "2.3.0"
  description: "Industrial IoT platform with ML-powered predictive maintenance and edge intelligence"
  author: "IoT Engineering Team"
  license: "Apache-2.0"
  extends: "platform.defaults"
  tags:
    - "iot"
    - "edge-computing"
    - "predictive-maintenance"
    - "real-time"
    - "industrial"

# IoT-specific variables
variables:
  # Device management
  max_devices: 100000
  device_heartbeat_interval: "30s"
  offline_threshold: "5m"
  
  # Data processing
  telemetry_buffer_size: 50000
  aggregation_window: "1m"
  
  # Predictive maintenance
  failure_prediction_horizon: "7d"
  maintenance_confidence_threshold: 0.85
  
  # Edge computing
  edge_model_size_limit: "50MB"
  edge_sync_interval: "1h"
  
  # Resource limits
  max_telemetry_rate: "10000/s"
  data_retention_days: 90

# Neural Models for IoT
neural:
  models:
    # Predictive maintenance model
    - name: "failure_predictor"
      type: "lstm"
      architecture:
        input_size: 50  # Sensor readings + derived features
        hidden_size: 128
        num_layers: 3
        dropout: 0.2
        attention: true
        output_size: 5  # Failure probability for 5 components
        
      training:
        epochs: 200
        batch_size: 128
        sequence_length: 168  # 7 days of hourly data
        learning_rate: 0.001
        
        # Time-series specific
        lookback_window: "7d"
        prediction_steps: [24, 72, 168]  # 1, 3, 7 days ahead
        
        # Class imbalance handling
        class_weights:
          normal: 1.0
          warning: 5.0
          critical: 10.0
      
      features:
        sensor_readings:
          - "temperature"
          - "vibration_x"
          - "vibration_y"
          - "vibration_z"
          - "pressure"
          - "humidity"
          - "current_draw"
          - "rpm"
          - "acoustic_emission"
          
        derived_features:
          - "temperature_gradient"
          - "vibration_magnitude"
          - "vibration_frequency_spectrum"
          - "pressure_variance"
          - "power_factor"
          - "operational_hours"
          - "cycles_count"
          
        environmental:
          - "ambient_temperature"
          - "ambient_humidity"
          - "altitude"
    
    # Anomaly detection for sensors
    - name: "sensor_anomaly_detector"
      type: "isolation_forest"
      architecture:
        n_estimators: 200
        contamination: 0.01
        max_features: 1.0
        
      training:
        online_learning: true
        update_frequency: "1h"
        min_samples: 1000
    
    # Energy optimization model
    - name: "energy_optimizer"
      type: "reinforcement_learning"
      architecture:
        algorithm: "PPO"  # Proximal Policy Optimization
        state_dim: 20
        action_dim: 10  # Control parameters
        hidden_layers: [256, 128, 64]
        
      training:
        episodes: 10000
        max_steps_per_episode: 1000
        learning_rate: 0.0003
        
        # Reward function
        reward_config:
          energy_weight: -0.7
          performance_weight: 0.3
          safety_penalty: -10.0
    
    # Edge model (lightweight)
    - name: "edge_anomaly_detector"
      type: "quantized_autoencoder"
      architecture:
        encoder_layers: [32, 16, 8]
        latent_dim: 4
        decoder_layers: [8, 16, 32]
        quantization_bits: 8
        
      # Edge deployment optimization
      optimization:
        pruning_sparsity: 0.5
        quantization: "int8"
        target_size: "10MB"
        target_latency: "10ms"

# IoT DAA Agents
agents:
  coordinator:
    topology: "hierarchical"
    max_agents: 20
    coordination_interval: "2s"
    
    # Edge-cloud coordination
    edge_cloud_sync:
      enabled: true
      sync_interval: "${variables.edge_sync_interval}"
      conflict_resolution: "cloud_priority"
  
  types:
    # Device manager agent
    - type: "device_manager"
      count: 3
      capabilities:
        - "device_registration"
        - "heartbeat_monitoring"
        - "firmware_management"
        - "configuration_sync"
      
      resources:
        cpu_limit: "2"
        memory_limit: "4Gi"
      
      behavior:
        device_management:
          registration:
            auto_approve: false
            validation_rules:
              - "valid_certificate"
              - "known_device_type"
              - "geo_fence_check"
          
          monitoring:
            heartbeat_timeout: "${variables.offline_threshold}"
            health_checks:
              - "connectivity"
              - "resource_usage"
              - "error_rate"
          
          firmware:
            update_strategy: "rolling"  # rolling, canary, blue_green
            rollback_on_failure: true
            max_concurrent_updates: 100
    
    # Telemetry processor agent
    - type: "telemetry_processor"
      count: 5
      capabilities:
        - "data_validation"
        - "aggregation"
        - "feature_extraction"
        - "protocol_translation"
      
      resources:
        cpu_limit: "4"
        memory_limit: "8Gi"
        network_priority: "high"
      
      behavior:
        processing:
          protocols:
            - "mqtt"
            - "coap"
            - "opcua"
            - "modbus"
            - "custom_binary"
          
          validation:
            schema_enforcement: true
            range_checking: true
            timestamp_validation: true
          
          aggregation:
            methods:
              - "mean"
              - "median"
              - "min"
              - "max"
              - "std"
              - "percentile"
            
            windows: ["10s", "1m", "5m", "1h"]
    
    # Predictive maintenance agent
    - type: "maintenance_predictor"
      count: 2
      capabilities:
        - "failure_prediction"
        - "maintenance_scheduling"
        - "parts_inventory"
        - "technician_dispatch"
      
      resources:
        cpu_limit: "4"
        memory_limit: "8Gi"
        gpu: true
      
      behavior:
        prediction:
          models:
            - "failure_predictor"
            - "remaining_useful_life"
          
          thresholds:
            warning: 0.6
            critical: 0.8
            immediate: 0.95
        
        scheduling:
          optimization_objective: "minimize_downtime"
          constraints:
            - "technician_availability"
            - "parts_availability"
            - "production_schedule"
          
          lookahead_days: 30
    
    # Edge coordinator agent
    - type: "edge_coordinator"
      count: 4
      capabilities:
        - "edge_deployment"
        - "model_distribution"
        - "edge_monitoring"
        - "data_aggregation"
      
      behavior:
        edge_management:
          deployment:
            model_compression: true
            differential_updates: true
            
          monitoring:
            metrics:
              - "inference_latency"
              - "model_accuracy"
              - "resource_usage"
              - "data_throughput"
          
          failover:
            strategy: "nearest_neighbor"
            health_check_interval: "10s"
    
    # Alert response agent
    - type: "alert_responder"
      count: 2
      capabilities:
        - "alert_triage"
        - "automated_response"
        - "escalation"
        - "root_cause_analysis"
      
      behavior:
        response_rules:
          - condition: "temperature > critical_threshold"
            actions:
              - "reduce_load"
              - "increase_cooling"
              - "notify_operator"
          
          - condition: "vibration_anomaly && rpm > 0"
            actions:
              - "emergency_stop"
              - "dispatch_technician"
              - "isolate_equipment"

# IoT Data Pipeline
pipeline:
  sources:
    # MQTT broker for device telemetry
    - name: "mqtt_telemetry"
      type: "mqtt"
      config:
        brokers:
          - "tcp://${MQTT_BROKER_1}:1883"
          - "tcp://${MQTT_BROKER_2}:1883"
        
        # Topic patterns
        topics:
          - "devices/+/telemetry"
          - "devices/+/status"
          - "devices/+/alerts"
          - "gateways/+/aggregated"
        
        # MQTT settings
        qos: 1
        clean_session: false
        client_id_prefix: "iot_platform_"
        
        # Security
        tls:
          enabled: true
          ca_cert: "/certs/mqtt-ca.crt"
          client_cert: "/certs/mqtt-client.crt"
          client_key: "/certs/mqtt-client.key"
        
        # Performance
        max_inflight: 1000
        buffer_size: "${variables.telemetry_buffer_size}"
    
    # CoAP for constrained devices
    - name: "coap_devices"
      type: "coap"
      config:
        port: 5683
        dtls:
          enabled: true
          psk: "${COAP_PSK}"
        
        # Resource discovery
        resource_directory: true
        multicast_discovery: true
    
    # OPC UA for industrial equipment
    - name: "opcua_industrial"
      type: "opcua"
      config:
        servers:
          - url: "opc.tcp://${OPCUA_SERVER_1}:4840"
            username: "${OPCUA_USER}"
            password: "${OPCUA_PASS}"
        
        # Subscription settings
        subscription:
          publishing_interval: 1000
          monitored_items:
            - node_id: "ns=2;s=Machine.Status"
              sampling_interval: 100
            - node_id: "ns=2;s=Machine.Temperature"
              sampling_interval: 1000
    
    # REST API for modern devices
    - name: "http_devices"
      type: "http"
      config:
        port: 8080
        endpoints:
          - path: "/telemetry"
            method: "POST"
            auth: "api_key"
          
          - path: "/bulk"
            method: "POST"
            auth: "jwt"
            max_batch_size: 1000
    
    # Edge gateway aggregation
    - name: "edge_gateways"
      type: "grpc"
      config:
        port: 50051
        
        # Service definition
        service: "EdgeGateway"
        methods:
          - "StreamTelemetry"
          - "BatchUpload"
          - "GetModelUpdate"
  
  transformations:
    # Protocol normalization
    - name: "normalize_protocols"
      type: "protocol_translation"
      config:
        output_format: "unified_telemetry_model"
        
        # Field mappings
        mappings:
          mqtt:
            device_id: "$.client_id"
            timestamp: "$.ts"
            data: "$.payload"
          
          opcua:
            device_id: "$.server_uri"
            timestamp: "$.source_timestamp"
            data: "$.value"
    
    # Data quality checks
    - name: "quality_assurance"
      type: "data_quality"
      config:
        checks:
          - type: "completeness"
            required_fields: ["device_id", "timestamp", "sensor_type", "value"]
            
          - type: "validity"
            rules:
              temperature: { min: -50, max: 200 }
              pressure: { min: 0, max: 1000 }
              vibration: { min: 0, max: 100 }
          
          - type: "timeliness"
            max_delay: "5m"
            
          - type: "consistency"
            cross_field_rules:
              - "if rpm == 0 then vibration < 0.1"
    
    # Feature engineering for ML
    - name: "feature_engineering"
      type: "iot_features"
      config:
        window_functions:
          - function: "rolling_mean"
            window: "5m"
            fields: ["temperature", "pressure"]
            
          - function: "rolling_std"
            window: "5m"
            fields: ["vibration_x", "vibration_y", "vibration_z"]
            
          - function: "fft"
            window: "10s"
            fields: ["vibration_x", "vibration_y", "vibration_z"]
            frequencies: [10, 50, 100, 500, 1000]
        
        derived_features:
          - name: "vibration_magnitude"
            formula: "sqrt(vibration_x^2 + vibration_y^2 + vibration_z^2)"
            
          - name: "temperature_rate"
            formula: "derivative(temperature, time)"
            
          - name: "efficiency"
            formula: "output_power / input_power"
    
    # Edge preprocessing
    - name: "edge_optimization"
      type: "edge_preprocessing"
      config:
        compression:
          algorithm: "zstd"
          level: 3
          
        downsampling:
          method: "lttb"  # Largest Triangle Three Buckets
          target_points: 1000
          
        filtering:
          - type: "kalman"
            process_noise: 0.01
            measurement_noise: 0.1
  
  sinks:
    # Time-series database for telemetry
    - name: "telemetry_store"
      type: "timeseries"
      config:
        database: "influxdb"
        
        # Data organization
        measurements:
          telemetry:
            tags: ["device_id", "device_type", "location", "customer"]
            fields: ["temperature", "pressure", "vibration", "humidity"]
            retention: "${variables.data_retention_days}d"
          
          events:
            tags: ["device_id", "event_type", "severity"]
            fields: ["description", "metadata"]
            retention: "365d"
        
        # Performance optimization
        batch_size: 5000
        flush_interval: "1s"
        compression: "snappy"
    
    # Data lake for ML training
    - name: "data_lake"
      type: "s3"
      config:
        bucket: "${S3_BUCKET}"
        
        # Partitioning strategy
        partitions:
          - "year"
          - "month"
          - "day"
          - "device_type"
          - "customer"
        
        # File format
        format: "parquet"
        compression: "snappy"
        
        # Lifecycle
        lifecycle_rules:
          - id: "archive_old_data"
            transition:
              days: 90
              storage_class: "GLACIER"
    
    # Real-time analytics
    - name: "analytics_engine"
      type: "spark_streaming"
      config:
        master: "${SPARK_MASTER}"
        
        # Streaming configuration
        batch_interval: "10s"
        checkpoint_dir: "hdfs:///iot/checkpoints"
        
        # Analytics jobs
        jobs:
          - name: "device_statistics"
            class: "com.iot.analytics.DeviceStats"
            
          - name: "anomaly_detection"
            class: "com.iot.analytics.AnomalyDetection"
            
          - name: "predictive_maintenance"
            class: "com.iot.analytics.PredictiveMaintenance"
    
    # Edge model distribution
    - name: "edge_models"
      type: "edge_registry"
      config:
        storage: "distributed"
        
        # Model packaging
        formats:
          - "tflite"
          - "onnx"
          - "tensorrt"
        
        # Distribution strategy
        distribution:
          method: "p2p"  # peer-to-peer
          redundancy: 3
          
        # Versioning
        versioning:
          strategy: "semantic"
          auto_rollback: true

# IoT API
api:
  gateway:
    base_path: "/api/v1/iot"
    rate_limit: "1000/minute"
    
    # Protocol support
    protocols:
      - "http"
      - "https"
      - "websocket"
      - "grpc"
  
  rest:
    # Device management
    - path: "/devices"
      method: "GET"
      description: "List all devices"
      parameters:
        type: { type: "string" }
        status: { type: "string", enum: ["online", "offline", "maintenance"] }
        location: { type: "string" }
        
    - path: "/devices/{device_id}"
      method: "GET"
      description: "Get device details"
      
    - path: "/devices/{device_id}/telemetry"
      method: "GET"
      description: "Get device telemetry"
      parameters:
        start_time: { type: "string", format: "date-time" }
        end_time: { type: "string", format: "date-time" }
        metrics: { type: "array", items: { type: "string" } }
        
    - path: "/devices/{device_id}/command"
      method: "POST"
      description: "Send command to device"
      schema:
        type: "object"
        properties:
          command: { type: "string" }
          parameters: { type: "object" }
          timeout: { type: "integer", default: 30 }
    
    # Predictive maintenance
    - path: "/maintenance/predictions"
      method: "GET"
      description: "Get maintenance predictions"
      parameters:
        confidence_threshold: { type: "number", default: 0.7 }
        horizon_days: { type: "integer", default: 7 }
        
    - path: "/maintenance/schedule"
      method: "GET"
      description: "Get maintenance schedule"
      
    - path: "/maintenance/history"
      method: "GET"
      description: "Get maintenance history"
    
    # Analytics
    - path: "/analytics/overview"
      method: "GET"
      description: "Get fleet overview"
      
    - path: "/analytics/anomalies"
      method: "GET"
      description: "Get detected anomalies"
      
    - path: "/analytics/efficiency"
      method: "GET"
      description: "Get efficiency metrics"
    
    # Edge management
    - path: "/edge/gateways"
      method: "GET"
      description: "List edge gateways"
      
    - path: "/edge/models"
      method: "GET"
      description: "List available edge models"
      
    - path: "/edge/deploy"
      method: "POST"
      description: "Deploy model to edge"
      schema:
        type: "object"
        properties:
          model_id: { type: "string" }
          target_gateways: { type: "array", items: { type: "string" } }
          rollout_strategy: { type: "string", enum: ["immediate", "canary", "gradual"] }
  
  websocket:
    # Real-time telemetry
    - path: "/telemetry/stream"
      description: "Real-time telemetry stream"
      channels:
        - name: "device"
          subscribe: "telemetry:{device_id}"
          
        - name: "location"
          subscribe: "telemetry:location:{location_id}"
          
        - name: "alerts"
          subscribe: "alerts:{severity}"
    
    # Command and control
    - path: "/control/stream"
      description: "Device control channel"
      authentication: true
      channels:
        - name: "commands"
          publish: "command:{device_id}"
          
        - name: "responses"
          subscribe: "response:{device_id}"

# IoT Monitoring
monitoring:
  metrics:
    custom:
      # Device metrics
      - name: "devices_online"
        type: "gauge"
        labels: ["device_type", "location", "customer"]
        
      - name: "telemetry_rate"
        type: "counter"
        labels: ["device_type", "metric_type"]
        
      - name: "device_errors"
        type: "counter"
        labels: ["device_id", "error_type"]
        
      # Predictive maintenance metrics
      - name: "predicted_failures"
        type: "gauge"
        labels: ["device_type", "component", "horizon"]
        
      - name: "maintenance_accuracy"
        type: "gauge"
        description: "Prediction accuracy"
        
      # Edge metrics
      - name: "edge_gateway_health"
        type: "gauge"
        labels: ["gateway_id", "location"]
        
      - name: "edge_model_latency"
        type: "histogram"
        labels: ["model", "gateway"]
        buckets: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]
  
  alerts:
    # Device alerts
    - name: "device_offline"
      condition: "device_last_seen > ${variables.offline_threshold}"
      severity: "warning"
      
    - name: "high_failure_prediction"
      condition: "failure_probability > 0.9"
      severity: "critical"
      actions:
        - "create_maintenance_ticket"
        - "notify_technician"
        
    - name: "sensor_anomaly"
      condition: "anomaly_score > 0.95"
      severity: "warning"
      
    - name: "fleet_degradation"
      condition: "avg(device_health) < 0.7"
      severity: "critical"
  
  dashboards:
    - name: "fleet_overview"
      panels:
        - title: "Device Status"
          type: "pie"
          query: "devices_by_status"
          
        - title: "Telemetry Volume"
          type: "graph"
          query: "rate(telemetry_received[5m])"
          
        - title: "Predictive Maintenance"
          type: "heatmap"
          query: "failure_predictions_by_device"

# IoT Security
security:
  # Device authentication
  device_auth:
    methods:
      - type: "x509"
        ca_cert: "/certs/device-ca.crt"
        verify_cn: true
        
      - type: "pre_shared_key"
        key_derivation: "pbkdf2"
        
      - type: "tpm"
        attestation: true
  
  # Data security
  encryption:
    data_at_rest:
      enabled: true
      algorithm: "AES-256-GCM"
      key_rotation: "30d"
      
    data_in_transit:
      protocols:
        mqtt:
          tls: true
          min_version: "1.2"
          
        coap:
          dtls: true
          
        http:
          https_only: true
  
  # Access control
  authorization:
    device_policies:
      - name: "telemetry_only"
        permissions:
          - "telemetry:write"
          - "status:write"
          
      - name: "full_access"
        permissions:
          - "telemetry:write"
          - "command:read"
          - "config:read"
          - "firmware:read"
    
    user_roles:
      - name: "operator"
        permissions:
          - "devices:view"
          - "telemetry:view"
          - "alerts:view"
          - "commands:execute"
          
      - name: "maintenance_tech"
        permissions:
          - "devices:*"
          - "maintenance:*"
          - "firmware:update"
          
      - name: "iot_admin"
        permissions:
          - "*"

# IoT-specific Plugins
plugins:
  active:
    # Protocol adapters
    - name: "proprietary_protocol"
      version: "1.2.0"
      config:
        protocol_version: "v3"
        encryption: true
        
    # Custom analytics
    - name: "vibration_analysis"
      version: "2.0.0"
      config:
        fft_resolution: 1024
        frequency_bands:
          - { name: "low", range: [0, 100] }
          - { name: "medium", range: [100, 1000] }
          - { name: "high", range: [1000, 10000] }
    
    # Industry-specific
    - name: "manufacturing_kpi"
      version: "1.5.0"
      config:
        kpis:
          - "oee"  # Overall Equipment Effectiveness
          - "mtbf"  # Mean Time Between Failures
          - "mttr"  # Mean Time To Repair

# Environment configurations
environments:
  production:
    # Scaled for production
    variables:
      max_devices: 1000000
      telemetry_buffer_size: 500000
      
    agents:
      types:
        - type: "telemetry_processor"
          count: 20
          
        - type: "device_manager"
          count: 10
          
    # High availability
    pipeline:
      sources:
        - name: "mqtt_telemetry"
          config:
            brokers:
              - "tcp://mqtt1.prod:1883"
              - "tcp://mqtt2.prod:1883"
              - "tcp://mqtt3.prod:1883"
  
  edge:
    # Edge deployment configuration
    neural:
      models:
        - name: "edge_anomaly_detector"
          optimization:
            target_size: "5MB"
            target_latency: "5ms"
            
    # Limited resources
    agents:
      types:
        - type: "edge_coordinator"
          count: 1
          resources:
            cpu_limit: "0.5"
            memory_limit: "512Mi"