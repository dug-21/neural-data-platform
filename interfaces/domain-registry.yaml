# Domain Registry Service Interface Specification
# Production-grade configuration and service discovery

openapi: 3.0.3
info:
  title: Domain Registry Service API
  version: 1.0.0
  description: Central registry for domain definitions, service discovery, and configuration management

servers:
  - url: https://registry.neural-trader.io/v1
    description: Production
  - url: https://staging-registry.neural-trader.io/v1
    description: Staging

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    
    mtls:
      type: mutualTLS
  
  schemas:
    Domain:
      type: object
      required: [id, name, version, status, schema, endpoints]
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          example: "market-data"
        
        version:
          type: string
          pattern: "^\\d+\\.\\d+\\.\\d+$"
          example: "1.2.3"
        
        status:
          type: string
          enum: [active, deprecated, retired]
        
        metadata:
          type: object
          properties:
            description:
              type: string
            owner:
              type: string
            team:
              type: string
            sla:
              $ref: '#/components/schemas/SLA'
            tags:
              type: array
              items:
                type: string
        
        schema:
          $ref: '#/components/schemas/SchemaDefinition'
        
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        
        streamMappings:
          type: array
          items:
            $ref: '#/components/schemas/StreamMapping'
        
        dependencies:
          type: array
          items:
            type: object
            properties:
              domainId:
                type: string
              version:
                type: string
              required:
                type: boolean
    
    SchemaDefinition:
      type: object
      required: [format, location, version]
      properties:
        format:
          type: string
          enum: [protobuf, avro, json-schema, thrift]
        
        location:
          type: string
          format: uri
          example: "registry://schemas/market-data/v1.proto"
        
        version:
          type: string
        
        compatibility:
          type: string
          enum: [backward, forward, full, none]
          default: backward
        
        evolution:
          type: object
          properties:
            allowFieldAddition:
              type: boolean
              default: true
            allowFieldRemoval:
              type: boolean
              default: false
            allowTypeChange:
              type: boolean
              default: false
    
    Endpoint:
      type: object
      required: [name, protocol, url, healthCheck]
      properties:
        name:
          type: string
        
        protocol:
          type: string
          enum: [grpc, rest, websocket, kafka, nats]
        
        url:
          type: string
          format: uri
        
        healthCheck:
          type: object
          properties:
            path:
              type: string
            interval:
              type: integer
              description: Health check interval in seconds
            timeout:
              type: integer
            retries:
              type: integer
        
        loadBalancing:
          type: string
          enum: [round-robin, least-connections, ip-hash, random]
          default: round-robin
        
        circuitBreaker:
          type: object
          properties:
            threshold:
              type: integer
              default: 5
            timeout:
              type: integer
              default: 60
            halfOpenRequests:
              type: integer
              default: 3
    
    StreamMapping:
      type: object
      required: [source, destination, transformation]
      properties:
        source:
          type: object
          properties:
            topic:
              type: string
            partition:
              type: integer
            offset:
              type: string
              enum: [earliest, latest, stored]
        
        destination:
          type: object
          properties:
            topic:
              type: string
            partitionKey:
              type: string
        
        transformation:
          type: object
          properties:
            type:
              type: string
              enum: [none, map, filter, aggregate, join]
            config:
              type: object
        
        errorHandling:
          type: object
          properties:
            strategy:
              type: string
              enum: [retry, dlq, skip, fail]
            maxRetries:
              type: integer
            backoff:
              type: string
              enum: [fixed, exponential, linear]
    
    SLA:
      type: object
      properties:
        availability:
          type: number
          minimum: 0
          maximum: 100
          example: 99.99
        
        latency:
          type: object
          properties:
            p50:
              type: integer
              description: 50th percentile latency in ms
            p95:
              type: integer
            p99:
              type: integer
        
        throughput:
          type: object
          properties:
            rps:
              type: integer
              description: Requests per second
            mbps:
              type: number
              description: Megabits per second
    
    ServiceRegistration:
      type: object
      required: [serviceId, instances]
      properties:
        serviceId:
          type: string
        
        instances:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              host:
                type: string
              port:
                type: integer
              metadata:
                type: object
              health:
                type: string
                enum: [healthy, unhealthy, unknown]
              lastSeen:
                type: string
                format: date-time

paths:
  /domains:
    get:
      summary: List all registered domains
      operationId: listDomains
      tags: [Domains]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, deprecated, retired, all]
          default: active
        - name: tag
          in: query
          schema:
            type: string
      responses:
        200:
          description: List of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain'
    
    post:
      summary: Register a new domain
      operationId: registerDomain
      tags: [Domains]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Domain'
      responses:
        201:
          description: Domain registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
  
  /domains/{domainId}:
    get:
      summary: Get domain details
      operationId: getDomain
      tags: [Domains]
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Domain details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
    
    put:
      summary: Update domain configuration
      operationId: updateDomain
      tags: [Domains]
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Domain'
      responses:
        200:
          description: Domain updated successfully
    
    delete:
      summary: Retire a domain
      operationId: retireDomain
      tags: [Domains]
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: Domain retired successfully
  
  /services:
    get:
      summary: List registered services
      operationId: listServices
      tags: [Service Discovery]
      responses:
        200:
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceRegistration'
    
    post:
      summary: Register service instances
      operationId: registerService
      tags: [Service Discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRegistration'
      responses:
        201:
          description: Service registered
  
  /schemas:
    post:
      summary: Register a new schema version
      operationId: registerSchema
      tags: [Schema Registry]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                domainId:
                  type: string
                version:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        201:
          description: Schema registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: string
                  checksum:
                    type: string
  
  /schemas/{domainId}/validate:
    post:
      summary: Validate data against schema
      operationId: validateSchema
      tags: [Schema Registry]
      parameters:
        - name: domainId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string