[workspace]
members = [
    "config-store",
    "neural-core",
    "neural-trading",
    "neural-ml-ops",
    "data-staging"
]
exclude = [
    "vendor",
    "vendor/ruv-fann",
    "vendor/ruv-fann/ruv-swarm",
    "vendor/ruv-fann/neuro-divergent"
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies across all services
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tonic = "0.12"
prost = "0.13"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono"] }

# Note: NO [package] section
# Note: NO [[bin]] sections
# Note: NO [dependencies] section
# This is now a pure workspace configuration