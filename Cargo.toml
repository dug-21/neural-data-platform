[package]
name = "autonomous-platform"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "neural-trader"
path = "src/main.rs"

[dependencies]
# Autonomous Platform Dependencies
# Note: Custom ruv-fann and daa integrations have been restored
# Use ruv-swarm MCP tools for neural/agent coordination instead
# WORKAROUND: The upstream repository has broken submodule configuration
# Using local path to avoid submodule issues
# TODO: Re-enable once Rust edition2024 dependencies are resolved
# ruv-fann = { path = "./vendor/ruv-fann", features = ["default"] }
# daa = "0.5"

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_toml = "0.0.1"
serde_yaml = "0.9"
toml = "0.8"

# Database - temporarily using older versions to avoid edition2024
# TODO: Upgrade once Rust edition2024 is properly supported
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono"] }
redis = { version = "0.23", features = ["tokio-comp"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and metrics
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
prometheus = "0.13"

# Security
regex = "1.7"

# System monitoring
sysinfo = "0.30"

# Data processing
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Temporarily removed patches to get a working build

[dev-dependencies]
# Testing
mockall = "0.13"
tempfile = "3.14"
serial_test = "3.2"
cargo-tarpaulin = "0.32"
rand = "0.8"
tracing-test = "0.2"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "standalone_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.production]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false