[package]
name = "autonomous-platform"
version = "0.1.0"
edition = "2021"

[dependencies]
# Autonomous Platform Dependencies
# Core ruv ecosystem
ruv-fann = "0.1.3"
ruv-swarm-core = "0.2.0"
ruv-swarm-ml = "0.2.0"
ruv-swarm-mcp = "0.2.0"
daa-orchestrator = { git = "https://github.com/ruvnet/daa.git", branch = "main" }

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_toml = "0.0.1"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono"] }
redis = { version = "0.25", features = ["tokio-comp"] }

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Data processing
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }
futures = "0.3"

[dev-dependencies]
# Testing
mockall = "0.13"
tempfile = "3.14"
serial_test = "3.2"
cargo-tarpaulin = "0.32"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1