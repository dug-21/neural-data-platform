[workspace]
members = [
    "mcp-trading-server",
]
exclude = [
    "vendor/ruv-fann",
    "vendor/ruv-fann/ruv-swarm",
    "vendor/ruv-fann/neuro-divergent",
]
resolver = "2"

[package]
name = "autonomous-platform"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "neural-trader"
path = "src/main.rs"

[[bin]]
name = "model-rollback"
path = "src/bin/model_rollback_cli.rs"

[dependencies]
# Autonomous Platform Dependencies
# Note: Custom ruv-fann and daa integrations have been restored
# Use ruv-swarm MCP tools for neural/agent coordination instead
# Neural and DAA dependencies from vendor
ruv-fann = { path = "./vendor/ruv-fann", features = ["default"] }
neuro-divergent = { path = "./vendor/ruv-fann/neuro-divergent", features = ["default", "models", "registry"] }
neuro-divergent-core = { path = "./vendor/ruv-fann/neuro-divergent/neuro-divergent-core" }
neuro-divergent-models = { path = "./vendor/ruv-fann/neuro-divergent/neuro-divergent-models", features = ["default", "recurrent", "transformer", "specialized"] }
neuro-divergent-registry = { path = "./vendor/ruv-fann/neuro-divergent/neuro-divergent-registry", features = ["default"] }
# neuro-divergent-data = { path = "./vendor/ruv-fann/neuro-divergent/neuro-divergent-data", features = ["default"] } # Disabled due to serde/ndarray compatibility issues
neuro-divergent-training = { path = "./vendor/ruv-fann/neuro-divergent/neuro-divergent-training", features = ["default"] }
daa = { version = "0.5", optional = true }

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_toml = "0.0.1"
serde_yaml = "0.9"
toml = "0.8"

# Database
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono"] }
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and metrics
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
prometheus = "0.13"

# Security
regex = "1.7"
sha2 = "0.10"

# System monitoring
sysinfo = "0.30"

# Data processing
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.9", features = ["serde"] }
serde_json = "1.0"
ndarray = { version = "0.15", features = ["rayon"] }
polars = { version = "0.35", features = ["lazy", "temporal", "strings", "is_in", "csv", "parquet", "json"] }
nalgebra = "0.32"
num-complex = "0.4"
statrs = "0.16"
ndarray-stats = "0.5"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Lazy static initialization
once_cell = "1.20"

# Parallel processing
rayon = "1.8"

# Performance optimization dependencies
dashmap = "6.1"
crossbeam = "0.8"
parking_lot = "0.12"

# Random number generation
rand = "0.8"
rand_distr = "0.4"
fastrand = "2.0"

# URL parsing
url = "2.5"

# Additional neuro-divergent dependencies
num-traits = "0.2"
bincode = "1.3"
flate2 = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

[features]
default = ["neural", "daa-features"]
neural = []  # No longer optional - neuro-divergent is always included
daa-features = ["dep:daa"]

[dev-dependencies]
# Testing
mockall = "0.13"
tempfile = "3.14"
serial_test = "3.2"
cargo-tarpaulin = "0.32"
rand = "0.8"
tracing-test = "0.2"
approx = "0.5"

# Additional coverage tools
# Note: cargo-llvm-cov is installed via cargo install, not as a dependency

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "standalone_benchmarks"
harness = false

[[bench]]
name = "neural_trader_bench"
harness = false

[[example]]
name = "adapter_integration"
path = "examples/adapter_integration.rs"

[[example]]
name = "autonomous_trading_demo"
path = "examples/autonomous_trading_demo.rs"

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "mcp_server_simple"
path = "src/bin/mcp_server_simple.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.production]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false