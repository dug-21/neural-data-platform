[workspace]
members = [
    "mcp-trading-server",
]
exclude = [
    "vendor/ruv-fann",
    "vendor/ruv-fann/ruv-swarm",
    "vendor/ruv-fann/neuro-divergent",
]
resolver = "2"

[package]
name = "autonomous-platform"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "neural-trader"
path = "src/main.rs"

[dependencies]
# Autonomous Platform Dependencies
# Note: Custom ruv-fann and daa integrations have been restored
# Use ruv-swarm MCP tools for neural/agent coordination instead
# Neural and DAA dependencies from vendor
ruv-fann = { path = "./vendor/ruv-fann", features = ["default"] }
neuro-divergent = { path = "./vendor/ruv-fann/neuro-divergent", features = ["default", "models", "registry"], optional = true }
daa = { version = "0.5", optional = true }

# Configuration
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_toml = "0.0.1"
serde_yaml = "0.9"
toml = "0.8"

# Database - temporarily using older versions to avoid edition2024
# TODO: Upgrade once Rust edition2024 is properly supported
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono"] }
redis = { version = "0.23", features = ["tokio-comp"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and metrics
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
prometheus = "0.13"

# Security
regex = "1.7"

# System monitoring
sysinfo = "0.30"

# Data processing
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
ndarray = "0.15"
polars = { version = "0.36", features = ["lazy", "temporal", "strings", "is_in"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Random number generation
rand = "0.8"

# URL parsing
url = "2.5"

# Additional dependencies will be added after resolving workspace issues

[features]
default = ["neural", "daa-features"]
neural = []
daa-features = ["dep:daa"]

[dev-dependencies]
# Testing
mockall = "0.13"
tempfile = "3.14"
serial_test = "3.2"
cargo-tarpaulin = "0.32"
rand = "0.8"
tracing-test = "0.2"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "standalone_benchmarks"
harness = false

[[bench]]
name = "neural_trader_bench"
harness = false

[[example]]
name = "adapter_integration"
path = "examples/adapter_integration.rs"

[[example]]
name = "autonomous_trading_demo"
path = "examples/autonomous_trading_demo.rs"

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "mcp_server_simple"
path = "src/bin/mcp_server_simple.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.production]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false