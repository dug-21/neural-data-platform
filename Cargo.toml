[workspace]
members = [
    "config-client",
    "core",
    "core/ndp-mcp-server",
    "domains/air-quality",
    "apps/air-quality-app",
    "apps/silver-etl"
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies across all services
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tonic = "0.12"
prost = "0.13"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }
rumqttc = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
polars = { version = "0.35", features = ["parquet", "lazy", "dtype-datetime"] }

# Note: NO [package] section
# Note: NO [[bin]] sections
# Note: NO [dependencies] section
# This is now a pure workspace configuration