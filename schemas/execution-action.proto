// Model Execution → Action Layer Interface
// Decision formats and execution protocols

syntax = "proto3";

package neural_trader.interfaces.action;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/neural-trader/interfaces/action";
option java_package = "io.neuraltrader.interfaces.action";

// Trading decision from model
message TradingDecision {
  string decision_id = 1;
  string model_id = 2;
  string strategy_id = 3;
  
  google.protobuf.Timestamp timestamp = 4;
  
  DecisionType type = 5;
  ActionDetails action = 6;
  RiskAssessment risk = 7;
  ExecutionConstraints constraints = 8;
  DecisionMetadata metadata = 9;
}

enum DecisionType {
  DECISION_TYPE_UNSPECIFIED = 0;
  DECISION_TYPE_MARKET_ORDER = 1;
  DECISION_TYPE_LIMIT_ORDER = 2;
  DECISION_TYPE_STOP_ORDER = 3;
  DECISION_TYPE_CLOSE_POSITION = 4;
  DECISION_TYPE_ADJUST_POSITION = 5;
  DECISION_TYPE_HEDGE = 6;
  DECISION_TYPE_NO_ACTION = 7;
}

message ActionDetails {
  string symbol = 1;
  string exchange = 2;
  
  enum Side {
    SIDE_UNSPECIFIED = 0;
    SIDE_BUY = 1;
    SIDE_SELL = 2;
  }
  Side side = 3;
  
  // Quantities
  message Quantity {
    float base = 1;
    float quote = 2;
    float percentage_of_portfolio = 3;
    float dollar_value = 4;
  }
  Quantity quantity = 4;
  
  // Pricing
  message Price {
    float limit_price = 1;
    float stop_price = 2;
    float market_price_reference = 3;
    float slippage_tolerance = 4;
  }
  Price price = 5;
  
  // Order type specifics
  message OrderType {
    enum Type {
      TYPE_UNSPECIFIED = 0;
      TYPE_MARKET = 1;
      TYPE_LIMIT = 2;
      TYPE_STOP_MARKET = 3;
      TYPE_STOP_LIMIT = 4;
      TYPE_TRAILING_STOP = 5;
      TYPE_ICEBERG = 6;
    }
    Type type = 1;
    
    // Time in force
    enum TimeInForce {
      TIME_IN_FORCE_UNSPECIFIED = 0;
      TIME_IN_FORCE_GTC = 1; // Good till canceled
      TIME_IN_FORCE_IOC = 2; // Immediate or cancel
      TIME_IN_FORCE_FOK = 3; // Fill or kill
      TIME_IN_FORCE_GTD = 4; // Good till date
    }
    TimeInForce time_in_force = 2;
    
    google.protobuf.Timestamp expire_time = 3;
  }
  OrderType order_type = 6;
  
  // Exit strategy
  message ExitStrategy {
    float take_profit_price = 1;
    float stop_loss_price = 2;
    float trailing_stop_percentage = 3;
    google.protobuf.Timestamp time_exit = 4;
  }
  ExitStrategy exit = 7;
}

message RiskAssessment {
  float confidence_score = 1;
  float risk_score = 2;
  
  // Risk metrics
  message RiskMetrics {
    float value_at_risk = 1;
    float expected_shortfall = 2;
    float sharpe_ratio = 3;
    float max_drawdown = 4;
    float position_size_risk = 5;
  }
  RiskMetrics metrics = 3;
  
  // Risk factors
  repeated RiskFactor factors = 4;
  
  // Risk limits check
  RiskLimitsValidation limits_check = 5;
}

message RiskFactor {
  string name = 1;
  float value = 2;
  float contribution = 3;
  string category = 4; // market, liquidity, execution, model
}

message RiskLimitsValidation {
  bool passed = 1;
  
  repeated LimitCheck checks = 2;
}

message LimitCheck {
  string limit_type = 1;
  float limit_value = 2;
  float current_value = 3;
  bool passed = 4;
  string message = 5;
}

message ExecutionConstraints {
  // Timing constraints
  message TimingConstraints {
    google.protobuf.Timestamp not_before = 1;
    google.protobuf.Timestamp not_after = 2;
    repeated string trading_sessions = 3; // "pre-market", "regular", "after-hours"
    repeated string avoid_times = 4; // "market-open", "market-close"
  }
  TimingConstraints timing = 1;
  
  // Liquidity constraints
  message LiquidityConstraints {
    float min_volume = 1;
    float max_spread = 2;
    float max_market_impact = 3;
    float participation_rate = 4; // Max % of volume
  }
  LiquidityConstraints liquidity = 2;
  
  // Cost constraints
  message CostConstraints {
    float max_commission = 1;
    float max_slippage = 2;
    float max_total_cost = 3;
  }
  CostConstraints cost = 3;
  
  // Regulatory constraints
  message RegulatoryConstraints {
    bool pattern_day_trader_check = 1;
    bool wash_sale_check = 2;
    bool short_sale_restrictions = 3;
    repeated string compliance_rules = 4;
  }
  RegulatoryConstraints regulatory = 4;
}

message DecisionMetadata {
  // Model insights
  message ModelInsights {
    repeated Signal signals = 1;
    map<string, float> feature_importance = 2;
    string reasoning = 3;
  }
  ModelInsights insights = 1;
  
  // Market context
  message MarketContext {
    float current_price = 1;
    float bid = 2;
    float ask = 3;
    float volume = 4;
    float volatility = 5;
    string trend = 6;
    string market_regime = 7;
  }
  MarketContext market = 2;
  
  // Portfolio context
  message PortfolioContext {
    float current_position = 1;
    float average_entry_price = 2;
    float unrealized_pnl = 3;
    float portfolio_allocation = 4;
  }
  PortfolioContext portfolio = 3;
  
  map<string, string> tags = 4;
}

message Signal {
  string name = 1;
  float value = 2;
  float strength = 3;
  string direction = 4; // bullish, bearish, neutral
}

// Execution request to broker/exchange
message ExecutionRequest {
  string request_id = 1;
  string decision_id = 2;
  
  TradingDecision decision = 3;
  ExecutionOptions options = 4;
  
  google.protobuf.Timestamp created_at = 5;
}

message ExecutionOptions {
  enum ExecutionMode {
    EXECUTION_MODE_UNSPECIFIED = 0;
    EXECUTION_MODE_IMMEDIATE = 1;
    EXECUTION_MODE_SCHEDULED = 2;
    EXECUTION_MODE_ALGORITHMIC = 3;
    EXECUTION_MODE_MANUAL_APPROVAL = 4;
  }
  ExecutionMode mode = 1;
  
  // Execution algorithms
  message Algorithm {
    string name = 1; // TWAP, VWAP, POV, etc.
    map<string, google.protobuf.Value> params = 2;
  }
  Algorithm algorithm = 2;
  
  // Smart order routing
  message SmartRouting {
    bool enabled = 1;
    repeated string venues = 2;
    string routing_strategy = 3;
  }
  SmartRouting routing = 3;
  
  bool dry_run = 4;
  bool require_confirmation = 5;
}

// Execution response
message ExecutionResponse {
  string request_id = 1;
  string execution_id = 2;
  
  ExecutionStatus status = 3;
  ExecutionResult result = 4;
  
  google.protobuf.Timestamp executed_at = 5;
}

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_PENDING = 1;
  EXECUTION_STATUS_SUBMITTED = 2;
  EXECUTION_STATUS_PARTIAL = 3;
  EXECUTION_STATUS_FILLED = 4;
  EXECUTION_STATUS_CANCELLED = 5;
  EXECUTION_STATUS_REJECTED = 6;
  EXECUTION_STATUS_FAILED = 7;
}

message ExecutionResult {
  string order_id = 1;
  string exchange_order_id = 2;
  
  repeated Fill fills = 3;
  
  message Summary {
    float total_quantity = 1;
    float average_price = 2;
    float total_commission = 3;
    float realized_slippage = 4;
  }
  Summary summary = 4;
  
  string rejection_reason = 5;
  string error_message = 6;
}

message Fill {
  string fill_id = 1;
  float quantity = 2;
  float price = 3;
  float commission = 4;
  google.protobuf.Timestamp timestamp = 5;
  string venue = 6;
}

// Feedback from execution
message ExecutionFeedback {
  string execution_id = 1;
  string decision_id = 2;
  
  PerformanceMetrics performance = 3;
  MarketImpact impact = 4;
  repeated Issue issues = 5;
  
  google.protobuf.Timestamp timestamp = 6;
}

message PerformanceMetrics {
  float realized_pnl = 1;
  float unrealized_pnl = 2;
  float slippage = 3;
  float execution_cost = 4;
  
  message Timing {
    int64 decision_to_submission_ms = 1;
    int64 submission_to_fill_ms = 2;
    int64 total_latency_ms = 3;
  }
  Timing timing = 5;
}

message MarketImpact {
  float price_impact = 1;
  float volume_participation = 2;
  float spread_cost = 3;
  float market_move = 4;
}

message Issue {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_INFO = 1;
    SEVERITY_WARNING = 2;
    SEVERITY_ERROR = 3;
    SEVERITY_CRITICAL = 4;
  }
  
  Severity severity = 1;
  string type = 2;
  string description = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// Emergency control
message EmergencyControl {
  string control_id = 1;
  
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_HALT_TRADING = 1;
    ACTION_CLOSE_ALL_POSITIONS = 2;
    ACTION_CANCEL_ALL_ORDERS = 3;
    ACTION_REDUCE_EXPOSURE = 4;
    ACTION_SWITCH_TO_HEDGE_MODE = 5;
  }
  Action action = 2;
  
  string reason = 3;
  
  enum Trigger {
    TRIGGER_UNSPECIFIED = 0;
    TRIGGER_MANUAL = 1;
    TRIGGER_RISK_BREACH = 2;
    TRIGGER_SYSTEM_ERROR = 3;
    TRIGGER_MARKET_CONDITION = 4;
    TRIGGER_REGULATORY = 5;
  }
  Trigger trigger = 4;
  
  map<string, string> parameters = 5;
  google.protobuf.Timestamp triggered_at = 6;
}

// Risk validation
message RiskValidationRequest {
  TradingDecision decision = 1;
  
  repeated RiskRule rules = 2;
  PortfolioState portfolio = 3;
  MarketState market = 4;
}

message RiskRule {
  string rule_id = 1;
  string name = 2;
  string expression = 3; // Risk rule expression
  
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_BLOCK = 1;
    ACTION_WARN = 2;
    ACTION_ADJUST = 3;
  }
  Action action = 4;
  
  map<string, float> parameters = 5;
}

message PortfolioState {
  map<string, Position> positions = 1;
  float cash_balance = 2;
  float total_value = 3;
  float buying_power = 4;
  float margin_used = 5;
}

message Position {
  string symbol = 1;
  float quantity = 2;
  float average_price = 3;
  float current_price = 4;
  float unrealized_pnl = 5;
  float realized_pnl = 6;
}

message MarketState {
  string status = 1; // open, closed, halted
  float volatility_index = 2;
  string regime = 3; // trending, ranging, volatile
  map<string, float> indicators = 4;
}

message RiskValidationResponse {
  bool approved = 1;
  
  repeated ValidationResult results = 2;
  TradingDecision adjusted_decision = 3;
}

message ValidationResult {
  string rule_id = 1;
  bool passed = 2;
  string message = 3;
  map<string, float> metrics = 4;
}

// Services
service ActionExecutionService {
  // Submit trading decision for execution
  rpc ExecuteDecision(ExecutionRequest) returns (ExecutionResponse);
  
  // Stream execution updates
  rpc StreamExecutionUpdates(ExecutionRequest) returns (stream ExecutionResponse);
  
  // Validate decision against risk rules
  rpc ValidateRisk(RiskValidationRequest) returns (RiskValidationResponse);
  
  // Emergency controls
  rpc TriggerEmergencyControl(EmergencyControl) returns (EmergencyControlResponse);
  
  // Get execution status
  rpc GetExecutionStatus(ExecutionQuery) returns (ExecutionResponse);
  
  // Cancel execution
  rpc CancelExecution(CancelRequest) returns (CancelResponse);
  
  // Provide execution feedback
  rpc SubmitFeedback(ExecutionFeedback) returns (FeedbackResponse);
}

// Additional service messages
message EmergencyControlResponse {
  string control_id = 1;
  bool success = 2;
  repeated string affected_orders = 3;
  repeated string affected_positions = 4;
  string message = 5;
}

message ExecutionQuery {
  string execution_id = 1;
}

message CancelRequest {
  string execution_id = 1;
  string reason = 2;
}

message CancelResponse {
  bool success = 1;
  string message = 2;
}

message FeedbackResponse {
  bool received = 1;
  string feedback_id = 2;
}