// Data Ingestion → Event Bus Interface
// Standard message format for all data flowing into the event bus

syntax = "proto3";

package neural_trader.interfaces.ingestion;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/neural-trader/interfaces/ingestion";
option java_package = "io.neuraltrader.interfaces.ingestion";

// Standard envelope for all messages entering the event bus
message EventEnvelope {
  // Unique message identifier
  string message_id = 1;
  
  // Correlation ID for tracking related messages
  string correlation_id = 2;
  
  // Source system identifier
  string source = 3;
  
  // Domain this message belongs to
  string domain = 4;
  
  // Event type for routing
  string event_type = 5;
  
  // Schema version of the payload
  string schema_version = 6;
  
  // When the event was created
  google.protobuf.Timestamp created_at = 7;
  
  // When the event was ingested
  google.protobuf.Timestamp ingested_at = 8;
  
  // Routing metadata
  RoutingMetadata routing = 9;
  
  // Quality metadata
  QualityMetadata quality = 10;
  
  // The actual event payload (domain-specific)
  google.protobuf.Any payload = 11;
  
  // Headers for additional metadata
  map<string, string> headers = 12;
  
  // Tracing context for distributed tracing
  TracingContext tracing = 13;
}

// Routing information for the message
message RoutingMetadata {
  // Target topic/stream
  string topic = 1;
  
  // Partition key for ordering
  string partition_key = 2;
  
  // Priority level (0-9, 0 highest)
  int32 priority = 3;
  
  // TTL in seconds (0 = no expiry)
  int64 ttl_seconds = 4;
  
  // Routing tags for filtering
  repeated string tags = 5;
  
  // Retry policy
  RetryPolicy retry_policy = 6;
}

// Data quality indicators
message QualityMetadata {
  // Completeness score (0-100)
  float completeness = 1;
  
  // Timeliness in milliseconds
  int64 latency_ms = 2;
  
  // Data validation status
  ValidationStatus validation_status = 3;
  
  // Quality score (0-100)
  float quality_score = 4;
  
  // Anomaly indicators
  repeated AnomalyIndicator anomalies = 5;
}

enum ValidationStatus {
  VALIDATION_STATUS_UNSPECIFIED = 0;
  VALIDATION_STATUS_PASSED = 1;
  VALIDATION_STATUS_FAILED = 2;
  VALIDATION_STATUS_PARTIAL = 3;
  VALIDATION_STATUS_SKIPPED = 4;
}

message AnomalyIndicator {
  string type = 1;
  float severity = 2;
  string description = 3;
}

// Retry configuration
message RetryPolicy {
  int32 max_attempts = 1;
  int64 initial_delay_ms = 2;
  float backoff_multiplier = 3;
  int64 max_delay_ms = 4;
  repeated string retryable_errors = 5;
}

// Distributed tracing context
message TracingContext {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  map<string, string> baggage = 4;
}

// Batch ingestion request
message BatchIngestionRequest {
  repeated EventEnvelope events = 1;
  string batch_id = 2;
  IngestOptions options = 3;
}

// Ingestion options
message IngestOptions {
  bool validate_schema = 1;
  bool async_mode = 2;
  bool enable_dedup = 3;
  int32 batch_size = 4;
  int64 timeout_ms = 5;
}

// Ingestion response
message IngestionResponse {
  string request_id = 1;
  bool success = 2;
  repeated IngestionResult results = 3;
  IngestionMetrics metrics = 4;
}

message IngestionResult {
  string message_id = 1;
  bool accepted = 2;
  string error_code = 3;
  string error_message = 4;
  string assigned_partition = 5;
  int64 offset = 6;
}

message IngestionMetrics {
  int32 total_received = 1;
  int32 total_accepted = 2;
  int32 total_rejected = 3;
  int64 processing_time_ms = 4;
  float throughput_mps = 5;
}

// Error handling
message IngestionError {
  string code = 1;
  string message = 2;
  string details = 3;
  google.protobuf.Timestamp timestamp = 4;
  map<string, string> context = 5;
  bool retryable = 6;
}

// Backpressure signals
message BackpressureSignal {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_NORMAL = 1;
    LEVEL_WARNING = 2;
    LEVEL_CRITICAL = 3;
    LEVEL_EMERGENCY = 4;
  }
  
  Level level = 1;
  float utilization = 2;
  int64 queue_depth = 3;
  int64 recommended_delay_ms = 4;
  string reason = 5;
}

// Stream routing rules
message StreamRoutingRule {
  string rule_id = 1;
  string name = 2;
  
  // Matching criteria
  message Criteria {
    string domain = 1;
    string event_type = 2;
    map<string, string> headers = 3;
    string payload_filter = 4; // JSONPath or similar
  }
  Criteria match = 3;
  
  // Routing actions
  message Action {
    string target_topic = 1;
    string transformation = 2;
    map<string, string> add_headers = 3;
    int32 priority_override = 4;
  }
  repeated Action actions = 4;
  
  bool enabled = 5;
  int32 order = 6;
}

// Service definition
service IngestionService {
  // Single event ingestion
  rpc Ingest(EventEnvelope) returns (IngestionResponse);
  
  // Batch ingestion
  rpc IngestBatch(BatchIngestionRequest) returns (IngestionResponse);
  
  // Streaming ingestion
  rpc IngestStream(stream EventEnvelope) returns (stream IngestionResponse);
  
  // Get backpressure status
  rpc GetBackpressure(google.protobuf.Empty) returns (BackpressureSignal);
  
  // Manage routing rules
  rpc UpdateRoutingRules(stream StreamRoutingRule) returns (google.protobuf.Empty);
}

// Schema validation service
service SchemaValidationService {
  // Validate a message against its schema
  rpc Validate(EventEnvelope) returns (ValidationResponse);
  
  // Batch validation
  rpc ValidateBatch(BatchValidationRequest) returns (BatchValidationResponse);
}

message ValidationResponse {
  bool valid = 1;
  repeated ValidationError errors = 2;
  repeated ValidationWarning warnings = 3;
}

message ValidationError {
  string field = 1;
  string error = 2;
  string expected = 3;
  string actual = 4;
}

message ValidationWarning {
  string field = 1;
  string warning = 2;
}

message BatchValidationRequest {
  repeated EventEnvelope events = 1;
}

message BatchValidationResponse {
  map<string, ValidationResponse> results = 1;
}