groups:
  - name: data_ingestion_alerts
    interval: 30s
    rules:
      # Service Health Alerts
      - alert: DataIngestionServiceDown
        expr: up{job="data-ingestion"} == 0
        for: 2m
        labels:
          severity: critical
          component: data-ingestion
        annotations:
          summary: "Data ingestion service is down"
          description: "The data ingestion service has been down for more than 2 minutes."
          
      - alert: DataIngestionProviderDown
        expr: up{job="data-ingestion-provider"} == 0
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
          provider: "{{ $labels.provider }}"
        annotations:
          summary: "Provider {{ $labels.provider }} is down"
          description: "The data provider {{ $labels.provider }} has been down for more than 5 minutes."

      # Error Rate Alerts
      - alert: DataIngestionHighErrorRate
        expr: |
          (sum(rate(data_ingestion_errors_total[5m])) / sum(rate(data_ingestion_total_requests[5m]))) > 0.05
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
        annotations:
          summary: "High error rate in data ingestion"
          description: "Error rate is above 5% (current: {{ $value | humanizePercentage }})"
          
      - alert: DataIngestionCriticalErrorRate
        expr: |
          (sum(rate(data_ingestion_errors_total[5m])) / sum(rate(data_ingestion_total_requests[5m]))) > 0.10
        for: 2m
        labels:
          severity: critical
          component: data-ingestion
        annotations:
          summary: "Critical error rate in data ingestion"
          description: "Error rate is above 10% (current: {{ $value | humanizePercentage }})"

      - alert: ProviderHighErrorRate
        expr: |
          (sum by (provider) (rate(data_ingestion_provider_errors_total[5m])) 
           / sum by (provider) (rate(data_ingestion_provider_requests_total[5m]))) > 0.10
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
          provider: "{{ $labels.provider }}"
        annotations:
          summary: "High error rate for provider {{ $labels.provider }}"
          description: "Provider {{ $labels.provider }} error rate is above 10% (current: {{ $value | humanizePercentage }})"

      # Performance Alerts
      - alert: DataIngestionHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(data_ingestion_request_duration_bucket[5m])) by (le)) > 1000
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
        annotations:
          summary: "High request latency detected"
          description: "95th percentile latency is above 1s (current: {{ $value | humanizeDuration }})"
          
      - alert: DataIngestionCriticalLatency
        expr: |
          histogram_quantile(0.99, sum(rate(data_ingestion_request_duration_bucket[5m])) by (le)) > 5000
        for: 3m
        labels:
          severity: critical
          component: data-ingestion
        annotations:
          summary: "Critical request latency detected"
          description: "99th percentile latency is above 5s (current: {{ $value | humanizeDuration }})"

      - alert: ProviderSlowResponse
        expr: |
          histogram_quantile(0.95, sum by (provider, le) (rate(data_ingestion_provider_request_duration_bucket[5m]))) > 2000
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
          provider: "{{ $labels.provider }}"
        annotations:
          summary: "Provider {{ $labels.provider }} responding slowly"
          description: "Provider {{ $labels.provider }} p95 latency is above 2s (current: {{ $value | humanizeDuration }})"

      # Throughput Alerts
      - alert: DataIngestionLowThroughput
        expr: sum(rate(data_ingestion_total_requests[5m])) < 10
        for: 10m
        labels:
          severity: warning
          component: data-ingestion
        annotations:
          summary: "Low data ingestion throughput"
          description: "Throughput is below 10 requests/sec (current: {{ $value | humanize }} req/s)"
          
      - alert: DataIngestionNoActivity
        expr: sum(rate(data_ingestion_total_requests[5m])) == 0
        for: 5m
        labels:
          severity: critical
          component: data-ingestion
        annotations:
          summary: "No data ingestion activity"
          description: "No requests processed in the last 5 minutes"

      # Pipeline Stage Alerts
      - alert: PipelineStageSlow
        expr: |
          histogram_quantile(0.99, sum by (stage, le) (rate(data_ingestion_pipeline_stage_duration_bucket[5m]))) > 3000
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
          stage: "{{ $labels.stage }}"
        annotations:
          summary: "Pipeline stage {{ $labels.stage }} is slow"
          description: "Stage {{ $labels.stage }} p99 latency is above 3s (current: {{ $value | humanizeDuration }})"
          
      - alert: PipelineStageBlocked
        expr: |
          sum by (stage) (rate(data_ingestion_pipeline_stage_total[5m])) == 0
          and sum(rate(data_ingestion_total_requests[5m])) > 0
        for: 5m
        labels:
          severity: critical
          component: data-ingestion
          stage: "{{ $labels.stage }}"
        annotations:
          summary: "Pipeline stage {{ $labels.stage }} is blocked"
          description: "Stage {{ $labels.stage }} is not processing any data while service is active"

      # Data Freshness Alerts
      - alert: StaleSymbolData
        expr: (time() - data_ingestion_last_update_timestamp) > 300
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
          symbol: "{{ $labels.symbol }}"
        annotations:
          summary: "Stale data for symbol {{ $labels.symbol }}"
          description: "Symbol {{ $labels.symbol }} has not been updated for {{ $value | humanizeDuration }}"
          
      - alert: CriticallyStaleSymbolData
        expr: (time() - data_ingestion_last_update_timestamp) > 900
        for: 2m
        labels:
          severity: critical
          component: data-ingestion
          symbol: "{{ $labels.symbol }}"
        annotations:
          summary: "Critically stale data for symbol {{ $labels.symbol }}"
          description: "Symbol {{ $labels.symbol }} has not been updated for {{ $value | humanizeDuration }}"

      - alert: LowDataFreshness
        expr: |
          (count(data_ingestion_symbol_data_fresh{fresh="true"}) / count(data_ingestion_active_symbols)) < 0.90
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
        annotations:
          summary: "Low overall data freshness"
          description: "Less than 90% of symbols have fresh data (current: {{ $value | humanizePercentage }})"

      # Resource Alerts
      - alert: HighMemoryUsage
        expr: |
          (process_resident_memory_bytes{job="data-ingestion"} / 1024 / 1024 / 1024) > 4
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
        annotations:
          summary: "High memory usage in data ingestion service"
          description: "Memory usage is above 4GB (current: {{ $value | humanize }}GB)"
          
      - alert: HighCPUUsage
        expr: |
          rate(process_cpu_seconds_total{job="data-ingestion"}[5m]) > 0.80
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
        annotations:
          summary: "High CPU usage in data ingestion service"
          description: "CPU usage is above 80% (current: {{ $value | humanizePercentage }})"

      # Connection Pool Alerts
      - alert: ConnectionPoolExhausted
        expr: data_ingestion_connection_pool_available == 0
        for: 2m
        labels:
          severity: critical
          component: data-ingestion
        annotations:
          summary: "Connection pool exhausted"
          description: "No available connections in the pool"
          
      - alert: ConnectionPoolLow
        expr: |
          (data_ingestion_connection_pool_available / data_ingestion_connection_pool_size) < 0.2
        for: 5m
        labels:
          severity: warning
          component: data-ingestion
        annotations:
          summary: "Low available connections"
          description: "Less than 20% of connections available ({{ $value | humanizePercentage }})"

  - name: data_ingestion_recording_rules
    interval: 30s
    rules:
      # Pre-computed error rates
      - record: data_ingestion:error_rate:5m
        expr: |
          sum(rate(data_ingestion_errors_total[5m])) / sum(rate(data_ingestion_total_requests[5m]))
          
      - record: data_ingestion:provider_error_rate:5m
        expr: |
          sum by (provider) (rate(data_ingestion_provider_errors_total[5m])) 
          / sum by (provider) (rate(data_ingestion_provider_requests_total[5m]))
          
      # Pre-computed latency percentiles
      - record: data_ingestion:latency_p50:5m
        expr: |
          histogram_quantile(0.50, sum(rate(data_ingestion_request_duration_bucket[5m])) by (le))
          
      - record: data_ingestion:latency_p95:5m
        expr: |
          histogram_quantile(0.95, sum(rate(data_ingestion_request_duration_bucket[5m])) by (le))
          
      - record: data_ingestion:latency_p99:5m
        expr: |
          histogram_quantile(0.99, sum(rate(data_ingestion_request_duration_bucket[5m])) by (le))
          
      # Pre-computed throughput
      - record: data_ingestion:throughput:5m
        expr: sum(rate(data_ingestion_total_requests[5m]))
        
      - record: data_ingestion:provider_throughput:5m
        expr: sum by (provider) (rate(data_ingestion_provider_requests_total[5m]))
        
      # Data freshness metrics
      - record: data_ingestion:data_freshness_percentage
        expr: |
          count(data_ingestion_symbol_data_fresh{fresh="true"}) / count(data_ingestion_active_symbols) * 100
          
      - record: data_ingestion:stale_symbols_count
        expr: |
          count((time() - data_ingestion_last_update_timestamp) > 300)