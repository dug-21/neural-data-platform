version: '3.8'

services:
  # TimescaleDB for time-series data
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neural_trader}
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d neural_trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for real-time data and caching
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Data ingestion service
  data-ingestion:
    build: .
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database configuration
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DATABASE: ${POSTGRES_DB:-neural_trader}
      TIMESCALE_USER: ${POSTGRES_USER:-trader}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD}
      
      # Redis configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # API Keys (must be set as environment variables)
      IEX_CLOUD_API_KEY: ${IEX_CLOUD_API_KEY}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET}
      QUANDL_API_KEY: ${QUANDL_API_KEY}
      NEWSAPI_KEY: ${NEWSAPI_KEY}
      YAHOO_API_KEY: ${YAHOO_API_KEY}
      NASDAQ_API_KEY: ${NASDAQ_API_KEY}
      
      # Rate limit overrides (optional)
      RATE_LIMIT_ALPHA_VANTAGE_CALLS_PER_MINUTE: ${RATE_LIMIT_ALPHA_VANTAGE_CALLS_PER_MINUTE}
      RATE_LIMIT_ALPHA_VANTAGE_CALLS_PER_DAY: ${RATE_LIMIT_ALPHA_VANTAGE_CALLS_PER_DAY}
      
      # Service configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROMETHEUS_ENABLED: "true"
      PROMETHEUS_PORT: 9090
    ports:
      - "9090:9090"  # Prometheus metrics
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    command: >
      python -m data_ingestion.main start
      --providers yahoo_finance finnhub
      --symbols AAPL GOOGL MSFT AMZN TSLA
      --realtime
      --batch

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - data-ingestion
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
      - timescaledb
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"

volumes:
  timescale_data:
  redis_data:
  prometheus_data:
  grafana_data: