[tool:pytest]
# Pytest configuration for backfill tests

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests that test multiple components together
    performance: Performance and load testing
    slow: Tests that take a long time to run
    stress: Stress tests that push system limits
    unit: Unit tests for individual components
    cli: CLI interface tests
    validation: Data validation tests
    timezone: Timezone handling tests
    fileformat: File format processing tests

# Test execution options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --color=yes
    --durations=10
    --maxfail=10

# Async test configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = 
    utils/file_backfill.py
    cli/backfill.py
    providers/historical_backfill.py

omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = True
precision = 2
skip_covered = False

[coverage:html]
directory = htmlcov
title = Backfill Test Coverage Report

[coverage:xml]
output = coverage.xml