global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'data-ingestion'
    static_configs:
      - targets: ['data-ingestion:9090']
    metrics_path: '/metrics'
    
  - job_name: 'timescaledb'
    static_configs:
      - targets: ['timescaledb:9187']
    
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']