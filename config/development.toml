# Development Configuration for Neural Trader Autonomous Platform
# This configuration is optimized for local development with:
# - Relaxed security settings for easier debugging
# - Verbose logging for development insights
# - Local database and caching setup
# - Development-friendly timeouts and limits

[platform]
name = "neural-trader-autonomous-dev"
version = "0.1.0"
environment = "development"
log_level = "debug"

[database]
# Development database without SSL requirements
url = "postgres://neural_trader:neural_trader_pass@localhost:5432/neural_trader_dev"
max_connections = 10
min_connections = 2
# Shorter timeouts for faster development feedback
connection_timeout = 10
idle_timeout = 300
max_query_time = 30

[redis]
# Development Redis without authentication
url = "redis://localhost:6379/1"
max_connections = 5
default_ttl_seconds = 1800
connection_timeout_ms = 2000
cluster_mode = false
pool_max_idle = 3
pool_timeout_seconds = 10

[neural]
# Development neural network configuration with reduced resources
memory_gb = 1.0
models = ["NHITS", "DeepAR", "TCN", "MLP"]
prediction_cache_ttl = 300
model_load_timeout = 120
max_concurrent_predictions = 10
enable_model_monitoring = true
accuracy_threshold = 0.75

[monitoring]
# Relaxed monitoring for development
metrics_interval_secs = 60
quality_threshold = 0.85
enable_performance_metrics = true
enable_memory_monitoring = true
enable_error_monitoring = true
# Higher thresholds for development environment
cpu_usage_threshold = 95.0
memory_usage_threshold = 95.0
error_rate_threshold = 0.1
prometheus_port = 8081
prometheus_path = "/metrics"

[logging]
# Verbose logging for development
level = "debug"
format = "pretty"  # Human-readable format for development
enable_file_logging = false
async_logging = false
filter_sensitive_data = false  # Show all data in development

[security]
# Relaxed security settings for development
enable_tls = false
# Higher rate limits for development testing
rate_limit_requests_per_minute = 10000
rate_limit_burst = 1000
request_timeout_seconds = 60
enable_cors = true
allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8080"]
enable_request_validation = true
max_request_body_mb = 50

[performance]
# Development performance settings
worker_threads = 4
async_queue_size = 1000
tcp_keepalive = true
tcp_keepalive_time = 3600
tcp_keepalive_interval = 60
tcp_keepalive_probes = 6
enable_memory_compaction = false
gc_interval_minutes = 60

[alerts]
# Disabled alerts for development
enable_email_alerts = false
enable_slack_alerts = false
enable_pagerduty = false

[backup]
# Minimal backup for development
enable_automatic_backup = false
backup_interval_hours = 24
backup_retention_days = 7
backup_storage_path = "./backups"
enable_cloud_backup = false

[circuit_breaker]
# More lenient circuit breaker for development
enable_circuit_breaker = true
failure_threshold = 10
recovery_timeout_seconds = 30
half_open_max_calls = 5

[graceful_shutdown]
# Quick shutdown for development
shutdown_timeout_seconds = 10
enable_graceful_shutdown = true
drain_timeout_seconds = 5

[development]
# Development-specific settings
enable_hot_reload = true
enable_debug_endpoints = true
mock_external_services = true
enable_test_data_generation = true
enable_profiling = true
# Development database seeding
seed_test_data = true
reset_database_on_startup = false