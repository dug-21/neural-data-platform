[server]
http_port = 3000

[security]
admin_user = admin
admin_password = admin
disable_initial_admin_creation = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Editor

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/indoor-air-quality.json

[plugins]
allow_loading_unsigned_plugins = motherduck-duckdb-datasource

[log]
mode = console
level = info
