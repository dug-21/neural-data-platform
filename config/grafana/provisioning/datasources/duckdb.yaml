apiVersion: 1

# Delete any existing datasource with this UID first
deleteDatasources:
  - name: NDP-DuckDB
    orgId: 1
  - name: NDP-SQLite
    orgId: 1

datasources:
  - name: NDP-DuckDB
    type: motherduck-duckdb-datasource
    uid: duckdb-ndp
    orgId: 1
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      # Use in-memory DuckDB - dashboards query Parquet files directly via read_parquet()
      path: ":memory:"
