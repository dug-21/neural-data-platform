apiVersion: 1

# NDP-TimescaleDB datasource for Gold layer dashboards
# This datasource provides access to Gold layer continuous aggregates
# Configured per SPEC-E03: Gold Layer Dashboard

datasources:
  - name: NDP-TimescaleDB
    uid: ndp-timescaledb
    type: postgres
    url: timescaledb:5432
    database: ndp
    user: grafana_reader
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ndp
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: true
    isDefault: false
    editable: false
