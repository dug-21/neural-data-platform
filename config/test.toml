[platform]
name = "test-platform"
version = "0.1.0"

[database]
url = "postgres://test@localhost/neural_trader_test"
max_connections = 20
min_connections = 5

[redis]
url = "redis://localhost:6379"
max_connections = 10
default_ttl_seconds = 300

[neural]
memory_gb = 4.0
models = ["NHITS", "DeepAR", "TCN", "MLP"]
prediction_cache_ttl = 600

[monitoring]
metrics_interval_secs = 30
quality_threshold = 0.95