# Prometheus Configuration for Neural Air Quality Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'neural-air-quality'
    environment: 'development'

# Scrape configurations
scrape_configs:
  # Air Quality Application metrics
  - job_name: 'air-quality-app'
    static_configs:
      - targets: ['air-quality-app:9090']
        labels:
          service: 'air-quality-app'
          component: 'main'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'

  # Optional: Mosquitto MQTT Broker (if metrics enabled)
  # - job_name: 'mosquitto'
  #   static_configs:
  #     - targets: ['mosquitto:9091']
  #       labels:
  #         service: 'mosquitto'
  #         component: 'mqtt'

# Alerting (optional - requires Alertmanager)
