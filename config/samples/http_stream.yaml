#         auth_key: appid
#         auth_value: "${OPENWEATHERMAP_API_KEY}"
#     parser:
#       # ... parser config

# =============================================================================
# AUTHENTICATION EXAMPLES
# =============================================================================
# Different APIs use different auth methods. Examples:
#
# Query Parameter (OpenWeatherMap):
#   auth_type: query_param
#   auth_key: appid
#   auth_value: "${OPENWEATHERMAP_API_KEY}"
#
# Bearer Token:
#   auth_type: bearer
#   auth_value: "${API_TOKEN}"
#
# Basic Auth:
#   auth_type: basic
#   auth_user: "${API_USER}"
#   auth_pass: "${API_PASS}"
#
# Header:
#   auth_type: header
#   auth_key: X-API-Key
#   auth_value: "${API_KEY}"
#
# Environment variables (${VAR_NAME}) are resolved at runtime.
