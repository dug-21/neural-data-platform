# Config Store Service Definition
# Extends the main docker-compose with config-store specific configuration

version: '3.8'

services:
  config-store:
    image: neural-trader/config-store:${TAG:-latest}
    build:
      context: ..
      dockerfile: ./docker/base/Dockerfile.config-store
      target: ${BUILD_TARGET:-production}
      args:
        - RUST_VERSION=1.75
    container_name: neural-trader-config-store
    hostname: config-store
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Redis Configuration
      REDIS_URL: redis://redis:6379
      REDIS_DB: 0
      REDIS_POOL_SIZE: 10
      
      # Service Configuration  
      BIND_ADDRESS: 0.0.0.0:8003
      METRICS_ADDRESS: 0.0.0.0:9094
      RUST_LOG: ${LOG_LEVEL:-info}
      
      # Config Store Settings
      CONFIG_NAMESPACE: neural-platform
      ENABLE_HOT_RELOAD: true
      CACHE_TTL_SECONDS: 300
      VALIDATION_MODE: strict
      
      # Schema Registry
      SCHEMA_REGISTRY_ENABLED: true
      SCHEMA_VALIDATION_STRICT: true
      
      # Monitoring
      METRICS_ENABLED: true
      HEALTH_CHECK_ENABLED: true
      AUDIT_LOG_ENABLED: true
      
      # Performance Tuning
      MAX_CONCURRENT_REQUESTS: 100
      REQUEST_TIMEOUT_SECONDS: 30
      BATCH_UPDATE_SIZE: 100
      
    volumes:
      # Configuration seed data
      - ../config:/opt/config-store/config:ro
      
      # Log output
      - config_store_logs:/var/log/config-store:rw
      
      # Optional: Custom schemas
      - ../schemas:/opt/config-store/schemas:ro
      
    networks:
      backend:
        ipv4_address: 172.21.0.12
      monitoring:
        ipv4_address: 172.22.0.12
        
    ports:
      - "127.0.0.1:8003:8003"  # gRPC API
      - "127.0.0.1:9094:9094"  # Metrics endpoint
      
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      placement:
        constraints:
          - node.labels.tier != gpu
          
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:8003"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    security_opt:
      - no-new-privileges:true
      
    cap_drop:
      - ALL
      
    read_only: true
    
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
      
    labels:
      - "neural-trader.service.type=config-store"
      - "neural-trader.service.tier=data"
      - "neural-trader.config.namespace=neural-platform"
      - "prometheus.scrape=true"
      - "prometheus.port=9094"
      - "prometheus.path=/metrics"

volumes:
  config_store_logs:
    driver: local
    labels:
      - "neural-trader.volume.type=logs"
      - "neural-trader.service=config-store"

# Extension for development environment
x-config-store-dev: &config-store-dev
  environment:
    RUST_LOG: debug
    VALIDATION_MODE: permissive
    HOT_RELOAD_INTERVAL_SECONDS: 10
    ENABLE_DEBUG_ENDPOINTS: true
  volumes:
    # Mount source code for development
    - ../src/config-store:/app/src/config-store:rw
  command: ["cargo", "run", "--bin", "config-store"]

# Extension for testing environment
x-config-store-test: &config-store-test
  environment:
    RUST_LOG: trace
    VALIDATION_MODE: strict
    ENABLE_CHAOS_TESTING: true
    TEST_MODE: true
  healthcheck:
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s