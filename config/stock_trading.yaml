# Stock Trading Configuration
# Optimized for US Stock Market Day Trading

system:
  mode: production
  environment: stock_day_trading
  log_level: info
  performance_tracking: true

# Trading Configuration for Stocks
trading:
  style: "day_trading"
  
  # Stock Symbols Configuration
  symbols: 
    primary: ["AAPL", "MSFT", "GOOGL", "AMZN"]      # Tech giants
    secondary: ["SPY", "QQQ", "TSLA", "NVDA"]       # ETFs and high volatility
    watchlist: ["META", "NFLX", "AMD", "CRM"]       # Additional opportunities
    max_correlation: 0.6                              # Avoid correlated trades
  
  # Market Hours (US Eastern Time)
  trading_hours:
    pre_market_start: "04:00"    # Pre-market begins
    market_open: "09:30"         # Regular market open
    market_close: "16:00"        # Regular market close
    after_hours_end: "20:00"     # After-hours end
    
    # Trading windows
    active_start: "09:35"        # Start 5 min after open (avoid volatility)
    active_end: "15:45"          # End 15 min before close
    avoid_lunch: true            # Avoid 12:00-13:00 (lower volume)
    
  # Stock-Specific Risk Management
  risk_management:
    risk_per_trade: 0.01         # 1% risk per trade
    daily_loss_limit: 0.03       # 3% daily stop
    profit_target: 0.02          # 2% daily profit target
    
    # Position sizing for $10,000 account
    position_limits:
      max_position_value: 2500   # Max $2,500 per position (25%)
      min_position_value: 500    # Min $500 per position
      max_positions: 4           # Max 4 concurrent positions
      
    # Stock-specific filters
    price_filters:
      min_price: 10.0            # Avoid penny stocks
      max_price: 1000.0          # Avoid extremely high-priced stocks
      min_volume: 1000000        # Min 1M daily volume
      min_avg_volume: 500000     # Min 500K average volume
      
  # Order Configuration for Stocks
  orders:
    default_type: "limit"
    time_in_force: "DAY"         # Day orders for stocks
    extended_hours: false        # Regular hours only by default
    
    # Execution settings
    limit_offset_pct: 0.0005     # 0.05% from mid price
    stop_offset_pct: 0.02        # 2% stop loss
    take_profit_pct: 0.03        # 3% take profit
    
    # Slippage protection
    max_slippage_pct: 0.001      # 0.1% max slippage
    partial_fills: true
    min_fill_size: 100           # Minimum 100 shares

# Data Provider Configuration
data:
  primary_provider: "finnhub"    # Best free tier for stocks
  fallback_providers: ["alpha_vantage", "iex_cloud"]
  
  # Provider-specific settings
  finnhub:
    use_websocket: true
    symbols_per_connection: 50
    
  alpha_vantage:
    interval: "1min"
    outputsize: "full"
    
  iex_cloud:
    use_sandbox: false           # Use real data
    data_points: ["quote", "trades", "book"]

# Stock-Specific Indicators
indicators:
  # Volume indicators (important for stocks)
  volume:
    - name: "VWAP"
      period: 0                  # Session-based
      weight: 0.3
    - name: "OBV"
      period: 20
      weight: 0.2
      
  # Momentum indicators
  momentum:
    - name: "RSI"
      period: 14
      overbought: 70
      oversold: 30
    - name: "MACD"
      fast: 12
      slow: 26
      signal: 9
      
  # Volatility indicators
  volatility:
    - name: "ATR"
      period: 14
      multiplier: 2.0
    - name: "Bollinger_Bands"
      period: 20
      std_dev: 2.0

# Sector Rotation Strategy
sector_rotation:
  enabled: true
  sectors:
    technology: ["AAPL", "MSFT", "GOOGL", "META", "NVDA"]
    financials: ["JPM", "BAC", "GS", "MS", "WFC"]
    healthcare: ["JNJ", "UNH", "PFE", "CVS", "ABBV"]
    consumer: ["AMZN", "TSLA", "HD", "NKE", "SBUX"]
    energy: ["XOM", "CVX", "COP", "SLB", "OXY"]
  
  rotation_rules:
    momentum_threshold: 0.02     # 2% sector momentum
    rebalance_frequency: "weekly"
    max_sector_allocation: 0.4   # 40% max in one sector

# Paper Trading Settings
paper_trading:
  initial_capital: 10000.00
  commission_per_share: 0.005   # $0.005 per share
  min_commission: 1.00           # $1 minimum
  
  # Realistic stock market simulation
  market_impact:
    enabled: true
    impact_factor: 0.0001        # 0.01% per $1000 traded
    
  spread_simulation:
    enabled: true
    min_spread: 0.01             # $0.01 minimum spread
    spread_factor: 0.0002        # 0.02% of price