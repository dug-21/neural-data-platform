# Air Quality Service Configuration
# Base configuration (all environments)

server:
  host: "0.0.0.0"
  port: 8080
  graceful_shutdown_timeout_secs: 30

mqtt:
  broker_url: "mosquitto"
  port: 1883
  client_id: "air-quality-app"
  topic_pattern: "airgradient/readings/+"
  qos: 1
  reconnect_delay_secs: 1
  max_reconnect_delay_secs: 30
  buffer_capacity: 1000

storage:
  base_path: "/app/data"
  wal_enabled: true
  batch_size: 100
  batch_timeout_secs: 5

api:
  cors_enabled: true
  rate_limit_per_second: 100

logging:
  level: "info"
  format: "json"

alerts:
  enabled: true
  check_interval_secs: 60
  pm25_warning_threshold: 35.0
  pm25_danger_threshold: 55.0
  co2_warning_threshold: 1000
  co2_danger_threshold: 2000
