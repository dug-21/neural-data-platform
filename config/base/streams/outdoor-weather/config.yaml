stream_id: outdoor-weather
description: Outdoor weather data from OpenWeatherMap Current Weather API
version: "1.0.0"
enabled: true
retention_days: 90
compression_after_days: 7
partitioning_strategy: daily

fields:
  - name: temperature
    type: float
    nullable: false
    unit: celsius
    range: [-50.0, 60.0]
  - name: feels_like
    type: float
    nullable: true
    unit: celsius
    range: [-50.0, 60.0]
  - name: pressure
    type: float
    nullable: true
    unit: hpa
    range: [800.0, 1200.0]
  - name: humidity
    type: float
    nullable: true
    unit: percent
    range: [0.0, 100.0]
  - name: wind_speed
    type: float
    nullable: true
    unit: m/s
    range: [0.0, 100.0]
  - name: wind_deg
    type: float
    nullable: true
    unit: degrees
    range: [0.0, 360.0]
  - name: wind_gust
    type: float
    nullable: true
    unit: m/s
    range: [0.0, 150.0]
  - name: clouds
    type: float
    nullable: true
    unit: percent
    range: [0.0, 100.0]
  - name: visibility
    type: float
    nullable: true
    unit: meters
    range: [0.0, 50000.0]
  - name: rain_1h
    type: float
    nullable: true
    unit: mm
    range: [0.0, 500.0]
  - name: snow_1h
    type: float
    nullable: true
    unit: mm
    range: [0.0, 500.0]

sources:
  - type: http_poll
    enabled: true
    poll_interval_secs: 600
    timeout_secs: 30
    parser_name: openweathermap_current_weather
    endpoints:
      - endpoint_id: openweathermap_weather
        location_id: home
        lat: 29.95838
        lon: -81.30878
        url: "https://api.openweathermap.org/data/2.5/weather?lat=29.95838&lon=-81.30878&units=metric"
        auth_type: query_param
        auth_key: appid
        auth_value: "${OPENWEATHERMAP_API_KEY}"
    parser:
      parser_type: json_path
      location_id_field: name
      default_location_id: "${OWM_LOCATION_NAME}"
      default_tags:
        source: openweathermap
        api: current_weather
        stream_id: outdoor-weather
      field_mappings:
        - path: main.temp
          metric_name: temperature
          unit: celsius
        - path: main.feels_like
          metric_name: feels_like
          unit: celsius
        - path: main.pressure
          metric_name: pressure
          unit: hpa
        - path: main.humidity
          metric_name: humidity
          unit: percent
        - path: wind.speed
          metric_name: wind_speed
          unit: m/s
        - path: wind.deg
          metric_name: wind_deg
          unit: degrees
        - path: wind.gust
          metric_name: wind_gust
          unit: m/s
        - path: clouds.all
          metric_name: clouds
          unit: percent
        - path: visibility
          metric_name: visibility
          unit: meters

storage:
  batch_size: 50
  batch_timeout_secs: 30
  buffer_capacity: 500
