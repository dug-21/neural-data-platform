stream_id: nws-observations
description: Real-time weather observations from NWS station KSGJ
version: "1.0.0"
enabled: true
retention_days: 365
compression_after_days: 7
partitioning_strategy: daily

fields:
  - name: temperature
    type: float
    nullable: true
    unit: celsius
    range: [-50.0, 60.0]
    description: "Ambient air temperature"
  - name: dewpoint
    type: float
    nullable: true
    unit: celsius
    range: [-50.0, 60.0]
    description: "Dew point temperature"
  - name: wind_direction
    type: float
    nullable: true
    unit: degrees
    range: [0.0, 360.0]
    description: "Wind direction in degrees from north"
  - name: wind_speed
    type: float
    nullable: true
    unit: km/h
    range: [0.0, 300.0]
    description: "Wind speed"
  - name: wind_gust
    type: float
    nullable: true
    unit: km/h
    range: [0.0, 400.0]
    description: "Wind gust speed"
  - name: barometric_pressure
    type: float
    nullable: true
    unit: pa
    range: [80000.0, 110000.0]
    description: "Barometric pressure"
  - name: sea_level_pressure
    type: float
    nullable: true
    unit: pa
    range: [80000.0, 110000.0]
    description: "Sea level pressure"
  - name: visibility
    type: float
    nullable: true
    unit: meters
    range: [0.0, 50000.0]
    description: "Visibility distance"
  - name: max_temperature_24h
    type: float
    nullable: true
    unit: celsius
    range: [-50.0, 60.0]
    description: "Maximum temperature in last 24 hours"
  - name: min_temperature_24h
    type: float
    nullable: true
    unit: celsius
    range: [-50.0, 60.0]
    description: "Minimum temperature in last 24 hours"
  - name: precipitation_1h
    type: float
    nullable: true
    unit: meters
    range: [0.0, 1.0]
    description: "Precipitation in last hour"
  - name: precipitation_3h
    type: float
    nullable: true
    unit: meters
    range: [0.0, 1.0]
    description: "Precipitation in last 3 hours"
  - name: precipitation_6h
    type: float
    nullable: true
    unit: meters
    range: [0.0, 1.0]
    description: "Precipitation in last 6 hours"
  - name: relative_humidity
    type: float
    nullable: true
    unit: percent
    range: [0.0, 100.0]
    description: "Relative humidity"
  - name: wind_chill
    type: float
    nullable: true
    unit: celsius
    range: [-50.0, 60.0]
    description: "Wind chill temperature"
  - name: heat_index
    type: float
    nullable: true
    unit: celsius
    range: [-50.0, 60.0]
    description: "Heat index temperature"

sources:
  - type: http_poll
    enabled: true
    ndp_id: "weather-nws-003"
    context:
      source_type:
        provider: nws
        purpose: current_weather
        grid_office: JAX
        station: ksgj
      location:
        coordinates: [29.95838,-81.30878]
        type: outdoor
        path: beachhouse
    poll_interval_secs: 300  # 5 minutes (NWS updates hourly but we check frequently)
    timeout_secs: 30
    retry_attempts: 3
    retry_delay_secs: 5
    parser_name: nws_observations
    endpoints:
      - endpoint_id: nws_ksgj_observations
        location_id: ksgj
        station_id: KSGJ
        url: "https://api.weather.gov/stations/KSGJ/observations/latest"
        auth_type: none
        headers:
          # NWS requires valid contact info in User-Agent - update YOUR_EMAIL below
          User-Agent: "(neural-data-platform/1.0, something1@gmail.com)"
          Accept: "application/geo+json"
    parser:
      parser_type: json_path
      location_id_field: properties.station
      default_location_id: ksgj
      timestamp_field: properties.timestamp  # Use observation time, not poll time
      timestamp_format: iso8601
      default_tags:
        source: nws
        api: observations
        stream_id: nws-observations
        station_id: KSGJ
      field_mappings:
        - path: properties.temperature.value
          metric_name: temperature
          unit: celsius
        - path: properties.dewpoint.value
          metric_name: dewpoint
          unit: celsius
        - path: properties.windDirection.value
          metric_name: wind_direction
          unit: degrees
        - path: properties.windSpeed.value
          metric_name: wind_speed
          unit: km/h
        - path: properties.windGust.value
          metric_name: wind_gust
          unit: km/h
        - path: properties.barometricPressure.value
          metric_name: barometric_pressure
          unit: pa
        - path: properties.seaLevelPressure.value
          metric_name: sea_level_pressure
          unit: pa
        - path: properties.visibility.value
          metric_name: visibility
          unit: meters
        - path: properties.maxTemperatureLast24Hours.value
          metric_name: max_temperature_24h
          unit: celsius
        - path: properties.minTemperatureLast24Hours.value
          metric_name: min_temperature_24h
          unit: celsius
        - path: properties.precipitationLastHour.value
          metric_name: precipitation_1h
          unit: meters
        - path: properties.precipitationLast3Hours.value
          metric_name: precipitation_3h
          unit: meters
        - path: properties.precipitationLast6Hours.value
          metric_name: precipitation_6h
          unit: meters
        - path: properties.relativeHumidity.value
          metric_name: relative_humidity
          unit: percent
        - path: properties.windChill.value
          metric_name: wind_chill
          unit: celsius
        - path: properties.heatIndex.value
          metric_name: heat_index
          unit: celsius

storage:
  batch_size: 50
  batch_timeout_secs: 30
  buffer_capacity: 500

# Entity schemas for data dictionary (DP-002)
entity_schemas:
  - schema_name: nws-observations
    description: Real-time weather observations from NWS station KSGJ
    attributes:
      - name: temperature
        type: float
        unit: celsius
        description: Ambient air temperature
        nullable: true
        range: [-50, 60]
      - name: dewpoint
        type: float
        unit: celsius
        description: Dew point temperature
        nullable: true
        range: [-50, 60]
      - name: wind_direction
        type: float
        unit: degrees
        description: Wind direction in degrees from north
        nullable: true
        range: [0, 360]
      - name: wind_speed
        type: float
        unit: km/h
        description: Wind speed
        nullable: true
        range: [0, 300]
      - name: wind_gust
        type: float
        unit: km/h
        description: Wind gust speed
        nullable: true
        range: [0, 400]
      - name: barometric_pressure
        type: float
        unit: pa
        description: Barometric pressure
        nullable: true
        range: [80000, 110000]
      - name: sea_level_pressure
        type: float
        unit: pa
        description: Sea level pressure
        nullable: true
        range: [80000, 110000]
      - name: visibility
        type: float
        unit: meters
        description: Visibility distance
        nullable: true
        range: [0, 50000]
      - name: relative_humidity
        type: float
        unit: percent
        description: Relative humidity
        nullable: true
        range: [0, 100]
      - name: precipitation_1h
        type: float
        unit: mm
        description: Precipitation in last hour
        nullable: true
        range: [0, 500]
      - name: heat_index
        type: float
        unit: celsius
        description: Heat index temperature
        nullable: true
        range: [-50, 60]
      - name: wind_chill
        type: float
        unit: celsius
        description: Wind chill temperature
        nullable: true
        range: [-50, 60]

# Silver ETL Configuration (DP-006)
# Transforms Bronze Parquet data to Silver TimescaleDB
# NWS observations use WMO standard SI units - no conversion needed
silver_etl:
  enabled: true
  target_table: silver.nws_observations

  # Timestamp mapping - use observation timestamp from API
  timestamp:
    source_field: timestamp
    target_field: observation_time
    transform: microseconds_to_timestamp

  # Identity fields (used in deduplication)
  identity_fields:
    - source: ndp_id
      target: ndp_id

  # Field mappings - NWS already provides SI units (WMO standard)
  field_mappings:
    - source_path: raw_payload.properties.temperature.value
      target_column: temperature_c
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: -50.0
          max: 60.0
          action: flag

    - source_path: raw_payload.properties.dewpoint.value
      target_column: dewpoint_c
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: -50.0
          max: 60.0
          action: flag

    - source_path: raw_payload.properties.relativeHumidity.value
      target_column: humidity_pct
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 100.0
          action: clamp
          clamp_to_bounds: true

    - source_path: raw_payload.properties.windSpeed.value
      target_column: wind_speed_kmh
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 300.0
          action: flag

    - source_path: raw_payload.properties.windDirection.value
      target_column: wind_direction_deg
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 360.0
          action: clamp
          clamp_to_bounds: true

    - source_path: raw_payload.properties.windGust.value
      target_column: wind_gust_kmh
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 400.0
          action: flag

    - source_path: raw_payload.properties.barometricPressure.value
      target_column: pressure_pa
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 80000.0
          max: 110000.0
          action: flag

    - source_path: raw_payload.properties.visibility.value
      target_column: visibility_m
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 50000.0
          action: flag

    - source_path: raw_payload.properties.heatIndex.value
      target_column: heat_index_c
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: -50.0
          max: 70.0
          action: flag

    - source_path: raw_payload.properties.windChill.value
      target_column: wind_chill_c
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: -70.0
          max: 30.0
          action: flag

  # Additional DQ rules
  dq_rules:
    # Cross-field: wind gust >= wind speed
    - rule: cross_field_check
      name: wind_gust_gte_speed
      expression: "wind_gust_kmh IS NULL OR wind_speed_kmh IS NULL OR wind_gust_kmh >= wind_speed_kmh"
      message: "gust_less_than_sustained"
      action: flag

    # Freshness check - NWS updates hourly
    - rule: freshness_check
      field: observation_time
      max_age: "2 hours"
      max_future: "10 minutes"
      reference: ingestion_time
      action: flag

  # DQ output configuration
  dq_output:
    enabled: true
    target_column: dq_flags

  # Deduplication strategy
  deduplication:
    enabled: true
    key_columns: [observation_time, ndp_id]
    strategy: upsert

  # Incremental processing
  incremental:
    enabled: true
    watermark_column: observation_time
    lag_interval: 5 minutes