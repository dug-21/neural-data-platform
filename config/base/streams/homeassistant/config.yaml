# HomeAssistant Stream Configuration
# HTTP polling for Govee H5103 temperature/humidity sensor via HA REST API
stream_id: homeassistant
description: Home Assistant entity states via REST API polling
version: "2.0.0"
enabled: true
retention_days: 365
compression_after_days: 7
partitioning_strategy: daily

fields:
  - name: temperature
    type: float
    nullable: true
    unit: celsius
    range: [-40.0, 85.0]
  - name: humidity
    type: float
    nullable: true
    unit: percent
    range: [0.0, 100.0]

sources:
  - type: http_poll
    enabled: true
    ndp_id: govee-h5103-560f
    context:
      source_type:
        provider: homeassistant
        purpose: entity_state
      location:
        type: indoor
        path: home
      device:
        manufacturer: govee
        model: H5103
        id: "560f"
    poll_interval_secs: 60
    timeout_secs: 30
    parser_name: homeassistant_entity
    endpoints:
      # Temperature sensor
      - endpoint_id: h5103_temperature
        location_id: h5103-560f
        url: "http://192.168.52.123:8123/api/states/sensor.h5103_560f_temperature"
        auth_type: bearer
        auth_value: "${HASS_ACCESS_TOKEN}"
      # Humidity sensor
      - endpoint_id: h5103_humidity
        location_id: h5103-560f
        url: "http://192.168.52.123:8123/api/states/sensor.h5103_560f_humidity"
        auth_type: bearer
        auth_value: "${HASS_ACCESS_TOKEN}"
    parser:
      parser_type: json_path
      location_id_field: entity_id
      default_location_id: h5103-560f
      default_tags:
        source: homeassistant
        stream_id: homeassistant
        device: govee-h5103-560f
      field_mappings:
        # HA returns state as string "22.5" - JsonPathParser handles string-to-float
        - path: state
          metric_name: value
          unit: dynamic

storage:
  batch_size: 10
  batch_timeout_secs: 30
  buffer_capacity: 100

entity_schemas:
  - schema_name: govee-h5103
    description: Govee H5103 Bluetooth Temperature/Humidity Sensor via Home Assistant
    attributes:
      - name: temperature
        type: float
        unit: celsius
        description: Ambient temperature reading
        nullable: true
        range: [-40, 85]
      - name: humidity
        type: float
        unit: percent
        description: Relative humidity reading
        nullable: true
        range: [0, 100]
