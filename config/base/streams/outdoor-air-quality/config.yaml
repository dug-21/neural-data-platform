stream_id: outdoor-air-quality
description: Outdoor air quality data from OpenWeatherMap Air Pollution API
version: "1.0.0"
enabled: true
retention_days: 90
compression_after_days: 7
partitioning_strategy: daily

fields:
  - name: aqi
    type: float
    nullable: false
    unit: 1-5_scale
    range: [1.0, 5.0]
  - name: co
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 50000.0]
  - name: no
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: no2
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: o3
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: so2
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: pm2_5
    type: float
    nullable: false
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: pm10
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: nh3
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 200.0]

sources:
  - type: http_poll
    enabled: true
    poll_interval_secs: 600
    timeout_secs: 30
    parser_name: openweathermap_air_pollution
    endpoints:
      - endpoint_id: openweathermap_air_pollution
        location_id: home
        lat: 29.95838
        lon: -81.30878
        url: "https://api.openweathermap.org/data/2.5/air_pollution?lat=29.95838&lon=-81.30878"
        auth_type: query_param
        auth_key: appid
        auth_value: "${OPENWEATHERMAP_API_KEY}"
    parser:
      parser_type: json_path
      location_id_field: coord
      default_location_id: "${OWM_LOCATION_NAME}"
      default_tags:
        source: openweathermap
        api: air_pollution
        stream_id: outdoor-air-quality
      field_mappings:
        - path: list[0].main.aqi
          metric_name: aqi
          unit: 1-5_scale
        - path: list[0].components.co
          metric_name: co
          unit: ug/m3
        - path: list[0].components.no
          metric_name: no
          unit: ug/m3
        - path: list[0].components.no2
          metric_name: no2
          unit: ug/m3
        - path: list[0].components.o3
          metric_name: o3
          unit: ug/m3
        - path: list[0].components.so2
          metric_name: so2
          unit: ug/m3
        - path: list[0].components.pm2_5
          metric_name: pm2_5
          unit: ug/m3
        - path: list[0].components.pm10
          metric_name: pm10
          unit: ug/m3
        - path: list[0].components.nh3
          metric_name: nh3
          unit: ug/m3

storage:
  batch_size: 50
  batch_timeout_secs: 30
  buffer_capacity: 500
