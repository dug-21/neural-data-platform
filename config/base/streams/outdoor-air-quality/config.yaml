stream_id: outdoor-air-quality
description: Outdoor air quality data from OpenWeatherMap Air Pollution API
version: "1.0.0"
enabled: true
retention_days: 90
compression_after_days: 7
partitioning_strategy: daily

fields:
  - name: aqi
    type: float
    nullable: false
    unit: 1-5_scale
    range: [1.0, 5.0]
  - name: co
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 50000.0]
  - name: no
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: no2
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: o3
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: so2
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: pm2_5
    type: float
    nullable: false
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: pm10
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 1000.0]
  - name: nh3
    type: float
    nullable: true
    unit: μg/m³
    range: [0.0, 200.0]

sources:
  - type: http_poll
    enabled: true
    ndp_id: "weather-owm-001"
    context:
      source_type:
        provider: openweathermap
        purpose: air_quality
      location:
        coordinates: [29.95838,-81.30878]
        type: outdoor
        path: beachhouse
    poll_interval_secs: 600
    timeout_secs: 30
    parser_name: openweathermap_air_pollution
    endpoints:
      - endpoint_id: openweathermap_air_pollution
        location_id: home
        lat: 29.95838
        lon: -81.30878
        url: "https://api.openweathermap.org/data/2.5/air_pollution?lat=29.95838&lon=-81.30878"
        auth_type: query_param
        auth_key: appid
        auth_value: "${OPENWEATHERMAP_API_KEY}"
    parser:
      parser_type: json_path
      location_id_field: coord
      default_location_id: "${OWM_LOCATION_NAME}"
      default_tags:
        source: openweathermap
        api: air_pollution
        stream_id: outdoor-air-quality
      field_mappings:
        - path: list[0].main.aqi
          metric_name: aqi
          unit: 1-5_scale
        - path: list[0].components.co
          metric_name: co
          unit: ug/m3
        - path: list[0].components.no
          metric_name: no
          unit: ug/m3
        - path: list[0].components.no2
          metric_name: no2
          unit: ug/m3
        - path: list[0].components.o3
          metric_name: o3
          unit: ug/m3
        - path: list[0].components.so2
          metric_name: so2
          unit: ug/m3
        - path: list[0].components.pm2_5
          metric_name: pm2_5
          unit: ug/m3
        - path: list[0].components.pm10
          metric_name: pm10
          unit: ug/m3
        - path: list[0].components.nh3
          metric_name: nh3
          unit: ug/m3

storage:
  batch_size: 50
  batch_timeout_secs: 30
  buffer_capacity: 500

# Entity schemas for data dictionary (DP-002)
entity_schemas:
  - schema_name: airnow
    description: Outdoor air quality data from OpenWeatherMap Air Pollution API
    attributes:
      - name: aqi
        type: float
        unit: 1-5_scale
        description: Air Quality Index (1=Good, 5=Very Poor)
        nullable: false
        range: [1, 5]
      - name: co
        type: float
        unit: ug/m3
        description: Carbon Monoxide concentration
        nullable: true
        range: [0, 50000]
      - name: no
        type: float
        unit: ug/m3
        description: Nitrogen Monoxide concentration
        nullable: true
        range: [0, 1000]
      - name: no2
        type: float
        unit: ug/m3
        description: Nitrogen Dioxide concentration
        nullable: true
        range: [0, 1000]
      - name: o3
        type: float
        unit: ug/m3
        description: Ozone concentration
        nullable: true
        range: [0, 1000]
      - name: so2
        type: float
        unit: ug/m3
        description: Sulfur Dioxide concentration
        nullable: true
        range: [0, 1000]
      - name: pm2_5
        type: float
        unit: ug/m3
        description: Particulate Matter 2.5 micrometers
        nullable: false
        range: [0, 1000]
      - name: pm10
        type: float
        unit: ug/m3
        description: Particulate Matter 10 micrometers
        nullable: true
        range: [0, 1000]
      - name: nh3
        type: float
        unit: ug/m3
        description: Ammonia concentration
        nullable: true
        range: [0, 200]

# Silver ETL Configuration (DP-006)
# Transforms Bronze Parquet data to Silver TimescaleDB
silver_etl:
  enabled: true
  target_table: silver.outdoor_air_quality

  # Timestamp mapping from Bronze to Silver
  timestamp:
    source_field: timestamp
    target_field: observation_time
    transform: microseconds_to_timestamp

  # Identity fields (used in deduplication)
  identity_fields:
    - source: ndp_id
      target: ndp_id

  # Field mappings with transforms and DQ rules
  # OpenWeatherMap uses 1-5 AQI scale (convert to EPA 0-500 scale)
  field_mappings:
    - source_path: raw_payload.list[0].main.aqi
      target_column: aqi_owm
      type: smallint
      nullable: false
      dq_rules:
        - rule: range_check
          min: 1
          max: 5
          action: flag
        - rule: null_check
          action: reject

    - source_path: raw_payload.list[0].main.aqi
      target_column: aqi_epa
      type: smallint
      nullable: true
      transform:
        type: expression
        expression: |
          CASE aqi_owm
            WHEN 1 THEN 25   -- Good (0-50)
            WHEN 2 THEN 75   -- Moderate (51-100)
            WHEN 3 THEN 125  -- Unhealthy for Sensitive (101-150)
            WHEN 4 THEN 175  -- Unhealthy (151-200)
            WHEN 5 THEN 300  -- Very Unhealthy/Hazardous (201-500)
            ELSE NULL
          END

    - source_path: raw_payload.list[0].components.pm2_5
      target_column: pm25
      type: double_precision
      nullable: false
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 1000.0
          action: flag

    - source_path: raw_payload.list[0].components.pm10
      target_column: pm10
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 2000.0
          action: flag

    - source_path: raw_payload.list[0].components.co
      target_column: co_ugm3
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 50000.0
          action: flag

    - source_path: raw_payload.list[0].components.no
      target_column: no_ugm3
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 1000.0
          action: flag

    - source_path: raw_payload.list[0].components.no2
      target_column: no2_ugm3
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 1000.0
          action: flag

    - source_path: raw_payload.list[0].components.o3
      target_column: o3_ugm3
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 1000.0
          action: flag

    - source_path: raw_payload.list[0].components.so2
      target_column: so2_ugm3
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 1000.0
          action: flag

    - source_path: raw_payload.list[0].components.nh3
      target_column: nh3_ugm3
      type: double_precision
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 200.0
          action: flag

  # Additional DQ rules (cross-field, temporal, batch)
  dq_rules:
    # Cross-field validation: PM10 >= PM2.5 (larger particles include smaller)
    - rule: cross_field_check
      name: pm10_gte_pm25
      expression: "pm10 IS NULL OR pm25 IS NULL OR pm10 >= pm25"
      message: "pm10_less_than_pm25"
      action: flag

    # Freshness check
    - rule: freshness_check
      field: observation_time
      max_age: "2 hours"
      max_future: "10 minutes"
      reference: ingestion_time
      action: flag

    # Rate of change for PM2.5 (sudden spikes indicate data issues)
    - rule: rate_of_change
      field: pm25
      max_change_per_minute: 50.0
      partition_by: [ndp_id]
      action: flag

    # Batch-level completeness check
    - rule: completeness_check
      level: batch
      field: pm25
      min_completeness: 0.95
      action: warn

    # Batch-level completeness check for AQI
    - rule: completeness_check
      level: batch
      field: aqi_owm
      min_completeness: 0.98
      action: warn

  # DQ output configuration
  dq_output:
    enabled: true
    target_column: dq_flags
    include_rules: true
    include_values: false
    transparency:
      enabled: true
      table: silver.dq_transparency
      include_sample_payload: true
      max_samples_per_rule: 10

  # Deduplication strategy
  deduplication:
    enabled: true
    key_columns: [observation_time, ndp_id]
    strategy: upsert

  # Incremental processing
  incremental:
    enabled: true
    watermark_column: observation_time
    lag_interval: 5 minutes