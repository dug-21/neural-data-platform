# Air Quality Stream Configuration
# GitOps managed - synced to etcd at /streams/air-quality/*

stream_id: "air-quality"
# FE-001 v11-001: Stream type classification for correlation analysis
# - observation: Continuous numeric readings (PM2.5, temperature, etc.) - this is "effect" data
# - state_event: Binary/discrete state changes - this is "cause" data
# - forecast: Future predictions from external sources - this is "context" data
# - dimension: Slowly changing reference data - this is "metadata"
stream_type: "observation"
description: "AirGradient sensor readings from MQTT"
version: "1.0.0"
enabled: true
retention_days: 365
compression_after_days: 7
partitioning_strategy: "daily"

# Data schema fields
fields:
  pm25:
    type: "float"
    unit: "µg/m³"
    description: "Particulate Matter 2.5 micrometers"
    nullable: false
  pm10:
    type: "float"
    unit: "µg/m³"
    description: "Particulate Matter 10 micrometers"
    nullable: true
  co2:
    type: "int"
    unit: "ppm"
    description: "Carbon Dioxide concentration"
    nullable: true
  temperature:
    type: "float"
    unit: "celsius"
    description: "Ambient temperature"
    nullable: true
  humidity:
    type: "float"
    unit: "percent"
    description: "Relative humidity"
    nullable: true
  tvoc:
    type: "int"
    unit: "ppb"
    description: "Total Volatile Organic Compounds"
    nullable: true
  nox:
    type: "int"
    unit: "ppb"
    description: "Nitrogen Oxides"
    nullable: true

# Data sources configuration (SourceManager format)
# Note: Fields are at source level (flat), not nested under 'params'
sources:
  - type: mqtt
    enabled: true
    ndp_id: "aq_airgradient_1"
    context:
      device_type: airgradient
      location:
        coordinates: [29.95838,-81.30878]
        type: indoor
        path: /beachhouse/livingroom
      environment: indoor
    broker_url: "mosquitto"
    port: 1883
    client_id: "air-quality-app"
    topic_pattern: "airgradient/readings/+"
    qos: 1
    reconnect_delay_secs: 1
    max_reconnect_delay_secs: 30
    buffer_capacity: 1000
    parser:
      parser_type: flat_json
      location_id_field: serialno
      skip_fields:
        - serialno
        - firmware
        - model
        - ledMode
      default_tags:
        source: mqtt
        stream_id: air-quality

# Legacy MQTT configuration (kept for backward compatibility)
mqtt:
  enabled: true
  broker_url: "mosquitto"
  port: 1883
  client_id: "air-quality-app"
  topic_pattern: "airgradient/readings/+"
  qos: 1
  reconnect_delay_secs: 1
  max_reconnect_delay_secs: 30
  buffer_capacity: 1000

# Storage configuration
storage:
  batch_size: 100
  batch_timeout_secs: 5
  buffer_capacity: 1000

# Entity schemas for data dictionary (DP-002)
entity_schemas:
  - schema_name: airgradient
    description: AirGradient indoor air quality sensors (AG One, AG Pro)
    device_class: air_quality
    attributes:
      - name: pm25
        type: float
        unit: ug/m3
        description: Particulate Matter 2.5 micrometers
        nullable: false
        range: [0, 1000]
      - name: pm10
        type: float
        unit: ug/m3
        description: Particulate Matter 10 micrometers
        nullable: true
        range: [0, 1000]
      - name: co2
        type: int
        unit: ppm
        description: Carbon Dioxide concentration
        nullable: true
        range: [400, 10000]
      - name: temperature
        type: float
        unit: celsius
        description: Ambient temperature
        nullable: true
        range: [-40, 85]
      - name: humidity
        type: float
        unit: percent
        description: Relative humidity
        nullable: true
        range: [0, 100]
      - name: tvoc
        type: int
        unit: ppb
        description: Total Volatile Organic Compounds
        nullable: true
        range: [0, 60000]
      - name: nox
        type: int
        unit: ppb
        description: Nitrogen Oxides index
        nullable: true
        range: [1, 500]

# Silver ETL Configuration (DP-006)
# Transforms Bronze Parquet data to Silver TimescaleDB
silver_etl:
  enabled: true
  target_table: silver.air_quality_observations
  description: "Indoor air quality measurements from AirGradient sensors"
  grain: "One row per sensor reading (~1 minute intervals)"

  # Timestamp mapping from Bronze to Silver
  timestamp:
    source_field: timestamp
    target_field: observation_time
    transform: microseconds_to_timestamp

  # Identity fields (used in deduplication)
  identity_fields:
    - source: ndp_id
      target: ndp_id

  # Field mappings with transforms and DQ rules
  field_mappings:
    - source_path: raw_payload.pm02Compensated
      target_column: pm25
      type: double_precision
      unit: "ug/m3"
      description: "PM2.5 particulate matter concentration (humidity-compensated)"
      nullable: false
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 1000.0
          action: flag

    - source_path: raw_payload.pm10
      target_column: pm10
      type: double_precision
      unit: "ug/m3"
      description: "PM10 particulate matter concentration"
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 2000.0
          action: flag

    - source_path: raw_payload.rco2
      target_column: co2
      type: smallint
      unit: "ppm"
      description: "Carbon dioxide concentration"
      nullable: true
      dq_rules:
        - rule: range_check
          min: 380
          max: 10000
          action: flag

    - source_path: raw_payload.atmpCompensated
      target_column: temperature_c
      type: double_precision
      unit: "Celsius"
      description: "Ambient temperature (sensor-compensated)"
      nullable: true
      dq_rules:
        - rule: range_check
          min: -40.0
          max: 85.0
          action: flag

    - source_path: raw_payload.rhumCompensated
      target_column: humidity_pct
      type: double_precision
      unit: "%"
      description: "Relative humidity (compensated)"
      nullable: true
      dq_rules:
        - rule: range_check
          min: 0.0
          max: 100.0
          action: clamp
          clamp_to_bounds: true

    - source_path: raw_payload.tvocIndex
      target_column: tvoc_index
      type: smallint
      unit: "index"
      description: "Total VOC index (1-500 scale)"
      nullable: true
      dq_rules:
        - rule: range_check
          min: 1
          max: 500
          action: clamp
          clamp_to_bounds: true

    - source_path: raw_payload.noxIndex
      target_column: nox_index
      type: smallint
      unit: "index"
      description: "NOx index (1-500 scale)"
      nullable: true
      dq_rules:
        - rule: range_check
          min: 1
          max: 500
          action: clamp
          clamp_to_bounds: true

  # Additional DQ rules (cross-field, temporal, batch)
  dq_rules:
    # Cross-field validation: PM10 >= PM2.5 (larger particles include smaller)
    - rule: cross_field_check
      name: pm10_gte_pm25
      expression: "pm10 IS NULL OR pm25 IS NULL OR pm10 >= pm25"
      message: "pm10_less_than_pm25"
      action: flag

    # Freshness check
    - rule: freshness_check
      field: observation_time
      max_age: "2 hours"
      max_future: "5 minutes"
      reference: ingestion_time
      action: flag

    # Rate of change for PM2.5 (sudden spikes indicate sensor issues)
    - rule: rate_of_change
      field: pm25
      max_change_per_minute: 100.0
      partition_by: [ndp_id]
      action: flag

    # Rate of change for temperature
    - rule: rate_of_change
      field: temperature_c
      max_change_per_minute: 3.0
      partition_by: [ndp_id]
      action: flag

    # Batch-level completeness check
    - rule: completeness_check
      level: batch
      field: pm25
      min_completeness: 0.95
      action: warn

  # DQ output configuration
  dq_output:
    enabled: true
    target_column: dq_flags
    include_rules: true
    include_values: false
    transparency:
      enabled: true
      table: silver.dq_transparency
      include_sample_payload: true
      max_samples_per_rule: 10

  # Deduplication strategy
  deduplication:
    enabled: true
    key_columns: [observation_time, ndp_id]
    strategy: upsert

  # Incremental processing
  incremental:
    enabled: true
    watermark_column: observation_time
    lag_interval: 5 minutes