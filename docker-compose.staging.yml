version: '3.8'

# Staging environment configuration for Neural Trader
# Usage: docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d

services:
  timescaledb:
    environment:
      - POSTGRES_SHARED_BUFFERS=4GB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=12GB
      - POSTGRES_MAINTENANCE_WORK_MEM=1GB
      - POSTGRES_WORK_MEM=256MB
      - POSTGRES_MAX_CONNECTIONS=300
      - POSTGRES_CHECKPOINT_COMPLETION_TARGET=0.9
      - POSTGRES_WAL_BUFFERS=32MB
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 16G
        reservations:
          cpus: '3'
          memory: 8G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

  redis:
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  data-ingestion:
    environment:
      - LOG_LEVEL=INFO
      - PYTHONOPTIMIZE=1
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 4G
        reservations:
          cpus: '1.5'
          memory: 2G
      replicas: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  neural-trader:
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    restart: unless-stopped
    networks:
      - backend
      - frontend
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8G
        reservations:
          cpus: '3'
          memory: 4G
      replicas: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  prometheus:
    restart: unless-stopped
    networks:
      - monitoring
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    environment:
      - GF_SERVER_ROOT_URL=https://staging.neuraltrader.com
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-staging_admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
    restart: unless-stopped
    networks:
      - monitoring
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Nginx reverse proxy for staging
  nginx:
    image: nginx:alpine
    container_name: neural_trader_nginx_staging
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl-staging:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
    depends_on:
      - neural-trader
      - grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Staging backup service (daily)
  backup:
    image: postgres:16-alpine
    container_name: neural_trader_backup_staging
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-neural_trader_pass}
    volumes:
      - ./backups/staging:/backups
      - ./docker/scripts/backup-staging.sh:/backup.sh:ro
    command: /bin/sh -c "while true; do /backup.sh; sleep 86400; done"
    networks:
      - backend
    depends_on:
      - timescaledb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Log aggregation for staging
  loki:
    image: grafana/loki:latest
    container_name: neural_trader_loki_staging
    volumes:
      - ./docker/loki/loki-staging.yaml:/etc/loki/local-config.yaml:ro
      - loki_staging_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Performance testing service
  performance-test:
    image: prom/prometheus:latest
    container_name: neural_trader_perf_test
    volumes:
      - ./docker/testing/prometheus-test.yml:/etc/prometheus/prometheus.yml:ro
      - perf_test_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - monitoring
    ports:
      - "9091:9090"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
      - testing
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

volumes:
  loki_staging_data:
    driver: local
  perf_test_data:
    driver: local

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.25.0.0/16
  monitoring:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.26.0.0/16