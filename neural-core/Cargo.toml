[package]
name = "neural-core"
version = "0.1.0"
edition = "2021"
authors = ["Neural Trader Team"]
description = "Shared core library for Neural Trader V2 binaries"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async
async-trait = "0.1"
tokio = { version = "1.35", features = ["sync", "macros"] }
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Logging
tracing = "0.1"

# Collections
dashmap = "6.1"

# Math
nalgebra = "0.32"

# Streams
tokio-stream = { version = "0.1", features = ["sync"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "aio", "streams"] }

# gRPC and Protocol Buffers (optional)
tonic = { version = "0.10", optional = true }
prost = { version = "0.12", optional = true }
prost-types = { version = "0.12", optional = true }

# Testing and mocking
mockall = "0.13"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
tokio-test = "0.4"
approx = "0.5"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.10"

[features]
default = ["grpc"]
grpc = ["tonic", "prost", "prost-types"]