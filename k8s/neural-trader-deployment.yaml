# Kubernetes Deployment Manifests for Neural Trader Platform
# Complete cloud-native deployment with service mesh integration

apiVersion: v1
kind: Namespace
metadata:
  name: neural-trader
  labels:
    name: neural-trader
    app.kubernetes.io/name: neural-trader
    app.kubernetes.io/version: "1.0.0"

---
# ============================================================================
# ConfigMaps
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: neural-trader-config
  namespace: neural-trader
data:
  config.toml: |
    [database]
    host = "timescaledb"
    port = 5432
    max_connections = 10
    
    [redis]
    host = "redis"
    port = 6379
    max_connections = 10
    
    [logging]
    level = "info"
    format = "json"
    
    [server]
    api_port = 8080
    metrics_port = 9092
    
    [features]
    neural_enabled = true
    sector_models = true
    realtime_adaptation = true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-ingestion-config
  namespace: neural-trader
data:
  config.yaml: |
    providers:
      primary: "alpaca"
      symbols: ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA"]
      update_interval: "60s"
    
    server:
      host: "0.0.0.0"
      port: 8001
      metrics_port: 9091
    
    rate_limits:
      default: 100
      polygon: 5
      alpha_vantage: 5

---
# ============================================================================
# Secrets
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: neural-trader-secrets
  namespace: neural-trader
type: Opaque
data:
  # Base64 encoded values - replace with actual secrets
  database-url: cG9zdGdyZXNxbDovL25ldXJhbF90cmFkZXI6cGFzc3dvcmRAdGltZXNjYWxlZGI6NTQzMi9uZXVyYWxfdHJhZGVyX2Ri
  redis-url: cmVkaXM6Ly9yZWRpczozNjc5
  jwt-secret: c3VwZXItc2VjdXJlLWp3dC1zZWNyZXQtdGhhdC1zaG91bGQtYmUtcmFuZG9t

---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys
  namespace: neural-trader
type: Opaque
data:
  # Base64 encoded API keys - replace with actual keys
  alpaca-api-key: eW91ci1hbHBhY2EtYXBpLWtleQ==
  alpaca-api-secret: eW91ci1hbHBhY2EtYXBpLXNlY3JldA==
  polygon-api-key: eW91ci1wb2x5Z29uLWFwaS1rZXk=
  finnhub-api-key: eW91ci1maW5uaHViLWFwaS1rZXk=

---
# ============================================================================
# Persistent Volumes
# ============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: neural-models-pv
  namespace: neural-trader
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-ssd
  hostPath:
    path: /mnt/neural-trader/models

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neural-models-pvc
  namespace: neural-trader
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: market-data-pv
  namespace: neural-trader
spec:
  capacity:
    storage: 200Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fast-ssd
  hostPath:
    path: /mnt/neural-trader/market-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-data-pvc
  namespace: neural-trader
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: fast-ssd

---
# ============================================================================
# TimescaleDB Deployment
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  namespace: neural-trader
  labels:
    app: timescaledb
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
      - name: timescaledb
        image: timescale/timescaledb:2.14-pg16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "neural_trader"
        - name: POSTGRES_DB
          value: "neural_trader_db"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: database-password
        - name: TIMESCALEDB_TELEMETRY
          value: "off"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U neural_trader -d neural_trader_db
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U neural_trader -d neural_trader_db
          initialDelaySeconds: 15
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: neural-trader
  labels:
    app: timescaledb
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: timescaledb
  type: ClusterIP

---
# ============================================================================
# Redis Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: neural-trader
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - --maxmemory
        - 2gb
        - --maxmemory-policy
        - allkeys-lru
        - --save
        - "900 1"
        - --save
        - "300 10"
        - --save
        - "60 10000"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: redis-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: neural-trader
  labels:
    app: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis
  type: ClusterIP

---
# ============================================================================
# Neural Trader Core Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neural-trader
  namespace: neural-trader
  labels:
    app: neural-trader
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neural-trader
  template:
    metadata:
      labels:
        app: neural-trader
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: neural-trader
        image: neural-trader/neural-trader:latest
        ports:
        - containerPort: 8080
          name: api
        - containerPort: 9092
          name: metrics
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: redis-url
        - name: RUST_LOG
          value: "info"
        - name: CONFIG_PATH
          value: "/etc/neural-trader"
        - name: MODEL_STORAGE_PATH
          value: "/opt/neural-trader/models"
        - name: ENABLE_SECTOR_MODELS
          value: "true"
        - name: ENABLE_REALTIME_ADAPTATION
          value: "true"
        - name: NEURAL_USE_REAL_MODELS
          value: "true"
        resources:
          requests:
            memory: "3Gi"
            cpu: "1500m"
          limits:
            memory: "6Gi"
            cpu: "3000m"
        volumeMounts:
        - name: neural-models
          mountPath: /opt/neural-trader/models
        - name: market-data
          mountPath: /opt/neural-trader/data
          readOnly: true
        - name: config
          mountPath: /etc/neural-trader
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: 9092
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      - name: neural-models
        persistentVolumeClaim:
          claimName: neural-models-pvc
      - name: market-data
        persistentVolumeClaim:
          claimName: market-data-pvc
      - name: config
        configMap:
          name: neural-trader-config
      - name: tmp-volume
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: neural-trader
  namespace: neural-trader
  labels:
    app: neural-trader
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: api
  - port: 9092
    targetPort: 9092
    name: metrics
  selector:
    app: neural-trader
  type: ClusterIP

---
# ============================================================================
# Data Ingestion Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion
  namespace: neural-trader
  labels:
    app: data-ingestion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-ingestion
  template:
    metadata:
      labels:
        app: data-ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: data-ingestion
        image: neural-trader/data-ingestion:latest
        ports:
        - containerPort: 8001
          name: api
        - containerPort: 9091
          name: metrics
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: redis-url
        - name: LOG_LEVEL
          value: "info"
        - name: PRIMARY_PROVIDER
          value: "alpaca"
        - name: SYMBOLS
          value: "AAPL,MSFT,GOOGL,AMZN,NVDA"
        - name: UPDATE_INTERVAL
          value: "60s"
        - name: ALPACA_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: alpaca-api-key
        - name: ALPACA_API_SECRET
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: alpaca-api-secret
        - name: POLYGON_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: polygon-api-key
        - name: FINNHUB_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-keys
              key: finnhub-api-key
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: market-data
          mountPath: /opt/data-ingestion/data
        - name: config
          mountPath: /etc/data-ingestion
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: market-data
        persistentVolumeClaim:
          claimName: market-data-pvc
      - name: config
        configMap:
          name: data-ingestion-config

---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion
  namespace: neural-trader
  labels:
    app: data-ingestion
spec:
  ports:
  - port: 8001
    targetPort: 8001
    name: api
  - port: 9091
    targetPort: 9091
    name: metrics
  selector:
    app: data-ingestion
  type: ClusterIP

---
# ============================================================================
# Model Manager Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-manager
  namespace: neural-trader
  labels:
    app: model-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-manager
  template:
    metadata:
      labels:
        app: model-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: model-manager
        image: neural-trader/model-manager:latest
        ports:
        - containerPort: 8002
          name: api
        - containerPort: 9093
          name: metrics
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: neural-trader-secrets
              key: redis-url
        - name: RUST_LOG
          value: "info"
        - name: MODEL_STORAGE_PATH
          value: "/opt/model-manager/models"
        - name: MODEL_STORAGE_BACKEND
          value: "filesystem"
        - name: MODEL_VERSIONING
          value: "true"
        - name: AUTO_CLEANUP
          value: "true"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        volumeMounts:
        - name: neural-models
          mountPath: /opt/model-manager/models
        - name: tmp-volume
          mountPath: /opt/model-manager/temp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 9093
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: neural-models
        persistentVolumeClaim:
          claimName: neural-models-pvc
      - name: tmp-volume
        emptyDir:
          sizeLimit: 4Gi

---
apiVersion: v1
kind: Service
metadata:
  name: model-manager
  namespace: neural-trader
  labels:
    app: model-manager
spec:
  ports:
  - port: 8002
    targetPort: 8002
    name: api
  - port: 9093
    targetPort: 9093
    name: metrics
  selector:
    app: model-manager
  type: ClusterIP

---
# ============================================================================
# Horizontal Pod Autoscaler
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neural-trader-hpa
  namespace: neural-trader
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neural-trader
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-ingestion-hpa
  namespace: neural-trader
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-ingestion
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# ============================================================================
# Network Policies
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neural-trader-network-policy
  namespace: neural-trader
spec:
  podSelector:
    matchLabels:
      app: neural-trader
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9092
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: timescaledb
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379

---
# ============================================================================
# Ingress
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neural-trader-ingress
  namespace: neural-trader
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.neural-trader.com
    secretName: neural-trader-tls
  rules:
  - host: api.neural-trader.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: neural-trader
            port:
              number: 8080
      - path: /data/v1
        pathType: Prefix
        backend:
          service:
            name: data-ingestion
            port:
              number: 8001
      - path: /models/v1
        pathType: Prefix
        backend:
          service:
            name: model-manager
            port:
              number: 8002