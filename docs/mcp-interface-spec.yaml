openapi: 3.0.0
info:
  title: Universal Discovery Platform MCP Interface
  version: 1.0.0
  description: |
    MCP (Model Context Protocol) interface for the Universal Discovery Platform.
    Designed for intuitive use by both Claude AI and human users.
    
    ## Overview
    This platform discovers hidden patterns, correlations, and opportunities across 
    multiple data domains using advanced AI and real-time analytics.
    
    ## Authentication
    All endpoints require API key authentication and role-based permissions.
    
    ## Rate Limits
    - Discovery Tools: 100 requests/hour
    - Monitoring Tools: 1000 requests/hour  
    - Execution Tools: 500 requests/hour
    - System Tools: 50 requests/hour
    
  contact:
    name: Neural Trader Support
    email: support@neural-trader.ai
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.neural-trader.ai/v1
    description: Production server
  - url: https://sandbox.neural-trader.ai/v1
    description: Sandbox server

security:
  - ApiKeyAuth: []
  - BearerAuth: []

tags:
  - name: Discovery
    description: Tools for finding patterns and connections
  - name: Monitoring
    description: Tools for tracking and observing
  - name: Execution
    description: Tools for acting on discoveries
  - name: System
    description: Tools for configuration and management

paths:
  # ========================================
  # DISCOVERY TOOLS
  # ========================================
  
  /discovery/market-connections:
    post:
      tags: [Discovery]
      summary: Discover hidden market connections
      description: |
        Finds hidden correlations and connections between different markets, 
        assets, or data sources using AI pattern recognition.
        
        **Use Cases:**
        - Find cross-market arbitrage opportunities
        - Discover leading/lagging indicators
        - Identify market contagion patterns
        - Uncover sentiment-driven correlations
        
        **For Claude:** Use natural language to describe what connections to explore
        **For Humans:** Specify exact parameters or use guided discovery mode
      operationId: discoverMarketConnections
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketConnectionsRequest'
            examples:
              claude_example:
                summary: Claude AI usage
                value:
                  query: "Find connections between crypto fear index and traditional equity volatility"
                  timeframe: "6M"
                  confidence_threshold: 0.75
                  discovery_mode: "guided"
              human_example:
                summary: Human analyst usage
                value:
                  assets: ["BTC", "SPY", "VIX", "GOLD"]
                  correlation_types: ["pearson", "spearman", "mutual_info"]
                  timeframe: "1Y"
                  confidence_threshold: 0.8
                  include_lagged: true
                  max_lag_days: 30
      responses:
        '200':
          description: Market connections discovered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketConnectionsResponse'
              example:
                connections: [
                  {
                    source: "BTC",
                    target: "NASDAQ",
                    correlation: 0.82,
                    lag_days: 2,
                    confidence: 0.91,
                    strength: "strong",
                    type: "leading_indicator"
                  }
                ]
                discovery_insights: [
                  "Bitcoin shows strong leading correlation with NASDAQ tech stocks",
                  "2-day lag provides predictive edge with 91% confidence"
                ]
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimit'

  /discovery/test-hypothesis:
    post:
      tags: [Discovery]
      summary: Test trading or market hypothesis
      description: |
        Tests specific hypotheses using historical data and statistical analysis.
        Provides backtesting, significance testing, and validation metrics.
        
        **Use Cases:**
        - Validate trading strategies
        - Test market theories
        - Verify correlation claims
        - Assess risk factors
        
        **Permission Required:** hypothesis_testing
      operationId: testHypothesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HypothesisTestRequest'
            examples:
              strategy_test:
                summary: Strategy hypothesis test
                value:
                  hypothesis: "RSI oversold signals in crypto provide 15%+ returns within 7 days"
                  test_period: "2Y"
                  parameters:
                    rsi_threshold: 30
                    holding_period: 7
                    asset_class: "cryptocurrency"
                  validation_method: "walk_forward"
              market_theory:
                summary: Market theory test
                value:
                  hypothesis: "High VIX correlates with increased gold demand"
                  test_period: "5Y"
                  parameters:
                    vix_threshold: 25
                    correlation_window: 30
                  validation_method: "bootstrap"
      responses:
        '200':
          description: Hypothesis test completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HypothesisTestResponse'

  /discovery/analyze-correlation:
    post:
      tags: [Discovery]
      summary: Analyze correlations between datasets
      description: |
        Performs deep correlation analysis between multiple data sources
        using various statistical methods and time-series techniques.
        
        **Features:**
        - Multiple correlation methods
        - Time-lagged analysis
        - Rolling correlations
        - Regime-based analysis
        - Non-linear relationships
        
        **Permission Required:** correlation_analysis
      operationId: analyzeCorrelation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrelationAnalysisRequest'
      responses:
        '200':
          description: Correlation analysis completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationAnalysisResponse'

  /discovery/find-patterns:
    post:
      tags: [Discovery]
      summary: Find recurring patterns in data
      description: |
        Uses machine learning to identify recurring patterns, anomalies,
        and predictive signals across multiple data streams.
        
        **Pattern Types:**
        - Technical chart patterns
        - Seasonal patterns
        - Event-driven patterns
        - Anomaly patterns
        - Behavioral patterns
        
        **Permission Required:** pattern_recognition
      operationId: findPatterns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatternFindingRequest'
      responses:
        '200':
          description: Patterns identified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternFindingResponse'

  /discovery/predict-outcomes:
    post:
      tags: [Discovery]
      summary: Predict future outcomes based on patterns
      description: |
        Generates predictions using discovered patterns and AI models.
        Provides confidence intervals and risk assessments.
        
        **Prediction Types:**
        - Price movements
        - Volatility forecasts
        - Event probabilities
        - Trend continuations
        - Risk metrics
        
        **Permission Required:** prediction_modeling
      operationId: predictOutcomes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequest'
      responses:
        '200':
          description: Predictions generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'

  # ========================================
  # MONITORING TOOLS
  # ========================================
  
  /monitoring/watch-markets:
    post:
      tags: [Monitoring]
      summary: Set up real-time market monitoring
      description: |
        Creates real-time monitoring streams for specified markets or conditions.
        Supports webhooks, websockets, and polling mechanisms.
        
        **Monitoring Types:**
        - Price movements
        - Volume spikes
        - Volatility changes
        - Pattern formations
        - Correlation breaks
        
        **Permission Required:** market_monitoring
      operationId: watchMarkets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketWatchRequest'
      responses:
        '201':
          description: Market watch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketWatchResponse'

  /monitoring/track-performance:
    get:
      tags: [Monitoring]
      summary: Track strategy and discovery performance
      description: |
        Retrieves performance metrics for strategies, predictions, and discoveries.
        Includes P&L, accuracy metrics, and risk measures.
        
        **Metrics Available:**
        - Return metrics (total, annualized, Sharpe)
        - Risk metrics (VaR, max drawdown, volatility)
        - Accuracy metrics (hit rate, precision, recall)
        - Attribution analysis
        
        **Permission Required:** performance_tracking
      operationId: trackPerformance
      parameters:
        - name: strategy_id
          in: query
          description: Specific strategy to track
          schema:
            type: string
        - name: timeframe
          in: query
          description: Time period for performance calculation
          schema:
            type: string
            enum: [1D, 1W, 1M, 3M, 6M, 1Y, ALL]
            default: 1M
        - name: include_attribution
          in: query
          description: Include performance attribution analysis
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Performance data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceTrackingResponse'

  /monitoring/alerts:
    get:
      tags: [Monitoring]
      summary: Get active alerts and notifications
      description: |
        Retrieves current alerts from monitoring systems.
        Supports filtering by priority, type, and status.
        
        **Alert Types:**
        - Price alerts
        - Pattern alerts
        - Risk alerts
        - System alerts
        - Performance alerts
        
        **Permission Required:** alert_access
      operationId: getAlerts
      parameters:
        - name: priority
          in: query
          description: Filter by alert priority
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: status
          in: query
          description: Filter by alert status
          schema:
            type: string
            enum: [active, acknowledged, resolved]
        - name: limit
          in: query
          description: Maximum number of alerts to return
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'

  /monitoring/discoveries:
    get:
      tags: [Monitoring]
      summary: View recent discoveries and insights
      description: |
        Retrieves recent discoveries, patterns, and insights generated
        by the platform's AI systems.
        
        **Discovery Categories:**
        - New correlations
        - Pattern formations
        - Anomaly detections
        - Opportunity alerts
        - Risk warnings
        
        **Permission Required:** discovery_access
      operationId: viewDiscoveries
      parameters:
        - name: category
          in: query
          description: Filter by discovery category
          schema:
            type: string
            enum: [correlations, patterns, anomalies, opportunities, risks]
        - name: confidence_min
          in: query
          description: Minimum confidence threshold
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.7
        - name: timeframe
          in: query
          description: Time period for discoveries
          schema:
            type: string
            default: 1D
      responses:
        '200':
          description: Discoveries retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveriesResponse'

  # ========================================
  # EXECUTION TOOLS
  # ========================================
  
  /execution/create-strategy:
    post:
      tags: [Execution]
      summary: Create new trading strategy
      description: |
        Creates a new trading strategy based on discovered patterns or rules.
        Supports both algorithmic and discretionary strategies.
        
        **Strategy Types:**
        - Pattern-based strategies
        - Correlation strategies  
        - Mean reversion strategies
        - Momentum strategies
        - Risk parity strategies
        
        **Permission Required:** strategy_creation
      operationId: createStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreationRequest'
      responses:
        '201':
          description: Strategy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyCreationResponse'

  /execution/deploy-rule:
    post:
      tags: [Execution]
      summary: Deploy trading rule or signal
      description: |
        Deploys a specific trading rule or signal generator based on
        discovered patterns or conditions.
        
        **Rule Types:**
        - Entry/exit rules
        - Risk management rules
        - Position sizing rules
        - Rebalancing rules
        - Stop-loss rules
        
        **Permission Required:** rule_deployment
      operationId: deployRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleDeploymentRequest'
      responses:
        '201':
          description: Rule deployed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleDeploymentResponse'

  /execution/execute-trade:
    post:
      tags: [Execution]
      summary: Execute trading order
      description: |
        Executes a trading order based on strategy signals or manual input.
        Supports various order types and execution algorithms.
        
        **Order Types:**
        - Market orders
        - Limit orders
        - Stop orders
        - Algorithmic orders (TWAP, VWAP)
        - Conditional orders
        
        **Permission Required:** trade_execution
      operationId: executeTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeExecutionRequest'
      responses:
        '200':
          description: Trade executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeExecutionResponse'

  /execution/portfolio:
    get:
      tags: [Execution]
      summary: Manage portfolio positions
      description: |
        Retrieves current portfolio positions, performance, and risk metrics.
        Supports portfolio optimization and rebalancing recommendations.
        
        **Portfolio Views:**
        - Current positions
        - Asset allocation
        - Risk exposure
        - Performance attribution
        - Rebalancing needs
        
        **Permission Required:** portfolio_management
      operationId: managePortfolio
      parameters:
        - name: include_recommendations
          in: query
          description: Include optimization recommendations
          schema:
            type: boolean
            default: false
        - name: risk_level
          in: query
          description: Desired risk level for recommendations
          schema:
            type: string
            enum: [conservative, moderate, aggressive]
      responses:
        '200':
          description: Portfolio data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioManagementResponse'

  # ========================================
  # SYSTEM TOOLS
  # ========================================
  
  /system/configure-streams:
    post:
      tags: [System]
      summary: Configure data streams
      description: |
        Configures real-time data streams and feeds for the platform.
        Manages data source connections and processing pipelines.
        
        **Stream Types:**
        - Market data streams
        - News feeds
        - Social sentiment streams
        - Economic data feeds
        - Alternative data sources
        
        **Permission Required:** system_admin
      operationId: configureStreams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamConfigurationRequest'
      responses:
        '200':
          description: Streams configured successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamConfigurationResponse'

  /system/manage-domains:
    post:
      tags: [System]
      summary: Manage discovery domains
      description: |
        Manages different discovery domains and their configurations.
        Controls which data sources and patterns are analyzed.
        
        **Domain Types:**
        - Equity markets
        - Fixed income
        - Commodities
        - Cryptocurrencies
        - Alternative investments
        
        **Permission Required:** domain_management
      operationId: manageDomains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainManagementRequest'
      responses:
        '200':
          description: Domains managed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainManagementResponse'

  /system/parameters:
    put:
      tags: [System]
      summary: Set system parameters
      description: |
        Updates global system parameters for discovery algorithms,
        risk management, and execution systems.
        
        **Parameter Categories:**
        - Discovery sensitivity
        - Risk thresholds
        - Execution settings
        - Performance targets
        - Alert configurations
        
        **Permission Required:** parameter_management
      operationId: setParameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParameterUpdateRequest'
      responses:
        '200':
          description: Parameters updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterUpdateResponse'

  /system/scaling:
    post:
      tags: [System]
      summary: Control system scaling
      description: |
        Controls system scaling for handling increased load,
        data processing, and computational requirements.
        
        **Scaling Options:**
        - Auto-scaling rules
        - Resource allocation
        - Processing priority
        - Queue management
        - Load balancing
        
        **Permission Required:** scaling_control
      operationId: controlScaling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScalingControlRequest'
      responses:
        '200':
          description: Scaling configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScalingControlResponse'

# ========================================
# COMPONENTS
# ========================================

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Discovery Schemas
    MarketConnectionsRequest:
      type: object
      properties:
        query:
          type: string
          description: Natural language query for Claude AI
          example: "Find connections between crypto markets and traditional finance"
        assets:
          type: array
          items:
            type: string
          description: Specific assets to analyze
          example: ["BTC", "ETH", "SPY", "QQQ"]
        timeframe:
          type: string
          enum: [1D, 1W, 1M, 3M, 6M, 1Y, 2Y, 5Y]
          description: Analysis timeframe
          default: 6M
        correlation_types:
          type: array
          items:
            type: string
            enum: [pearson, spearman, kendall, mutual_info, maximal_info]
          description: Types of correlation to calculate
          default: [pearson, spearman]
        confidence_threshold:
          type: number
          minimum: 0.5
          maximum: 1.0
          description: Minimum confidence for connections
          default: 0.75
        include_lagged:
          type: boolean
          description: Include time-lagged correlations
          default: true
        max_lag_days:
          type: integer
          minimum: 1
          maximum: 90
          description: Maximum lag to consider
          default: 30
        discovery_mode:
          type: string
          enum: [guided, exhaustive, targeted]
          description: Discovery approach
          default: guided

    MarketConnectionsResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/MarketConnection'
        discovery_insights:
          type: array
          items:
            type: string
          description: AI-generated insights about discovered connections
        metadata:
          $ref: '#/components/schemas/AnalysisMetadata'

    MarketConnection:
      type: object
      properties:
        source:
          type: string
          description: Source asset or market
        target:
          type: string
          description: Target asset or market
        correlation:
          type: number
          description: Correlation coefficient
        lag_days:
          type: integer
          description: Time lag in days (0 for contemporaneous)
        confidence:
          type: number
          description: Statistical confidence in connection
        strength:
          type: string
          enum: [weak, moderate, strong, very_strong]
        type:
          type: string
          enum: [contemporaneous, leading_indicator, lagging_indicator, bidirectional]
        statistical_significance:
          type: number
          description: P-value of the relationship

    HypothesisTestRequest:
      type: object
      required: [hypothesis, test_period]
      properties:
        hypothesis:
          type: string
          description: Hypothesis to test in natural language
          example: "RSI oversold signals provide positive returns within 7 days"
        test_period:
          type: string
          description: Historical period for testing
          example: "2Y"
        parameters:
          type: object
          description: Specific parameters for the hypothesis
          additionalProperties: true
        validation_method:
          type: string
          enum: [backtest, walk_forward, bootstrap, monte_carlo]
          default: backtest
        significance_level:
          type: number
          minimum: 0.01
          maximum: 0.1
          default: 0.05

    HypothesisTestResponse:
      type: object
      properties:
        hypothesis:
          type: string
          description: Original hypothesis tested
        result:
          type: string
          enum: [supported, rejected, inconclusive]
        p_value:
          type: number
          description: Statistical p-value
        confidence_interval:
          type: object
          properties:
            lower:
              type: number
            upper:
              type: number
            confidence_level:
              type: number
        effect_size:
          type: number
          description: Magnitude of the effect
        validation_results:
          type: object
          description: Results from validation method
          additionalProperties: true
        recommendations:
          type: array
          items:
            type: string
          description: Recommendations based on test results

    CorrelationAnalysisRequest:
      type: object
      required: [datasets]
      properties:
        datasets:
          type: array
          items:
            type: string
          description: Datasets to analyze for correlations
        methods:
          type: array
          items:
            type: string
            enum: [pearson, spearman, kendall, mutual_info, distance_correlation]
          default: [pearson, spearman]
        time_window:
          type: integer
          description: Rolling window size for time-series analysis
        include_partial_correlations:
          type: boolean
          default: false
        regime_analysis:
          type: boolean
          description: Analyze correlations in different market regimes
          default: false

    CorrelationAnalysisResponse:
      type: object
      properties:
        correlation_matrix:
          type: object
          description: Correlation matrices for each method
        time_series_correlations:
          type: array
          description: Time-varying correlations
        regime_correlations:
          type: object
          description: Correlations by market regime
        insights:
          type: array
          items:
            type: string

    PatternFindingRequest:
      type: object
      required: [data_sources]
      properties:
        data_sources:
          type: array
          items:
            type: string
          description: Data sources to analyze for patterns
        pattern_types:
          type: array
          items:
            type: string
            enum: [technical, seasonal, event_driven, anomaly, behavioral]
        lookback_period:
          type: string
          description: Historical period to analyze
        min_pattern_frequency:
          type: integer
          description: Minimum occurrences for pattern validity
          default: 3
        confidence_threshold:
          type: number
          minimum: 0.5
          maximum: 1.0
          default: 0.8

    PatternFindingResponse:
      type: object
      properties:
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/Pattern'
        pattern_statistics:
          type: object
          description: Statistical summary of found patterns
        recommendations:
          type: array
          items:
            type: string

    Pattern:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        frequency:
          type: integer
        confidence:
          type: number
        description:
          type: string
        conditions:
          type: array
          items:
            type: string
        historical_performance:
          type: object
          properties:
            success_rate:
              type: number
            average_return:
              type: number
            max_drawdown:
              type: number

    PredictionRequest:
      type: object
      required: [target_variable, prediction_horizon]
      properties:
        target_variable:
          type: string
          description: What to predict
        prediction_horizon:
          type: string
          description: Time horizon for prediction
          example: "1D", "1W", "1M"
        input_features:
          type: array
          items:
            type: string
          description: Features to use for prediction
        model_type:
          type: string
          enum: [neural_network, random_forest, xgboost, lstm, transformer]
          default: neural_network
        confidence_intervals:
          type: boolean
          description: Include prediction confidence intervals
          default: true

    PredictionResponse:
      type: object
      properties:
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/Prediction'
        model_performance:
          type: object
          description: Model validation metrics
        feature_importance:
          type: array
          items:
            type: object
            properties:
              feature:
                type: string
              importance:
                type: number

    Prediction:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
        confidence:
          type: number
        confidence_interval:
          type: object
          properties:
            lower:
              type: number
            upper:
              type: number
        probability_distribution:
          type: object
          description: Full probability distribution if available

    # Monitoring Schemas
    MarketWatchRequest:
      type: object
      required: [watch_name, conditions]
      properties:
        watch_name:
          type: string
          description: Name for this watch configuration
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/WatchCondition'
        notification_settings:
          $ref: '#/components/schemas/NotificationSettings'
        update_frequency:
          type: string
          enum: [realtime, 1min, 5min, 15min, 1hour]
          default: realtime

    WatchCondition:
      type: object
      properties:
        asset:
          type: string
        condition_type:
          type: string
          enum: [price_change, volume_spike, volatility_change, pattern_formation]
        threshold:
          type: number
        direction:
          type: string
          enum: [above, below, crosses_above, crosses_below]

    NotificationSettings:
      type: object
      properties:
        webhook_url:
          type: string
          format: uri
        email:
          type: string
          format: email
        push_notification:
          type: boolean
        priority:
          type: string
          enum: [low, medium, high, critical]

    MarketWatchResponse:
      type: object
      properties:
        watch_id:
          type: string
        status:
          type: string
          enum: [active, inactive, error]
        created_at:
          type: string
          format: date-time
        estimated_triggers_per_day:
          type: number

    PerformanceTrackingResponse:
      type: object
      properties:
        strategy_id:
          type: string
        timeframe:
          type: string
        returns:
          $ref: '#/components/schemas/ReturnMetrics'
        risk_metrics:
          $ref: '#/components/schemas/RiskMetrics'
        attribution:
          $ref: '#/components/schemas/AttributionAnalysis'

    ReturnMetrics:
      type: object
      properties:
        total_return:
          type: number
        annualized_return:
          type: number
        sharpe_ratio:
          type: number
        sortino_ratio:
          type: number
        calmar_ratio:
          type: number
        hit_rate:
          type: number
          description: Percentage of profitable trades

    RiskMetrics:
      type: object
      properties:
        volatility:
          type: number
        max_drawdown:
          type: number
        var_95:
          type: number
          description: Value at Risk (95% confidence)
        expected_shortfall:
          type: number
        beta:
          type: number
        tracking_error:
          type: number

    AttributionAnalysis:
      type: object
      properties:
        alpha:
          type: number
        factor_exposures:
          type: object
          additionalProperties:
            type: number
        sector_attribution:
          type: object
          additionalProperties:
            type: number

    AlertsResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        total_count:
          type: integer
        unread_count:
          type: integer

    Alert:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [price, pattern, risk, system, performance]
        priority:
          type: string
          enum: [low, medium, high, critical]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, acknowledged, resolved]
        affected_assets:
          type: array
          items:
            type: string

    DiscoveriesResponse:
      type: object
      properties:
        discoveries:
          type: array
          items:
            $ref: '#/components/schemas/Discovery'
        summary:
          type: object
          properties:
            total_discoveries:
              type: integer
            high_confidence_count:
              type: integer
            actionable_count:
              type: integer

    Discovery:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
          enum: [correlation, pattern, anomaly, opportunity, risk]
        title:
          type: string
        description:
          type: string
        confidence:
          type: number
        actionability:
          type: string
          enum: [low, medium, high]
        timestamp:
          type: string
          format: date-time
        affected_assets:
          type: array
          items:
            type: string
        potential_impact:
          type: string
          enum: [low, medium, high, critical]

    # Execution Schemas
    StrategyCreationRequest:
      type: object
      required: [name, strategy_type]
      properties:
        name:
          type: string
          description: Strategy name
        strategy_type:
          type: string
          enum: [pattern_based, correlation, mean_reversion, momentum, risk_parity]
        description:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/TradingRule'
        risk_parameters:
          $ref: '#/components/schemas/RiskParameters'
        universe:
          type: array
          items:
            type: string
          description: Assets the strategy can trade

    TradingRule:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [entry, exit, risk_management, position_sizing]
        conditions:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string

    RiskParameters:
      type: object
      properties:
        max_position_size:
          type: number
          description: Maximum position size as percentage of portfolio
        max_portfolio_risk:
          type: number
          description: Maximum portfolio risk (VaR)
        stop_loss:
          type: number
          description: Stop loss percentage
        max_drawdown:
          type: number
          description: Maximum allowable drawdown

    StrategyCreationResponse:
      type: object
      properties:
        strategy_id:
          type: string
        status:
          type: string
          enum: [created, backtesting, ready, error]
        backtest_results:
          $ref: '#/components/schemas/BacktestResults'

    BacktestResults:
      type: object
      properties:
        period:
          type: string
        total_return:
          type: number
        sharpe_ratio:
          type: number
        max_drawdown:
          type: number
        win_rate:
          type: number
        trade_count:
          type: integer

    RuleDeploymentRequest:
      type: object
      required: [rule_name, rule_type, conditions]
      properties:
        rule_name:
          type: string
        rule_type:
          type: string
          enum: [entry, exit, risk_management, rebalancing, stop_loss]
        conditions:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: string
        priority:
          type: integer
          minimum: 1
          maximum: 10
        active:
          type: boolean
          default: true

    RuleDeploymentResponse:
      type: object
      properties:
        rule_id:
          type: string
        status:
          type: string
          enum: [deployed, testing, active, inactive, error]
        deployment_time:
          type: string
          format: date-time

    TradeExecutionRequest:
      type: object
      required: [asset, side, quantity]
      properties:
        asset:
          type: string
          description: Asset to trade
        side:
          type: string
          enum: [buy, sell]
        quantity:
          type: number
          description: Quantity to trade
        order_type:
          type: string
          enum: [market, limit, stop, stop_limit, twap, vwap]
          default: market
        limit_price:
          type: number
          description: Limit price for limit orders
        stop_price:
          type: number
          description: Stop price for stop orders
        time_in_force:
          type: string
          enum: [day, gtc, ioc, fok]
          default: day
        execution_algorithm:
          type: string
          enum: [aggressive, passive, stealth, implementation_shortfall]
          default: aggressive

    TradeExecutionResponse:
      type: object
      properties:
        order_id:
          type: string
        status:
          type: string
          enum: [pending, partially_filled, filled, cancelled, rejected]
        filled_quantity:
          type: number
        average_price:
          type: number
        commission:
          type: number
        execution_time:
          type: string
          format: date-time

    PortfolioManagementResponse:
      type: object
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        total_value:
          type: number
        cash_balance:
          type: number
        allocated_capital:
          type: number
        asset_allocation:
          type: object
          additionalProperties:
            type: number
        risk_metrics:
          $ref: '#/components/schemas/PortfolioRiskMetrics'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioRecommendation'

    Position:
      type: object
      properties:
        asset:
          type: string
        quantity:
          type: number
        market_value:
          type: number
        cost_basis:
          type: number
        unrealized_pnl:
          type: number
        weight:
          type: number
          description: Position weight in portfolio

    PortfolioRiskMetrics:
      type: object
      properties:
        portfolio_var:
          type: number
        portfolio_volatility:
          type: number
        concentration_risk:
          type: number
        correlation_risk:
          type: number
        sector_exposures:
          type: object
          additionalProperties:
            type: number

    PortfolioRecommendation:
      type: object
      properties:
        type:
          type: string
          enum: [rebalance, hedge, reduce_risk, increase_exposure]
        asset:
          type: string
        action:
          type: string
          enum: [buy, sell, reduce, increase]
        quantity:
          type: number
        rationale:
          type: string

    # System Schemas
    StreamConfigurationRequest:
      type: object
      required: [stream_name, data_source]
      properties:
        stream_name:
          type: string
        data_source:
          type: string
          enum: [market_data, news, social_sentiment, economic, alternative]
        provider:
          type: string
        configuration:
          type: object
          additionalProperties: true
        update_frequency:
          type: string
          enum: [realtime, 1min, 5min, 15min, 1hour, daily]
        active:
          type: boolean
          default: true

    StreamConfigurationResponse:
      type: object
      properties:
        stream_id:
          type: string
        status:
          type: string
          enum: [configured, connecting, active, error]
        estimated_data_rate:
          type: string

    DomainManagementRequest:
      type: object
      required: [domain_name, action]
      properties:
        domain_name:
          type: string
          enum: [equities, fixed_income, commodities, cryptocurrencies, alternatives]
        action:
          type: string
          enum: [enable, disable, configure, optimize]
        configuration:
          type: object
          additionalProperties: true

    DomainManagementResponse:
      type: object
      properties:
        domain_name:
          type: string
        status:
          type: string
          enum: [active, inactive, configuring]
        coverage:
          type: object
          properties:
            assets_covered:
              type: integer
            data_sources:
              type: integer

    ParameterUpdateRequest:
      type: object
      properties:
        discovery_parameters:
          type: object
          properties:
            sensitivity:
              type: number
              minimum: 0.1
              maximum: 1.0
            confidence_threshold:
              type: number
              minimum: 0.5
              maximum: 0.99
        risk_parameters:
          type: object
          properties:
            max_var:
              type: number
            max_drawdown:
              type: number
            concentration_limit:
              type: number
        execution_parameters:
          type: object
          properties:
            slippage_tolerance:
              type: number
            market_impact_limit:
              type: number

    ParameterUpdateResponse:
      type: object
      properties:
        updated_parameters:
          type: array
          items:
            type: string
        validation_status:
          type: string
          enum: [valid, warnings, errors]
        warnings:
          type: array
          items:
            type: string

    ScalingControlRequest:
      type: object
      required: [scaling_action]
      properties:
        scaling_action:
          type: string
          enum: [scale_up, scale_down, auto_scale, manual_scale]
        target_capacity:
          type: integer
          description: Target processing capacity percentage
        components:
          type: array
          items:
            type: string
            enum: [discovery_engine, execution_engine, data_processing, monitoring]

    ScalingControlResponse:
      type: object
      properties:
        current_capacity:
          type: integer
        target_capacity:
          type: integer
        scaling_status:
          type: string
          enum: [scaling_up, scaling_down, stable, error]
        estimated_completion:
          type: string
          format: date-time

    # Common Schemas
    AnalysisMetadata:
      type: object
      properties:
        analysis_id:
          type: string
        timestamp:
          type: string
          format: date-time
        data_quality:
          type: number
          description: Data quality score (0-1)
        computation_time:
          type: number
          description: Analysis computation time in seconds
        cache_status:
          type: string
          enum: [fresh, cached, stale]

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "INVALID_PARAMETERS"
            message: "Required parameter 'assets' is missing"
            timestamp: "2024-01-15T10:30:00Z"

    Unauthorized:
      description: Unauthorized - invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "UNAUTHORIZED"
            message: "Invalid or missing API key"
            timestamp: "2024-01-15T10:30:00Z"

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "INSUFFICIENT_PERMISSIONS"
            message: "User lacks required permission: hypothesis_testing"
            timestamp: "2024-01-15T10:30:00Z"

    RateLimit:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "RATE_LIMIT_EXCEEDED"
            message: "Discovery tools rate limit exceeded. Limit: 100 requests/hour"
            timestamp: "2024-01-15T10:30:00Z"
      headers:
        X-RateLimit-Limit:
          description: The rate limit ceiling for this endpoint
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: The number of requests left for the time window
          schema:
            type: integer
        X-RateLimit-Reset:
          description: The time when the rate limit window resets (Unix timestamp)
          schema:
            type: integer

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: "INTERNAL_ERROR"
            message: "An unexpected error occurred while processing the request"
            timestamp: "2024-01-15T10:30:00Z"