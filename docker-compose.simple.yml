# Simple Docker Compose for Neural Trader
services:
  neural-trader:
    build:
      context: .
      dockerfile: Dockerfile.simple
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev_password}@timescaledb:5432/neural_trader
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=debug
      - RUST_LOG=debug
    ports:
      - "3030:3030"
    depends_on:
      - timescaledb
      - redis

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=neural_trader
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neural_trader"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  data-ingestion:
    build:
      context: .
      dockerfile: ./data_ingestion/Dockerfile.simple
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-dev_password}@timescaledb:5432/neural_trader
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_DATABASE=neural_trader
      - TIMESCALE_USER=postgres
      - TIMESCALE_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
      # API Keys
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ALPHA_ADVANTAGE_API_KEY=${ALPHA_ADVANTAGE_API_KEY}
      - IEX_CLOUD_API_KEY=${IEX_CLOUD_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - QUANDL_API_KEY=${QUANDL_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-finnhub}
      - NASDAQ_API_KEY=${NASDAQ_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
    ports:
      - "8001:8001"
      - "9091:9090"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-neural_trader}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  timescaledb_data:
  redis_data:
  prometheus_data:
  grafana_data: