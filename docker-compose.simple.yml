version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: neural_trader_timescaledb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-neural_trader}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-neural_trader_db}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - neural_trader_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neural_trader_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neural_trader_net
    restart: unless-stopped

volumes:
  timescale_data:
  redis_data:

networks:
  neural_trader_net:
    driver: bridge