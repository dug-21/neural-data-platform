version: '3.8'

services:
  neural-trader-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      - DATABASE_URL=postgresql://postgres:test_password@timescaledb-test:5432/neural_trader_test
      - REDIS_URL=redis://redis-test:6379
      - LOG_LEVEL=debug
      - RUST_LOG=debug
    depends_on:
      timescaledb-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./target:/app/target
    networks:
      - neural_trader_test
    command: cargo test --all

  timescaledb-test:
    image: timescale/timescaledb:latest-pg16
    environment:
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=neural_trader_test
      - TIMESCALEDB_TELEMETRY=off
    volumes:
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - neural_trader_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    tmpfs:
      - /data
    networks:
      - neural_trader_test
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  data-ingestion-test:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile.test
    environment:
      - DATABASE_URL=postgresql://postgres:test_password@timescaledb-test:5432/neural_trader_test
      - REDIS_URL=redis://redis-test:6379
      - LOG_LEVEL=debug
      - ALPHA_VANTAGE_API_KEY=test_key
      - POLYGON_API_KEY=test_key
      - FINNHUB_API_KEY=test_key
      - IEX_CLOUD_API_KEY=test_key
    depends_on:
      timescaledb-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./data_ingestion:/app:ro
    networks:
      - neural_trader_test
    command: python -m pytest tests/ -v --cov=./ --cov-report=html

  integration-test:
    build:
      context: .
      dockerfile: Dockerfile.integration
    environment:
      - DATABASE_URL=postgresql://postgres:test_password@timescaledb-test:5432/neural_trader_test
      - REDIS_URL=redis://redis-test:6379
      - DATA_INGESTION_URL=http://data-ingestion-test:8001
      - NEURAL_TRADER_URL=http://neural-trader-test:3030
    depends_on:
      neural-trader-test:
        condition: service_healthy
      data-ingestion-test:
        condition: service_healthy
    volumes:
      - ./tests/integration:/app/tests:ro
      - ./test-results:/app/results
    networks:
      - neural_trader_test
    command: python -m pytest tests/ -v --junitxml=results/integration-test-results.xml

  benchmark-test:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    environment:
      - DATABASE_URL=postgresql://postgres:test_password@timescaledb-test:5432/neural_trader_test
      - REDIS_URL=redis://redis-test:6379
    depends_on:
      timescaledb-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./tests/benchmark:/app/tests:ro
      - ./benchmark-results:/app/results
    networks:
      - neural_trader_test
    command: python -m pytest tests/ -v --benchmark-json=results/benchmark-results.json

networks:
  neural_trader_test:
    driver: bridge
    internal: true