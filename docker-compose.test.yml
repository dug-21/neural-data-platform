version: '3.8'

# Docker Compose configuration for Config-Store Integration Tests
# This environment provides all necessary services for comprehensive testing
# of config-store integration with data-ingestion components

services:
  # PostgreSQL Database for Config-Store and Data Storage
  postgres-test:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: neural-trader-postgres-test
    environment:
      POSTGRES_DB: neural_trader_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password_123
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    ports:
      - "5433:5432"  # Use different port to avoid conflicts
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./tests/integration/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neural_trader_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Redis for Config-Store Backend and Caching
  redis-test:
    image: redis:7-alpine
    container_name: neural-trader-redis-test
    command: redis-server --appendonly yes --requirepass test_redis_pass
    ports:
      - "6380:6379"  # Use different port to avoid conflicts
    volumes:
      - redis_test_data:/data
      - ./tests/integration/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Mock Config-Store Service
  config-store-mock:
    build:
      context: ./tests/integration/mocks
      dockerfile: Dockerfile.config-store
    container_name: neural-trader-config-store-mock
    environment:
      REDIS_URL: redis://:test_redis_pass@redis-test:6379
      POSTGRES_URL: postgresql://postgres:test_password_123@postgres-test:5432/neural_trader_test
      LOG_LEVEL: DEBUG
      ENCRYPTION_KEY: test_encryption_key_32_chars_long
    ports:
      - "8081:8080"
    depends_on:
      redis-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - test-network

  # Data Ingestion Service for Integration Testing
  data-ingestion-test:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile.test
    container_name: neural-trader-data-ingestion-test
    environment:
      # Config Store Integration
      CONFIG_STORE_ENABLED: "true"
      CONFIG_STORE_URL: http://config-store-mock:8080
      CONFIG_STORE_PREFIX: neural_trader_test
      CONFIG_STORE_FALLBACK_TO_ENV: "true"
      CONFIG_STORE_CACHE_TTL: "300"
      CONFIG_STORE_RETRY_ATTEMPTS: "3"
      CONFIG_STORE_TIMEOUT: "10"
      
      # Fallback Environment Variables
      POLYGON_API_KEY: test_polygon_key_fallback
      ALPACA_API_KEY: test_alpaca_key_fallback  
      ALPACA_API_SECRET: test_alpaca_secret_fallback
      
      # Database Configuration
      DATABASE_URL: postgresql://postgres:test_password_123@postgres-test:5432/neural_trader_test
      REDIS_URL: redis://:test_redis_pass@redis-test:6379
      
      # Rate Limiting
      RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
      RATE_LIMIT_BURST_SIZE: "10"
      
      # Performance Settings
      MAX_CONCURRENT_REQUESTS: "5"
      REQUEST_TIMEOUT: "30"
      
      # Test Environment Settings
      ENVIRONMENT: test
      LOG_LEVEL: DEBUG
      METRICS_ENABLED: "true"
      METRICS_PORT: "8000"
      
      # Provider Settings for Testing
      PRIMARY_PROVIDER: polygon
      FALLBACK_PROVIDERS: '["alpaca", "iex_cloud"]'
      ACTIVE_PROVIDERS: '["polygon", "alpaca"]'
      
      # Hot Reload Configuration
      CONFIG_HOT_RELOAD_ENABLED: "true"
      CONFIG_HOT_RELOAD_INTERVAL: "30"
      CONFIG_CHANGE_NOTIFICATION: "redis"
    ports:
      - "8002:8000"  # Metrics port
      - "8082:8080"  # API port
    depends_on:
      config-store-mock:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./tests/integration/data:/app/test-data
      - ./tests/integration/configs:/app/configs
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - test-network

  # Test Runner Container
  integration-test-runner:
    build:
      context: .
      dockerfile: ./tests/integration/Dockerfile.test-runner
    container_name: neural-trader-integration-test-runner
    environment:
      # Test Environment Configuration
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_DB: neural_trader_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password_123
      
      REDIS_HOST: redis-test
      REDIS_PORT: "6379"
      REDIS_PASSWORD: test_redis_pass
      REDIS_DB: "15"  # Use separate DB for tests
      
      CONFIG_STORE_URL: http://config-store-mock:8080
      DATA_INGESTION_URL: http://data-ingestion-test:8080
      
      # Test Configuration
      TEST_PREFIX: neural_trader_test
      TEST_TIMEOUT: "300"
      PYTEST_ARGS: "-v --tb=short --junit-xml=/app/test-results/results.xml"
      
      # Coverage Configuration
      COVERAGE_ENABLED: "true"
      COVERAGE_MIN_PERCENTAGE: "85"
    depends_on:
      data-ingestion-test:
        condition: service_healthy
      config-store-mock:
        condition: service_healthy
    volumes:
      - ./tests/integration:/app/tests
      - ./test-results:/app/test-results
      - ./coverage-reports:/app/coverage
    command: >
      sh -c "
        echo 'Waiting for services to be ready...' &&
        sleep 30 &&
        echo 'Starting integration tests...' &&
        python -m pytest /app/tests/test_data_ingestion_config.py \
          --cov=/app/tests \
          --cov-report=html:/app/coverage/html \
          --cov-report=xml:/app/coverage/coverage.xml \
          --cov-fail-under=85 \
          --junit-xml=/app/test-results/integration-tests.xml \
          -v --tb=short
      "
    networks:
      - test-network

  # Monitoring and Observability for Tests
  prometheus-test:
    image: prom/prometheus:latest
    container_name: neural-trader-prometheus-test
    ports:
      - "9091:9090"
    volumes:
      - ./tests/integration/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - test-network

  # Grafana for Test Monitoring Dashboards
  grafana-test:
    image: grafana/grafana:latest
    container_name: neural-trader-grafana-test
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: test_admin_pass
    volumes:
      - grafana_test_data:/var/lib/grafana
      - ./tests/integration/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./tests/integration/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - test-network

volumes:
  postgres_test_data:
    driver: local
  redis_test_data:
    driver: local
  grafana_test_data:
    driver: local

networks:
  test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Health check and utility services
services:
  # Health Check Service
  health-checker:
    image: alpine:latest
    container_name: neural-trader-health-checker
    command: >
      sh -c "
        apk add --no-cache curl &&
        echo 'Performing comprehensive health checks...' &&
        
        # Wait for services
        sleep 60 &&
        
        # Check PostgreSQL
        echo 'Checking PostgreSQL...' &&
        nc -z postgres-test 5432 || exit 1 &&
        
        # Check Redis
        echo 'Checking Redis...' &&
        nc -z redis-test 6379 || exit 1 &&
        
        # Check Config Store
        echo 'Checking Config Store...' &&
        curl -f http://config-store-mock:8080/health || exit 1 &&
        
        # Check Data Ingestion
        echo 'Checking Data Ingestion...' &&
        curl -f http://data-ingestion-test:8000/health || exit 1 &&
        
        echo 'All services are healthy!' &&
        sleep 3600  # Keep container running
      "
    depends_on:
      - postgres-test
      - redis-test  
      - config-store-mock
      - data-ingestion-test
    networks:
      - test-network

# Override configurations for different test scenarios
x-test-scenarios:
  # Scenario 1: Config Store Unavailable (Fallback Testing)
  config-store-down: &config-store-down
    environment:
      CONFIG_STORE_ENABLED: "false"
      CONFIG_STORE_FALLBACK_TO_ENV: "true"

  # Scenario 2: Partial Migration (Hybrid Configuration)  
  partial-migration: &partial-migration
    environment:
      CONFIG_STORE_ENABLED: "true"
      CONFIG_STORE_PARTIAL_MODE: "true"
      CONFIG_STORE_MIGRATION_PHASE: "partial"

  # Scenario 3: Complete Migration (Config Store Only)
  complete-migration: &complete-migration
    environment:
      CONFIG_STORE_ENABLED: "true"
      CONFIG_STORE_FALLBACK_TO_ENV: "false"
      CONFIG_STORE_MIGRATION_PHASE: "complete"

  # Scenario 4: High Load Testing
  high-load: &high-load
    environment:
      MAX_CONCURRENT_REQUESTS: "50"
      RATE_LIMIT_REQUESTS_PER_MINUTE: "1000"
      CONFIG_STORE_CACHE_TTL: "60"

# Test execution profiles
profiles:
  # Basic integration tests
  integration:
    - postgres-test
    - redis-test
    - config-store-mock
    - data-ingestion-test
    - integration-test-runner

  # Full test suite with monitoring
  full:
    - postgres-test
    - redis-test
    - config-store-mock
    - data-ingestion-test
    - integration-test-runner
    - prometheus-test
    - grafana-test
    - health-checker

  # Fallback testing (config-store unavailable)
  fallback:
    - postgres-test
    - redis-test
    - data-ingestion-test
    - integration-test-runner

  # Performance testing
  performance:
    - postgres-test
    - redis-test
    - config-store-mock
    - data-ingestion-test
    - prometheus-test
    - integration-test-runner